# Dependabot configuration.
#
# Why this file exists: before it, nothing in this repo refreshed any
# dependency manifest on a schedule. The npm side is the sharp edge —
# there are NINE independent `pnpm-lock.yaml` files here, and the root
# `pnpm-workspace.yaml` only covers `packages/*`. Every `examples/*` root
# is deliberately its own disjoint pnpm workspace (see the header comment
# in `examples/react-vite-swr/pnpm-workspace.yaml` for the rationale), so
# a single npm entry pointed at `/` would monitor the root workspace and
# silently leave the eight example lockfiles untouched forever. That is
# not hypothetical: it is the direct cause of the HIGH-severity advisory
# backlog that accumulated in the example apps. Hence the explicit
# per-directory enumeration below — if you add a new `pnpm-lock.yaml`
# anywhere, you MUST add its directory here or it is unmonitored.
#
# Keep this list in sync with:
#   find . -name pnpm-lock.yaml -not -path '*/node_modules/*'
#
# Note on `examples/react-vite-swr`: its lockfile sits at the example
# root, but that root has NO `package.json` — it is a bare pnpm workspace
# root whose only members are `client/` and `web/`. Dependabot's npm
# ecosystem keys off a manifest, so the two members are listed instead of
# the workspace root; they share, and therefore refresh, the same
# `examples/react-vite-swr/pnpm-lock.yaml`.

version: 2

updates:
  # ---- GitHub Actions -------------------------------------------------
  # Catches runtime-deprecation churn (the node20 -> node24 migration that
  # prompted this file) without anyone having to notice a deprecation blog
  # post. Covers every `uses:` in `.github/workflows/` AND the composite
  # actions under `.github/actions/`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(actions)"
    ignore:
      # `dtolnay/rust-toolchain@<version>` is NOT an ordinary action pin — the
      # ref IS the Rust version it installs, and `ci.yml` asserts a three-way
      # equality between the resolved `rustc`, `rust-toolchain.toml`'s
      # `channel`, and `Cargo.toml`'s `rust-version` (cratestack#422).
      # Dependabot can see only the action ref, so a lone bump to it breaks
      # that assertion by construction — PR #829 (1.98.0 -> 1.100.0) is
      # exactly that, and cannot pass.
      #
      # A Rust upgrade here is a deliberate three-file change plus absorbing
      # whatever new rustfmt/clippy output the release brings, and it raises
      # the PUBLISHED MSRV in lockstep. That is a maintainer decision, not a
      # dependency bump. Do it by hand; see the `rust-toolchain.toml` header.
      - dependency-name: dtolnay/rust-toolchain

  # ---- Cargo ----------------------------------------------------------
  # The root workspace. Note this does NOT reach the standalone workspaces
  # deliberately kept out of the root `[workspace] members` list
  # (`crates/cratestack-studio-ui`, `examples/no-database-verification`,
  # `examples/no-database-verification-api`, `examples/client-only-verification`,
  # `examples/db-transaction-verification`) — those are excluded precisely
  # so their dependency graphs stay disjoint, and each carries its own
  # `Cargo.lock`. They are intentionally left unmanaged here: a Dependabot
  # bump to one of them could quietly invalidate the very absence-proof
  # (`cargo tree` showing no `sqlx`/`axum`) that the crate exists to make.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(cargo)"

  # ---- npm / pnpm -----------------------------------------------------
  # All nine lockfiles. Grouped so a routine week is a handful of PRs
  # rather than dozens; majors still come through individually, because
  # those are the ones that need a human to read a changelog.
  - package-ecosystem: npm
    directories:
      # Root pnpm workspace (covers `packages/*` only).
      - /
      # Standalone example workspaces — each has its own pnpm-lock.yaml.
      - /examples/embedded-browser-vite/web
      - /examples/embedded-browser-vite-pwa/web
      - /examples/react-vite-daisyui/web
      - /examples/react-vite-refine/web
      - /examples/tauri-native
      - /examples/tauri-web
      # examples/react-vite-swr: members of a root-level pnpm workspace
      # that has no package.json of its own — see this file's header.
      - /examples/react-vite-swr/client
      - /examples/react-vite-swr/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(npm)"

  # `examples/embedded-browser-webpack/web` gets its OWN entry purely so the
  # TypeScript pin below can be scoped to it. `ignore` applies to the whole
  # update entry, and the shared npm entry above spans ten directories — a
  # `typescript` ignore there would silently stop TS updates for all of them,
  # including the 28 manifests that are correctly on ^7.
  - package-ecosystem: npm
    directory: /examples/embedded-browser-webpack/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Held at TypeScript ^6 deliberately. TS 7 is the Go-native compiler
      # and no longer exports the classic API — `ts.sys`, `ts.findConfigFile`
      # and `ts.createProgram` are all undefined at runtime — which
      # `ts-loader@9` is built on. `tsc --noEmit` passes while `webpack`
      # dies, so a green typecheck is NOT sufficient evidence to lift this.
      # Measured during the 2026-08 dependency audit: the bump was attempted,
      # isolated to ts-loader, and reverted. `ts-loader` declares
      # `peerDependencies.typescript: "*"`, so pnpm warns about nothing.
      # Lift only when ts-loader supports TS 7, or that example moves off it.
      - dependency-name: typescript
      # Pinned to the Node **24** types line, matching `engines.node >= 24`.
      # Typing against the Node 26 surface while running 24 admits APIs that
      # do not exist at runtime — the mismatch this was aligned to close
      # during the 2026-08 audit. Move it when the Node floor moves, not before.
      - dependency-name: "@types/node"

  # `examples/react-nextjs-daisyui/web` — its own entry for the same reason as
  # the webpack example above: a scoped `@types/node` pin. NOTE this example
  # was missing from the shared list entirely; its `pnpm-lock.yaml` was
  # generated during the 2026-08 audit, after this file was first written, so
  # nothing was refreshing it. The lockfile sits at the example root while the
  # manifest is in `web/`, so the manifest directory is what is listed here.
  - package-ecosystem: npm
    directory: /examples/react-nextjs-daisyui/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"

  # `examples/embedded-expo/app` — its own entry so `react-native` can be
  # pinned. This example was invisible to Dependabot until now for a
  # different reason from the nextjs one: its `pnpm-lock.yaml` was
  # *gitignored*, grouped in with "Expo + RN build outputs", so there was no
  # lockfile to monitor at all. That ignore was removed during the 2026-08
  # audit; this entry is the other half of that fix.
  - package-ecosystem: npm
    directory: /examples/embedded-expo/app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Exact-pinned to the Expo SDK, by Expo's own convention — the RN
      # version is chosen by the SDK release, not independently. RN 0.87
      # requires Expo 58 and also raises the Node floor to ^22.13, so a lone
      # bump here would be wrong in two directions. Move it with the Expo SDK.
      - dependency-name: react-native
