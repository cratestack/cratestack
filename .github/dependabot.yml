# Dependabot configuration.
#
# Why this file exists: before it, nothing in this repo refreshed any
# dependency manifest on a schedule. The npm side is the sharp edge —
# there are TWELVE independent `pnpm-lock.yaml` files here, and the root
# `pnpm-workspace.yaml` only covers `packages/*`. Every `examples/*` root
# is deliberately its own disjoint pnpm workspace (see the header comment
# in `examples/react-vite-swr/pnpm-workspace.yaml` for the rationale), so
# a single npm entry pointed at `/` would monitor the root workspace and
# silently leave the eleven example lockfiles untouched forever. That is
# not hypothetical: it is the direct cause of the HIGH-severity advisory
# backlog that accumulated in the example apps. Hence the explicit
# per-directory enumeration below — if you add a new `pnpm-lock.yaml`
# anywhere, you MUST add its directory here or it is unmonitored.
#
# Keep this list in sync with:
#   find . -name pnpm-lock.yaml -not -path '*/node_modules/*'
#
# Note on `examples/react-vite-swr` and `examples/react-nextjs-daisyui`: each
# gets its OWN entry below, pointed at the example root, which has a
# manifest-only `package.json` for exactly this reason. Dependabot does not
# refresh a `pnpm-lock.yaml` whose workspace root has no `package.json`: while
# the entries listed the members instead, Dependabot bumped `web/package.json`
# and left the shared lockfile stale (react-vite-swr on #947 and #980, fixed
# by #1049; react-nextjs-daisyui on nine PRs, fixed by #1058). Each root
# `package.json` pins `packageManager` to the repo root's pnpm, so Dependabot
# (and pnpm itself, run there) resolves with the pnpm CI uses;
# `just verify-pnpm-pins` keeps the pins equal.
#
# The react-vite-swr entry also excludes its `client/` from VERSION updates
# (`exclude-paths` does not apply to security updates, which are off for this
# repo today; if they are turned on, `regen-examples --check` still catches an
# edit). `client/` is GENERATED by
# `cratestack generate-typescript`, its dependency ranges are owned by the
# generator (`crates/cratestack-client-typescript/src/package_floors.rs`),
# and CI's `just regen-examples --check` rejects any hand edit. #980 rewrote
# it and turned `main` red for two days.
#
# CI also runs `pnpm dedupe --check` for both examples: a lockfile refresh can
# leave a package that could be shared resolved twice. In react-vite-swr that
# is concrete: `client/`'s `^18 || ^19` react can stay on an older version than
# `web/`'s, bundling two Reacts, which breaks every SWR hook at runtime while
# typecheck and lint pass. If that step fails on a Dependabot PR, run
# `pnpm dedupe` in the example (twice if needed: pnpm/pnpm#14987) and push.

version: 2

updates:
  # ---- GitHub Actions -------------------------------------------------
  # Catches runtime-deprecation churn (the node20 -> node24 migration that
  # prompted this file) without anyone having to notice a deprecation blog
  # post. Covers every `uses:` in `.github/workflows/` AND the composite
  # actions under `.github/actions/`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(actions)"
    ignore:
      # `dtolnay/rust-toolchain@<version>` is NOT an ordinary action pin — the
      # ref IS the Rust version it installs, and `ci.yml` asserts a three-way
      # equality between the resolved `rustc`, `rust-toolchain.toml`'s
      # `channel`, and `Cargo.toml`'s `rust-version` (cratestack#422).
      # Dependabot can see only the action ref, so a lone bump to it breaks
      # that assertion by construction — PR #829 (1.98.0 -> 1.100.0) is
      # exactly that, and cannot pass.
      #
      # A Rust upgrade here is a deliberate three-file change plus absorbing
      # whatever new rustfmt/clippy output the release brings, and it raises
      # the PUBLISHED MSRV in lockstep. That is a maintainer decision, not a
      # dependency bump. Do it by hand; see the `rust-toolchain.toml` header.
      - dependency-name: dtolnay/rust-toolchain

  # ---- Cargo ----------------------------------------------------------
  # The root workspace. Note this does NOT reach the standalone workspaces
  # deliberately kept out of the root `[workspace] members` list
  # (`crates/cratestack-studio-ui`, `examples/no-database-verification`,
  # `examples/no-database-verification-api`, `examples/client-only-verification`,
  # `examples/db-transaction-verification`) — those are excluded precisely
  # so their dependency graphs stay disjoint, and each carries its own
  # `Cargo.lock`. They are intentionally left unmanaged here: a Dependabot
  # bump to one of them could quietly invalidate the very absence-proof
  # (`cargo tree` showing no `sqlx`/`axum`) that the crate exists to make.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # sqlite-wasm-vfs 0.3 is built for sqlite-wasm-rs 0.6, but rusqlite
      # (0.40.2, the latest) links sqlite-wasm-rs 0.5 on wasm32. Both declare
      # `links = "wsqlite3"`, so they cannot coexist in one graph, and 0.3's
      # `sahpool::install` needs an `rsqlite_vfs` 0.2 `OsCallback` that 0.5's
      # `WasmOsCallback` does not implement. #1048 merged this bump anyway (its
      # main CI run was cancelled) and broke every wasm32 embedded build; it was
      # reverted. Lift this when rusqlite moves to sqlite-wasm-rs 0.6: bump
      # both, enable sqlite-wasm-vfs's `sahpool` feature, and use
      # `OpfsSAHPoolCfgBuilder` in `cratestack-rusqlite/src/opfs.rs` (0.3 made
      # the config fields private).
      - dependency-name: sqlite-wasm-vfs
        versions: [">= 0.3"]
    commit-message:
      prefix: "chore(cargo)"

  # ---- npm / pnpm -----------------------------------------------------
  # Seven of the twelve lockfiles; the other five have their own entries
  # below, each for a stated reason. Grouped so a routine week is a handful of PRs
  # rather than dozens; majors still come through individually, because
  # those are the ones that need a human to read a changelog.
  - package-ecosystem: npm
    directories:
      # Root pnpm workspace (covers `packages/*` only).
      - /
      # Standalone example workspaces — each has its own pnpm-lock.yaml.
      - /examples/embedded-browser-vite/web
      - /examples/embedded-browser-vite-pwa/web
      - /examples/react-vite-daisyui/web
      - /examples/react-vite-refine/web
      - /examples/tauri-native
      - /examples/tauri-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(npm)"

  # `examples/react-vite-swr`: its OWN entry, at the workspace root, so the
  # shared lockfile is refreshed along with `web/`, with the generated
  # `client/` excluded. See this file's header.
  - package-ecosystem: npm
    directory: /examples/react-vite-swr
    exclude-paths:
      - "client/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(npm)"

  # `examples/embedded-browser-webpack/web` gets its OWN entry purely so the
  # TypeScript pin below can be scoped to it. `ignore` applies to the whole
  # update entry, and the shared npm entry above spans seven directories — a
  # `typescript` ignore there would silently stop TS updates for all of them,
  # including the 28 manifests that are correctly on ^7.
  - package-ecosystem: npm
    directory: /examples/embedded-browser-webpack/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Held at TypeScript ^6 deliberately. TS 7 is the Go-native compiler
      # and no longer exports the classic API — `ts.sys`, `ts.findConfigFile`
      # and `ts.createProgram` are all undefined at runtime — which
      # `ts-loader@9` is built on. `tsc --noEmit` passes while `webpack`
      # dies, so a green typecheck is NOT sufficient evidence to lift this.
      # Measured during the 2026-08 dependency audit: the bump was attempted,
      # isolated to ts-loader, and reverted. `ts-loader` declares
      # `peerDependencies.typescript: "*"`, so pnpm warns about nothing.
      # Lift only when ts-loader supports TS 7, or that example moves off it.
      - dependency-name: typescript
      # Pinned to the Node **24** types line, matching `engines.node >= 24`.
      # Typing against the Node 26 surface while running 24 admits APIs that
      # do not exist at runtime — the mismatch this was aligned to close
      # during the 2026-08 audit. Move it when the Node floor moves, not before.
      - dependency-name: "@types/node"

  # `examples/react-nextjs-daisyui` — its own entry for the same reason as
  # the webpack example above: a scoped `@types/node` pin. It points at the
  # example ROOT, not `web/`: the root has a manifest-only `package.json` so
  # Dependabot refreshes the shared `pnpm-lock.yaml` (see this file's header;
  # listing `web/` bumped the manifest nine times and the lockfile never,
  # #1050). Both members are hand-written, so nothing is excluded. Pointing at
  # the root also brings `napi/` (its `@napi-rs/cli` dev dependency) under
  # Dependabot for the first time.
  - package-ecosystem: npm
    directory: /examples/react-nextjs-daisyui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"

  # `examples/embedded-expo/app` — its own entry so `react-native` can be
  # pinned. This example was invisible to Dependabot until now for a
  # different reason from the nextjs one: its `pnpm-lock.yaml` was
  # *gitignored*, grouped in with "Expo + RN build outputs", so there was no
  # lockfile to monitor at all. That ignore was removed during the 2026-08
  # audit; this entry is the other half of that fix.
  - package-ecosystem: npm
    directory: /examples/embedded-expo/app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Exact-pinned to the Expo SDK, by Expo's own convention — the RN
      # version is chosen by the SDK release, not independently. RN 0.87
      # requires Expo 58 and also raises the Node floor to ^22.13, so a lone
      # bump here would be wrong in two directions. Move it with the Expo SDK.
      - dependency-name: react-native

  # `examples/mcp-operator/conformance` — the third-party MCP client
  # `just mcp-conformance` drives the example with. Its own entry so it
  # cannot join the weekly group: the client is pinned exactly and each bump
  # should be read on its own, with the conformance run's output (the
  # `mcp-example` job runs on the PR). Its `package.json` pins
  # `packageManager` like the other roots, so Dependabot resolves with the
  # pnpm CI uses.
  - package-ecosystem: npm
    directory: /examples/mcp-operator/conformance
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(npm)"
