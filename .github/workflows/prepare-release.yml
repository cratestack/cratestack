# Cuts the version-bump step of a release from CI instead of requiring a
# human to run `just release VERSION PUSH=1` locally.
#
# `main` requires 1 approving + code-owner review, and this workflow's
# GITHUB_TOKEN is not a repo admin — unlike a human admin's local push, it
# cannot push a bump commit straight to `main`. So `mode: real` opens a
# normal PR instead, going through the same review every other change does.
# Merging that PR is what actually lands the bump; from there,
# `cut-release-tag.yml` notices the new version on `main` and auto-creates
# the `vX.Y.Z` tag, which triggers `release-cli.yml` (binaries, crates.io,
# npm) with no further manual steps.
#
# PR creation itself (`gh pr create` below) now succeeds — the org's
# "Allow GitHub Actions to create and approve pull requests" setting,
# previously off (see the now-outdated claim this comment used to make,
# and RELEASE.md's Troubleshooting section / docs/tooling/npm-publishing.md's
# "Known limitation" section, both corrected alongside this comment for
# cratestack#531), is on as of this writing
# (`gh api repos/cratestack/cratestack/actions/permissions/workflow` reports
# `can_approve_pull_request_reviews: true`) — confirmed by PR #528, which
# this workflow's own `gh pr create` opened successfully, authored as
# `github-actions[bot]`.
#
# cratestack#531: THAT is exactly the problem. A PR (or push, or any other
# event) raised via the default `GITHUB_TOKEN` does not trigger *further*
# workflow runs — a documented GitHub Actions anti-recursion rule, same
# mechanism `cut-release-tag.yml` hit and fixed for the tag push (see that
# file's header comment). #528's head commit had zero check-runs: no
# changelog gate, no governance check, no build/test — because the PR that
# assembles a release was opened by the one identity GitHub won't cascade
# events for. `v0.7.12` shipped an unedited `CHANGELOG.md` seed as a direct
# result: the gate that would have caught it (`.ci/changelog-check.sh`,
# wired into `ci.yml`'s `changelog-verify` job) never ran.
#
# Fix: below, `gh pr create` (and the branch push feeding it, via
# checkout's `token:`) uses the same `RELEASE_PAT` repo secret
# `cut-release-tag.yml` already relies on, falling back to `github.token`
# if unset. A PAT-authored PR-open is an ordinary external event as far as
# GitHub's trigger engine is concerned, so `ci.yml` and `governance.yml`
# fire on it normally — the release-bump PR gets the same required checks
# any other PR gets. Rejected alternatives (see the PR that introduced
# this fix for the full reasoning): duplicating `ci.yml`'s ~20 jobs inside
# this workflow (large, drifts from the real suite over time); a
# `workflow_call` reusable-workflow invocation (doesn't solve the
# underlying "this event doesn't cascade" problem — something still has to
# raise a non-GITHUB_TOKEN event to invoke it, which is what the PAT
# already does more directly). If `RELEASE_PAT` is unset, or scoped to
# `contents` only (its original scope, documented for the tag-push use
# case) without `pull-requests: write`, `gh pr create` below falls back to
# (or fails over from) `github.token` and the PR opens but goes back to
# triggering nothing — the "Warn if RELEASE_PAT is not set" step below
# makes that loud instead of silent.
#
# `mode: dry` is a fully side-effect-free rehearsal: bump + validate +
# dry-run crates.io/npm publishes, then stop — no commit, branch, PR, or
# tag, ever. Safe to run against any version, repeatedly.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.14 (no leading 'v')"
        required: true
      mode:
        description: "real: bump + open a release PR. dry: rehearse with no git writes at all."
        required: true
        default: real
        type: choice
        options:
          - real
          - dry

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare release (${{ inputs.mode }})
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT_SET: ${{ secrets.RELEASE_PAT != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags — needed to compute the last-release tag
          # and the merged-PR list for the auto-opened PR's source-of-truth
          # (governance-check requires a real #123/URL reference, not just
          # a workflow-run link — see the "Open release PR" step below).
          fetch-depth: 0
          # cratestack#531: same PAT-over-GITHUB_TOKEN swap as
          # cut-release-tag.yml's checkout, for the same reason — so the
          # branch push in "Open release PR" below is PAT-authored too (git's
          # credential helper persists whatever token checked this out),
          # consistent with the `gh pr create` call in that step. Falls back
          # to github.token, same as everywhere else in this workflow.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Warn if RELEASE_PAT is not set
        if: inputs.mode == 'real' && env.RELEASE_PAT_SET != 'true'
        run: |
          echo "::warning::RELEASE_PAT secret is not set — falling back to the default GITHUB_TOKEN for the bump-PR push and 'gh pr create' below. The PR will still open, but (cratestack#531) GitHub does not trigger further workflow runs for GITHUB_TOKEN-authored events, so ci.yml/governance.yml will NOT run on it — total_count 0 check-runs, same as PR #528. See docs/tooling/npm-publishing.md's RELEASE_PAT section for setup; the existing RELEASE_PAT (used by cut-release-tag.yml) works here too if scoped with pull-requests:write in addition to contents:write."
      # just bump / just release-check both run cargo check --workspace,
      # which pulls in the tauri-* example crates transitively (no
      # default-members) — needs GTK/WebKit dev packages on Linux, same as
      # ci.yml's check/clippy jobs.
      - uses: ./.github/actions/tauri-linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      - uses: pnpm/action-setup@v4
      # Not node-version 20: real failure hit on v0.6.8's actual release
      # validation — `swr_hooks_invalidation`'s vitest run (installs real
      # devDependencies, unpinned `^` ranges) died with `TypeError:
      # webidl.util.markAsUncloneable is not a function` inside undici's
      # CacheStorage, loaded transitively via jsdom. Confirmed by hand: the
      # exact same test passes locally under Node 24, and passes in CI's
      # own `tests (host — everything else)` job (ci.yml) — which runs
      # this identical test and doesn't pin any Node version at all, so it
      # gets the runner's own (newer) default. Only this job explicitly
      # downgrades to 20, which is now too old for whatever `undici`
      # version the floating `^` ranges currently resolve to. No reason
      # this job specifically needs 20 — it's here for `just bump`'s own
      # `pnpm install`, which doesn't care what Node major it runs under.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate inputs
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (no leading 'v'), got: '$version'" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::tag v${version} already exists — pick a version that hasn't been released." >&2
            exit 1
          fi

      - name: Bump workspace version
        run: just bump ${{ inputs.version }}

      - name: Seed CHANGELOG.md section
        run: just changelog-seed ${{ inputs.version }}

      - name: Validate (cargo check + tests)
        run: just release-check

      - name: Dry-run rehearsal (crates.io + npm) — no git writes
        if: inputs.mode == 'dry'
        env:
          # `pnpm install` below runs postinstall for every workspace
          # package, including cratestack-cli-npm's — which would try to
          # download the GitHub Release binary for the version `just
          # bump` just wrote into its package.json. No such release
          # exists yet (this is a dry run, nothing was ever tagged or
          # published) — skip the download rather than fail on a 404.
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          echo "::group::crates.io dry-run (just release-publish dry)"
          just release-publish dry
          echo "::endgroup::"

          echo "::group::npm dry-run — @cratestack/cli"
          (cd packages/cratestack-cli-npm && npm publish --dry-run --access public) \
            || echo "npm dry-run for @cratestack/cli didn't complete (often just missing local npm auth) — not fatal for a rehearsal." >&2
          echo "::endgroup::"

          echo "::group::npm dry-run — @cratestack/api family + @cratestack/refine"
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter='./packages/cratestack-ts-types' --filter='./packages/cratestack-link-batch' --filter='./packages/cratestack-link-logger' --filter='./packages/cratestack-runtime-fetch' --filter='./packages/cratestack-runtime-axios' --filter='./packages/cratestack-validator-zod' --filter='./packages/cratestack-validator-yup' --filter='./packages/cratestack-adapter-tanstack-query' --filter='./packages/cratestack-adapter-rtk' --filter='./packages/cratestack-api' --filter='./packages/cratestack-refine'
          # ts-types has no dependents needing it published first for a
          # dry-run (nothing actually hits the registry), but the order
          # mirrors the real publish-npm-api-family job for consistency.
          # cratestack-refine isn't part of that family (its own
          # publish-npm-refine job) but rehearses identically — plain tsc
          # build, own dist/ in the tarball — so it rides along here rather
          # than duplicating the whole group.
          for pkg in \
            cratestack-ts-types cratestack-link-batch cratestack-link-logger \
            cratestack-runtime-fetch cratestack-runtime-axios \
            cratestack-validator-zod cratestack-validator-yup \
            cratestack-adapter-tanstack-query cratestack-adapter-rtk \
            cratestack-api cratestack-refine; do
            (cd "packages/$pkg" && npm publish --dry-run --access public) \
              || echo "npm dry-run for $pkg didn't complete (often just missing local npm auth) — not fatal for a rehearsal." >&2
          done
          echo "::endgroup::"

          echo "Dry run complete for v${{ inputs.version }} — no commit, branch, PR, or tag was created."

      # See the STANDING LIMITATION note in this file's header comment:
      # `gh pr create` below is expected to fail with "GitHub Actions is not
      # permitted to create or approve pull requests" on this repo's org —
      # the commit + push above still land, only PR creation doesn't.
      - name: Open release PR
        if: inputs.mode == 'real'
        env:
          # cratestack#531: this is the actual fix. `gh pr create` succeeds
          # either way (confirmed by PR #528, opened via plain github.token)
          # — the difference this token swap makes is WHICH identity raises
          # the pull_request-opened event, which is what determines whether
          # ci.yml/governance.yml fire on the result. See this file's header
          # comment for the full mechanism and rejected alternatives.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          branch="release/v${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # `':(glob)**/Cargo.lock'` (not the bare `Cargo.lock` this used to
          # read) — `just bump` refreshes not just the root workspace's own
          # lockfile but four standalone-workspace ones too:
          # `crates/cratestack-studio-ui/Cargo.lock` and the three
          # `examples/*-verification*/Cargo.lock` files, each its own
          # `[workspace]` root excluded from this one specifically so a real
          # `cargo tree`/`cargo metadata --locked` proves an external
          # consumer's dependency graph, not something a workspace member
          # can fake (cratestack#329/#347/#490). A bare `Cargo.lock` here
          # only ever staged the root one — `just bump` genuinely refreshed
          # the other four in the runner's working tree, but this line
          # silently dropped that refresh from every bump commit, so they
          # shipped a release still recording the *previous* version for
          # their path dependencies. `facade-disjointness`'s own `cargo
          # metadata --locked`/`cargo tree` steps exist precisely to catch
          # this class of drift on every PR — they just can't catch it on
          # THIS workflow's own commit before it's pushed, so v0.7.10
          # shipped it and it had to be caught and fixed by hand on the
          # release branch (see that PR for the concrete symptom: `error:
          # cannot update the lock file ... because --locked was passed`).
          # `':(glob)packages/*/package.json'` for exactly the same reason
          # as the lockfile pathspec above, one class of drift later: this
          # used to enumerate the package.json files by hand, and that list
          # had already fallen behind `just bump`'s — it never gained
          # `packages/cratestack-vscode` and never gained
          # `packages/cratestack-refine` (#577). `just bump` rewrites every
          # `packages/*/package.json` in the runner's working tree, so a
          # missing entry here doesn't fail anything loudly; it silently
          # drops that file from the bump commit, and the release ships that
          # package still carrying the PREVIOUS version. For an npm-published
          # package that then makes release-cli.yml's publish job re-publish
          # an already-live version — a hard failure mid-release, since the
          # npm jobs are a hard cutover with no skip path. A glob is the
          # self-maintaining form: `*` in a `:(glob)` pathspec doesn't match
          # `/`, so this is exactly one level deep and can't reach into a
          # package's own `node_modules/`. `just bump`'s own perl invocation
          # uses the identical glob — the two must stay in agreement.
          git add CHANGELOG.md ':(glob)**/Cargo.toml' ':(glob)**/Cargo.lock' pnpm-lock.yaml \
            ':(glob)packages/*/package.json'
          git commit -m "chore: bump workspace to v${version} and seed CHANGELOG section"
          git push origin "$branch"

          # Source-of-truth for governance-check: the actual merged PRs
          # this release bundles, not just a link to this workflow run.
          # `HEAD~1` is main's tip before the bump commit just created above.
          #
          # Deliberately NOT `git describe --tags --abbrev=0` — some past
          # release tags in this repo were pushed pointing at a commit that
          # never actually became an ancestor of main (a pre-existing mix of
          # direct tag-pushes and squash-merged PRs), so `describe` can walk
          # right past the real last release and land on a much older tag.
          # The highest tag by version number is a more reliable "last
          # release" signal than ancestry here.
          last_tag=$(git tag --list 'v*' | sort -V | tail -1)
          range="HEAD~1"
          [ -n "$last_tag" ] && range="${last_tag}..HEAD~1"
          pr_refs=$(git log "$range" --pretty=%s | grep -oE '#[0-9]+' | sort -t'#' -k2 -n -u || true)
          if [ -n "$pr_refs" ]; then
            # shellcheck disable=SC2086 # intentional word-split: $pr_refs is
            # a whitespace-separated list of "#123" tokens, one printf arg each.
            source_of_truth=$(printf -- '- %s\n' $pr_refs)
          else
            source_of_truth="- No merged PR references found since \`${last_tag:-the beginning of history}\` — see https://github.com/${{ github.repository }}/blob/main/RELEASE.md for the release process this automation follows."
          fi

          cat > /tmp/pr-body.md <<PRBODY
          ## 1. Summary

          This PR changes:

          - Bumps the workspace version to \`${version}\` across every crate's \`Cargo.toml\`, \`Cargo.lock\`, and every \`packages/*/package.json\` (\`@cratestack/cli\`; the split \`@cratestack/api\` family: \`api\`, \`ts-types\`, \`link-batch\`, \`link-logger\`, \`runtime-fetch\`, \`runtime-axios\`, \`validator-zod\`, \`validator-yup\`, \`adapter-tanstack-query\`, \`adapter-rtk\`; the \`@cratestack/cbor\` family: \`cbor\`, \`cbor-node\`, \`cbor-web\`; \`@cratestack/refine\`; and the \`cratestack-vscode\` extension), refreshing \`pnpm-lock.yaml\` to match. The list is a glob, not an enumeration — a new package under \`packages/\` is picked up automatically.

          It solves:

          - Prepares release \`v${version}\`, bundling everything merged to \`main\` since \`${last_tag:-the beginning of history}\`:

          ${source_of_truth}

          - **This PR does not publish anything itself** — merging it is the trigger for the rest of the pipeline: \`cut-release-tag.yml\` notices the new version on \`main\` and creates tag \`v${version}\`, which triggers \`release-cli.yml\` (crates.io publish, GitHub Release binaries, npm publish for every package, all with no further manual steps).

          ---

          ## 2. Intent

          > Automated by the "Prepare Release" GitHub Actions workflow, dispatched by a maintainer requesting version \`${version}\`, to cut a release covering:
          >
          ${source_of_truth}

          ---

          ## 3. Scope

          ### In Scope

          - Version bump only, everywhere \`just bump\` already touches.

          ### Out of Scope

          - Publishing to crates.io/npm, tagging, and building binaries — all happen automatically once this PR merges, not as part of it.

          ---

          ## 4. Verification

          I verified this change by:

          - [x] Running automated tests

          Commands run:

          \`\`\`bash
          just bump ${version}
          just release-check
          \`\`\`

          Results:

          \`\`\`text
          Both completed successfully in this workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          \`\`\`

          ---

          ## 5. Screenshots / Evidence

          * Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---

          ## 6. Risk Assessment

          Risk level:

          * [x] Low

          Potential risks:

          * A version-only diff merged without review would be a mistake if the bump itself were wrong (e.g. a crate silently missed) — the diff is small and mechanical, easy to eyeball.

          Mitigation:

          * This PR still goes through the repo's normal review before merging, like any other PR — that review is the deliberate human checkpoint in an otherwise fully automated release pipeline (see \`docs/tooling/npm-publishing.md\` and \`RELEASE.md\`).

          ---

          ## 7. AI Usage Declaration

          AI was used for:

          * [x] Generating code

          Human verification:

          * [ ] I understand every meaningful change in this PR
          * [ ] I checked generated code manually
          * [ ] I accept responsibility for this PR

          (This PR was opened automatically by CI, not a human — the boxes above are for whoever reviews/merges it to check before doing so.)

          ---

          ## 8. Reviewer Focus

          Please focus your review on:

          * [x] Correctness

          🤖 Generated by the "Prepare Release" GitHub Actions workflow.
          PRBODY

          gh pr create \
            --title "chore: bump workspace to v${version}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$branch"
