name: Quality

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Weekly scan: Sundays 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-checks:
    name: quality
    # This is a PLACEHOLDER for self-hosted runner configuration.
    # Replace 'ubuntu-latest' with your self-hosted runner label(s), e.g.:
    #   runs-on: [self-hosted, linux, quality-offline]
    # See .ci/quality/README.md for provisioning steps.
    runs-on: ubuntu-latest

    steps:
      # Fetch full history so reviewdog can calculate PR diffs correctly
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      # ====================================================================
      # Verify tool availability and version compatibility
      # ====================================================================

      - name: Verify offline toolchain
        run: |
          set -euo pipefail

          echo "Checking required tools..."
          MISSING=()

          if ! command -v semgrep &> /dev/null; then
            echo "warn: semgrep not found"
          else
            echo "✓ semgrep $(semgrep --version 2>&1 | head -1)"
          fi

          if ! command -v gitleaks &> /dev/null; then
            echo "warn: gitleaks not found"
          else
            echo "✓ gitleaks $(gitleaks --version)"
          fi

          if ! command -v trivy &> /dev/null; then
            echo "warn: trivy not found"
          else
            echo "✓ trivy $(trivy version | grep Version)"
          fi

          if ! command -v cargo-audit &> /dev/null; then
            echo "warn: cargo-audit not found"
          else
            echo "✓ cargo-audit $(cargo audit --version)"
          fi

          # cargo subcommands are separate binaries (cargo-<name>) on PATH;
          # checking `cargo` itself is not enough, since it's always present
          # in a Rust build environment regardless of whether cargo-deny is.
          if ! command -v cargo-deny &> /dev/null; then
            echo "warn: cargo-deny not found"
          else
            echo "✓ cargo-deny $(cargo deny --version)"
          fi

          # reviewdog is invoked directly (not via a setup action, which would
          # download a binary at runtime) — it must be pre-provisioned like
          # the scanners above. See .ci/quality/TOOLCHAIN.md.
          if ! command -v reviewdog &> /dev/null; then
            echo "warn: reviewdog not found"
          else
            echo "✓ reviewdog $(reviewdog -version 2>&1 | head -1)"
          fi

          if ! command -v python3 &> /dev/null; then
            echo "error: python3 not found (required for converters)"
            exit 1
          else
            echo "✓ python3 $(python3 --version)"
          fi

          echo ""
          echo "Note: Missing tools will be skipped with a warning."
          echo "See .ci/quality/README.md for offline provisioning steps."

      # ====================================================================
      # Run quality checks
      # ====================================================================

      - name: Run quality checks
        run: .ci/quality/run.sh
        env:
          # Set scan type based on trigger
          SCAN_TYPE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}

      # ====================================================================
      # Publish reports as artifacts
      # ====================================================================

      - name: Upload SARIF reports
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: .ci/quality/reports/
          retention-days: 30

      # ====================================================================
      # Run quality gate
      # ====================================================================

      - name: Quality gate
        if: always()
        run: .ci/quality/gate.sh

      # ====================================================================
      # Publish PR check via reviewdog
      #
      # Invokes the locally provisioned reviewdog CLI directly (never the
      # reviewdog hosted service/GitHub App). reviewdog is NOT installed via
      # reviewdog/action-setup, since that action's install.sh downloads a
      # binary over the network at runtime — the same "no downloads during a
      # workflow run" rule that applies to semgrep/gitleaks/trivy applies
      # here too. reviewdog must be pre-provisioned on the runner; see
      # .ci/quality/TOOLCHAIN.md.
      #
      # -f=sarif            parse the merged SARIF as input
      # -reporter=github-pr-check  post GitHub Check annotations for the PR;
      #                      reviewdog automatically degrades to GitHub
      #                      Actions log annotations for fork PRs where
      #                      GITHUB_TOKEN is read-only (no pull_request_target
      #                      used here, so untrusted fork code is never
      #                      checked out or executed with elevated permissions)
      # -filter-mode=added  only consider added/modified lines in the diff
      # -fail-level=error   exit non-zero only for error-level findings on
      #                      added lines; warnings/notes are reported but
      #                      never fail the check
      # ====================================================================

      - name: Post PR check via reviewdog
        if: github.event_name == 'pull_request' && always()
        run: |
          set -uo pipefail

          if ! command -v reviewdog &> /dev/null; then
            echo "::warning::reviewdog not found on this runner; skipping PR check. See .ci/quality/TOOLCHAIN.md for provisioning."
            exit 0
          fi

          reviewdog \
            -f=sarif \
            -reporter=github-pr-check \
            -filter-mode=added \
            -fail-level=error \
            < .ci/quality/reports/quality.sarif
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ====================================================================
      # Optional: Upload to GitHub Code Scanning
      # (Only on main branch when explicitly enabled)
      # ====================================================================

      - name: Upload to GitHub Code Scanning
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_CODE_SCANNING == 'true' &&
          always()
        # github/codeql-action v3.37.3
        uses: github/codeql-action/upload-sarif@f081e69141f6ea0aa740920b0c7012cd81a4fbe6
        with:
          sarif_file: .ci/quality/reports/quality.sarif
          category: quality-offline-pipeline

      # ====================================================================
      # Summary
      # ====================================================================

      - name: Print summary
        if: always()
        run: |
          cat > /tmp/summary.md << 'EOF'
          ## Quality Checks Summary

          **Merged SARIF Report:** `.ci/quality/reports/quality.sarif`

          **Individual Tool Reports:**
          - Semgrep: `.ci/quality/reports/semgrep.sarif`
          - Gitleaks: `.ci/quality/reports/gitleaks.sarif`
          - cargo audit: `.ci/quality/reports/cargo-audit.txt`
          - cargo deny: `.ci/quality/reports/cargo-deny.txt`
          - Trivy config: `.ci/quality/reports/trivy-config.sarif`

          **Run Locally:**
          ```bash
          .ci/quality/run.sh
          ```

          **View Reports:**
          - Artifacts → quality-reports
          - Or: https://github.com/${{ github.repository }}/security/code-scanning (if enabled)

          **Suppress Findings:**
          See `.ci/baselines/README.md` for baseline management.
          EOF

          cat /tmp/summary.md >> $GITHUB_STEP_SUMMARY
