# Closes the loop after a "Prepare Release" PR (prepare-release.yml) merges:
# reads the workspace version straight out of `Cargo.toml` on every push to
# `main` and, if no `vX.Y.Z` tag exists for it yet, creates and pushes one.
# That tag push is *meant* to trigger `release-cli.yml` (crates.io, binaries,
# npm) — but GitHub deliberately does not fire other workflows' triggers for
# an event caused by the default `GITHUB_TOKEN` (anti-recursion protection),
# so a plain `git push` here would create a real tag that silently never
# cascades into anything — confirmed the hard way on the first real release
# through this pipeline (v0.4.14): the tag was created fine, `release-cli.yml`
# never ran, nothing was actually published.
#
# Fix: push using a `RELEASE_PAT` repo secret (a personal access token,
# `contents: write`/`repo` scope) instead of the default token — a PAT-
# authored push is a normal external push as far as GitHub's trigger engine
# is concerned, so it fires `release-cli.yml` normally. See
# docs/tooling/npm-publishing.md for setup. Falls back to `github.token`
# if the secret isn't set, so tagging itself still works either way — but
# prints a loud warning in that case, since the tag would otherwise look
# successful while silently not triggering anything downstream.
#
# Confirmed fixed on v0.4.15 and v0.4.16 — both releases' `release-cli.yml`
# runs show `event: "push"` (not `workflow_dispatch`), i.e. the tag push
# genuinely cascaded once RELEASE_PAT was in place.
#
# Deliberately compares the committed version against existing tags rather
# than matching the bump commit's message — the human merging a
# "Prepare Release" PR can pick squash / merge-commit / rebase, and only
# squash/rebase reliably put that commit message on `main`'s tip; a merge
# commit's own message ("Merge pull request #N ...") would not match. Version
# diffing is agnostic to whichever merge strategy was used.
#
# Also correct for the routine case: an ordinary commit to `main` that
# doesn't happen to be a version bump is a no-op (the tag for the current
# version already exists), so this is safe and cheap to run on every push.
#
# Pushing a brand-new tag is unaffected by `main`'s branch-protection
# (required reviews apply to branch refs, not tags — confirmed no tag
# protection rules exist on this repo either), so a PAT with plain
# `contents: write` is sufficient — no admin/bypass privilege needed.
name: Cut Release Tag

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: cut-release-tag
  cancel-in-progress: false

jobs:
  cut-tag:
    name: cut release tag if version changed
    runs-on: ubuntu-latest
    env:
      RELEASE_PAT_SET: ${{ secrets.RELEASE_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Warn if RELEASE_PAT is not set
        if: env.RELEASE_PAT_SET != 'true'
        run: |
          echo "::warning::RELEASE_PAT secret is not set — falling back to the default GITHUB_TOKEN. Any tag this job creates will NOT trigger release-cli.yml (GitHub doesn't fire workflow triggers for GITHUB_TOKEN-authored pushes). See docs/tooling/npm-publishing.md for how to add RELEASE_PAT; until then, a real release needs a manual 'gh workflow run \"Release CLI Binaries\" -f tag=vX.Y.Z' after this job runs, and that dispatch still won't publish crates.io/npm (those gate on a real push event)."

      - name: Tag vX.Y.Z if Cargo.toml's version isn't tagged yet
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "already tagged ${tag} — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "created and pushed ${tag}."
