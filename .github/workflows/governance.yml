# Per-repo caller workflow for AI Governance PR enforcement.
#
# Drop this file at .github/workflows/governance.yml in a consuming repo to opt in.
# It delegates to the reusable workflow hosted in ADORSYS-GIS/ai-governance, which
# fails the PR if its body is missing an AI Usage Declaration, a source-of-truth
# reference, or verification evidence — and posts a sticky comment listing what's missing.
#
# Source of truth: https://adorsys-gis.github.io/ai-governance/
#
# The reusable workflow is pinned to an immutable ref (a release tag, or a fixed commit
# SHA while awaiting the upstream release) — never @main — so a future push to
# ai-governance cannot change what runs here with write access. Bump the ref deliberately
# when you want to adopt new governance behaviour.
#
# Temporary pin (cratestack#879): the fence-aware governance-check fix is unreleased
# (ai-governance commit a85edd5297540cbaafdc9e4fda26a4b713e2e4f6), so v1.0.0 still runs the
# buggy section parser. We pin to the fix commit now and swap to @v1.1.0 once ai-governance
# cuts that release.
name: AI Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  governance:
    # Skipped for Dependabot, which cannot satisfy this check by construction:
    # the gate requires an AI Usage Declaration and a source-of-truth reference
    # in the PR body, and Dependabot writes its own body from a template no one
    # can edit before the check runs. Without this, EVERY Dependabot PR is
    # permanently red on governance — which is not a governance signal, it is
    # noise that trains reviewers to ignore a red check.
    #
    # This became load-bearing the moment `.github/dependabot.yml` was added
    # (2026-08 audit, cratestack#828): before that there were no bot PRs to
    # exempt. Human PRs are unaffected and still gated.
    #
    # Deliberately keyed on the bot actor rather than a label, so it cannot be
    # switched on for a human PR by adding one.
    if: github.actor != 'dependabot[bot]'
    uses: ADORSYS-GIS/ai-governance/.github/workflows/governance-check.yml@a85edd5297540cbaafdc9e4fda26a4b713e2e4f6
    permissions:
      pull-requests: write
      contents: read
