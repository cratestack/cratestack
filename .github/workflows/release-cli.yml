# Builds and publishes prebuilt `cratestack-cli` binaries to a GitHub
# Release, so consumers can install without a Rust toolchain (see #131).
# Also publishes every workspace crate to crates.io, every npm package this
# repo ships (with npm provenance attached: @cratestack/cli — the
# binary-fetching npm wrapper, the @cratestack/api family — 10 hand-written
# packages shipping their own compiled dist/, the @cratestack/cbor family —
# cbor, cbor-node (a real napi-rs multi-platform native addon), cbor-web,
# and @cratestack/refine), and the `cratestack_cbor` pub.dev package (a real
# flutter_rust_bridge/wasm-bindgen Flutter plugin vendoring prebuilt
# binaries for every platform it claims — see the publish-pubdev-cbor job).
#
# Triggers on a `vX.Y.Z` tag push. The normal way to produce one is the
# "Prepare Release" workflow (bump versions → open a PR → merging it
# auto-tags via "Cut Release Tag"); `just release VERSION PUSH=1` remains
# available as a local/manual fallback that produces the same tag push.
# This workflow also accepts a manual `workflow_dispatch` against an
# EXISTING tag, for re-running a failed release — that dispatch path only
# rebuilds/re-attaches binaries, it never touches crates.io, npm, or pub.dev
# (see the publish-crates/publish-npm*/publish-pubdev-cbor jobs' own
# comments for why — none of these three registries support a delete+retry
# the way a GitHub Release does).
#
# Artifact naming follows the cargo-binstall convention declared in
# crates/cratestack-cli/Cargo.toml's [package.metadata.binstall] — the
# two must stay in sync; see that file for the pkg-url template.
name: Release CLI Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach binaries to, e.g. v0.4.13"
        required: true
      verify_pubdev_credentials:
        description: "Verify pub.dev OIDC auth against the tag's ALREADY-PUBLISHED version. Publishes nothing."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the tag once so every downstream job (checkout ref, archive
  # names, release target) agrees, whether triggered by a tag push or a
  # manual dispatch against an existing tag.
  prepare:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      # A manual dispatch against a tag that doesn't exist yet used to fail
      # deep inside `actions/checkout` with an opaque `git fetch` error (no
      # such ref). Fail fast here instead, with an actionable message — this
      # dispatch path only rebuilds/re-attaches binaries for an EXISTING
      # tag; cutting a NEW release goes through the "Prepare Release"
      # workflow (bump → PR → merge → auto-tag), not this input.
      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if ! git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' does not exist in ${{ github.repository }}. If you're trying to cut a NEW release, run the 'Prepare Release' workflow instead (it bumps versions and opens a PR; merging it auto-creates the tag). This workflow's manual dispatch only rebuilds binaries for an existing tag." >&2
            exit 1
          fi

  # The Studio UI (embedded in cratestack-cli via cratestack-studio's
  # default `embed-ui` feature) needs a Trunk build of the wasm app.
  # Built once here and shared with every platform job below — Trunk
  # output isn't target-specific, and re-running it per matrix leg would
  # just burn CI time for an identical artifact. Without this, a fresh
  # checkout in each build job has no `dist/`, and cratestack-studio's
  # build.rs falls back to a placeholder admin UI (see its doc comment).
  studio-ui:
    name: bundle studio UI
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      - name: Bundle Studio UI
        run: just bundle-studio-ui
      - uses: actions/upload-artifact@v4
        with:
          name: studio-ui-bundle
          path: |
            crates/cratestack-studio/embedded-ui.tar.gz
            crates/cratestack-studio/embedded-ui-dist.tar.gz
          retention-days: 1

  # Publishes every workspace crate to crates.io in dependency order via the
  # same `just release-publish real` a human would otherwise run locally.
  # Idempotent (the recipe skips already-published versions), so a re-run
  # after a partial failure — or a re-dispatch against the same tag — is
  # safe. Independent of the binary build matrix / npm publish below, so it
  # runs in parallel with `build` rather than gating on it. Needs its own
  # trunk + wasm32 setup (not the studio-ui job's artifact) because
  # `release-publish`'s `cratestack-studio` step unconditionally re-invokes
  # `just bundle-studio-ui`, which always rebuilds via trunk regardless of
  # whether a tarball already exists — a downloaded artifact would just be
  # overwritten, so there's nothing to gain from depending on studio-ui here.
  publish-crates:
    name: publish crates.io
    if: github.event_name == 'push'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      - name: Publish crates (just release-publish real)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not set; skipping crates.io publish." >&2
            echo "See docs/tooling/npm-publishing.md for setup." >&2
            exit 0
          fi
          just release-publish real

  build:
    name: build (${{ matrix.target }})
    needs: [prepare, studio-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: studio-ui-bundle
          path: crates/cratestack-studio
      - name: Build cratestack-cli
        run: cargo build --profile dist --locked -p cratestack-cli --target ${{ matrix.target }}
      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          target="${{ matrix.target }}"
          bin_dir="target/${target}/dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="cratestack-cli-${target}-${tag}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path '${bin_dir}/cratestack.exe' -DestinationPath '${asset}'"
          else
            asset="cratestack-cli-${target}-${tag}.tar.gz"
            tar -czf "$asset" -C "$bin_dir" cratestack
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Only on a real tag push, never on a manual workflow_dispatch test run —
  # unlike a GitHub Release, an npm publish can't be deleted and retried
  # cleanly, so a throwaway test tag must not reach the registry.
  #
  # Auth is npm's OIDC "Trusted Publishing" (GA since npm CLI 11.5.1 / Node
  # 22.14+) — no NPM_TOKEN at all. This is a hard cutover, not a soft-skip:
  # unlike the PAT it replaces, there's no secret to check for absence, so
  # until the Trusted Publisher is configured on npmjs.com for this package
  # (org `cratestack`, repo `cratestack/cratestack`, workflow filename
  # `release-cli.yml`, no environment) this step just fails rather than
  # quietly no-op'ing. See docs/tooling/npm-publishing.md for setup.
  # `id-token: write` (job-scoped, not workflow-wide) is also npm
  # provenance's Sigstore/OIDC requirement — needs a public repo, which
  # this is — and is what the trusted-publish token exchange itself uses.
  publish-npm:
    name: publish npm package (@cratestack/cli)
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/cli
        run: .github/scripts/npm-publish.sh packages/cratestack-cli-npm --access public --provenance

  # @cratestack/api and its split family (ts-types, link-*, runtime-*,
  # validator-*, adapter-*) all ship their own compiled dist/ in the
  # tarball and never fetch a GitHub Release binary (unlike
  # @cratestack/cli), so this job has no ordering dependency on the
  # `build` matrix — only needs `prepare` for the resolved tag. Same
  # tag-push-only gate and OIDC Trusted Publishing hard-cutover as
  # publish-npm above, for the same reasons — EACH of these 10 packages
  # needs its own separate Trusted Publisher entry on npmjs.com (same
  # repo/workflow-filename values; see docs/tooling/npm-publishing.md),
  # not just @cratestack/api's.
  #
  # Published in dependency order (ts-types has no `@cratestack/*` deps;
  # link-*/runtime-*/validator-*/adapter-* depend only on ts-types;
  # api depends on all of them) even though a registry publish doesn't
  # strictly require its dependency to already be live — this just
  # avoids a brief window where `npm view` on a mid-publish package
  # would show an unresolvable dependency.
  publish-npm-api-family:
    name: publish npm packages (@cratestack/api family)
    if: github.event_name == 'push'
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        # `pnpm install` runs postinstall for every workspace package,
        # including cratestack-cli-npm's — which downloads the matching
        # GitHub Release binary for whatever version is in its
        # package.json (the same tag this job checked out). This job
        # doesn't need that binary and only depends on `prepare`, not
        # `build`/`release`, so that GitHub Release may not exist yet at
        # this point — skip the download rather than race it.
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/api family
        run: |
          pnpm turbo run build \
            --filter='./packages/cratestack-ts-types' \
            --filter='./packages/cratestack-link-batch' \
            --filter='./packages/cratestack-link-logger' \
            --filter='./packages/cratestack-runtime-fetch' \
            --filter='./packages/cratestack-runtime-axios' \
            --filter='./packages/cratestack-validator-zod' \
            --filter='./packages/cratestack-validator-yup' \
            --filter='./packages/cratestack-adapter-tanstack-query' \
            --filter='./packages/cratestack-adapter-rtk' \
            --filter='./packages/cratestack-api'
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/api family
        run: |
          set -euo pipefail
          for pkg in \
            cratestack-ts-types cratestack-link-batch cratestack-link-logger \
            cratestack-runtime-fetch cratestack-runtime-axios \
            cratestack-validator-zod cratestack-validator-yup \
            cratestack-adapter-tanstack-query cratestack-adapter-rtk \
            cratestack-api; do
            echo "::group::npm publish $pkg"
            # Not called directly under `set -e` — that would exit the
            # script the instant a publish fails, skipping the
            # `::endgroup::` below and leaving that log group open (and
            # misleadingly labeled) in the Actions UI for the rest of
            # the (now-aborted) run.
            #
            # An already-published package is a success as far as the
            # wrapper is concerned, so a re-run of a partially-completed
            # release no longer dies on the first package that already
            # landed and skips every package after it. A genuine failure
            # (bad auth, missing Trusted Publisher entry) still aborts
            # the loop here, as it should.
            if ! .github/scripts/npm-publish.sh "packages/$pkg" --access public --provenance; then
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done

  # ---- @cratestack/cbor family (issue #285) ------------------------------
  # Unlike the API family above, @cratestack/cbor-node is a real napi-rs
  # native addon (crates/cratestack-cbor-napi) — it needs a per-platform
  # release binary for each of `napi.targets` in its package.json, matching
  # the same 5 platforms `build` builds `cratestack-cli` for above. CI's
  # own `js-cbor-napi` job (ci.yml) deliberately only proves a single-host
  # sanity build; this is the real release matrix that job's own comment
  # said was deferred (issue #286's explicit scope note).
  build-cbor-node:
    name: build @cratestack/cbor-node (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cbor-node-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      # Same underlying command as the package's own `build:napi` script,
      # plus `--target` to cross-build for this matrix leg instead of the
      # runner's host target. `native.mjs`/`native.d.mts` (the platform-
      # dispatch JS/TS loader `napi build --platform` generates) come out
      # identical on every leg — uploaded from each anyway so the publish
      # job below doesn't need to special-case which leg "owns" them.
      - name: Build native addon (napi build)
        working-directory: packages/cratestack-cbor-node
        # Explicit bash — the default shell on the windows-msvc leg is
        # PowerShell, which doesn't understand `\` line continuations and
        # fails to parse this command ("Missing expression after unary
        # operator '--'"). Same reason `Package archive` above pins it.
        shell: bash
        run: |
          pnpm exec napi build \
            --manifest-path ../../crates/cratestack-cbor-napi/Cargo.toml \
            --platform --release --esm \
            --js native.mjs --dts native.d.mts \
            --output-dir . \
            --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cbor-node-binary-${{ matrix.target }}
          path: |
            packages/cratestack-cbor-node/*.node
            packages/cratestack-cbor-node/native.mjs
            packages/cratestack-cbor-node/native.d.mts
          if-no-files-found: error

  # Downloads every platform's `.node` binary built above into per-leg
  # subdirectories (deliberately NOT `merge-multiple` — `napi artifacts`
  # below expects to find each leg's file nested under its own artifact
  # name, the same layout `actions/download-artifact@v4` produces without
  # that flag), then runs the real `@napi-rs/cli` scaffolding sequence:
  # `napi create-npm-dirs` creates `npm/<platform>/package.json` for every
  # target in `napi.targets`, `napi artifacts` copies each downloaded
  # `.node` file into its matching `npm/<platform>/` dir (confirmed by
  # hand: it validates ALL configured targets are present before copying
  # any of them — an earlier version of this comment assumed `napi
  # prepublish` alone would handle this via its `prepublishOnly` hook; it
  # doesn't — `napi prepublish` hard-fails with "Release package directory
  # does not exist" if `npm/<platform>/` isn't pre-scaffolded, confirmed by
  # actually running it locally). Only then does `npm publish`'s
  # `prepublishOnly` hook (`napi prepublish -t npm`, see the package's
  # package.json) publish each now-populated platform subpackage (e.g.
  # `@cratestack/cbor-node-darwin-arm64`) BEFORE npm packs and publishes
  # this main package with `optionalDependencies` pointing at them. Same
  # tag-push-only gate and OIDC Trusted Publishing hard-cutover as the
  # other publish-npm* jobs, except EACH of the 5 auto-generated platform
  # subpackages ALSO needs its own separate Trusted Publisher entry on
  # npmjs.com, on top of `@cratestack/cbor-node` itself — see
  # docs/tooling/npm-publishing.md, including the bootstrap note there:
  # a brand-new package name can't have Trusted Publishing configured
  # until it's been published manually at least once, so this job will
  # keep failing for any platform subpackage that hasn't gone through that
  # one-time manual bootstrap yet, even once all 5 binaries build cleanly.
  publish-npm-cbor-node:
    name: publish npm package (@cratestack/cbor-node)
    if: github.event_name == 'push'
    needs: [prepare, build-cbor-node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: cbor-node-binary-*
          path: cbor-node-artifacts
      - name: List downloaded platform binaries
        run: find cbor-node-artifacts -name '*.node'
      # `napi artifacts` (below) only handles the `.node` binaries — it
      # does NOT copy `native.mjs`/`native.d.mts` (the JS/TS loader `napi
      # build --platform` generates), confirmed the hard way: a first
      # version of this job without this step failed tsc with "Cannot
      # find module '../native.mjs'". Every leg's copy is identical (see
      # build-cbor-node's own comment), so grabbing the first match found
      # is enough.
      - name: Copy the native.mjs/native.d.mts loader (identical on every leg)
        run: |
          find cbor-node-artifacts -name 'native.mjs' -exec cp {} packages/cratestack-cbor-node/ \; -quit
          find cbor-node-artifacts -name 'native.d.mts' -exec cp {} packages/cratestack-cbor-node/ \; -quit
      - name: Scaffold per-platform npm packages
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec napi create-npm-dirs
      - name: Move each platform's binary into its npm/<platform>/ dir
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec napi artifacts --output-dir ../../cbor-node-artifacts
      # cbor-node's own `tsc` doesn't build its workspace dependency
      # (`@cratestack/ts-types`) — that only happens automatically via
      # turbo's `^build` dependency graph, which this job deliberately
      # doesn't invoke for cbor-node itself (its full `build` script also
      # runs `build:napi`, needing a Rust toolchain this job doesn't set
      # up). Confirmed the hard way: without this, tsc fails with "Cannot
      # find module '@cratestack/ts-types'" (no `dist/` to resolve types
      # against).
      - name: Build @cratestack/ts-types (cbor-node's only workspace dependency)
        run: pnpm --filter ./packages/cratestack-ts-types run build
      - name: Compile TypeScript wrapper (native artifacts already built above)
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec tsc -p tsconfig.json
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      # `--provenance` on the outer `npm publish` only covers THIS command
      # — it doesn't propagate into the per-platform `npm publish` calls
      # `napi prepublish` makes internally via the prepublishOnly hook, so
      # provenance is requested via npm config instead, covering both.
      # `npm config set` writes to the *user* config (~/.npmrc) by
      # default, so it applies regardless of which directory it runs
      # from — the wrapper below cd's into the package itself.
      - name: Publish @cratestack/cbor-node (+ per-platform subpackages)
        run: |
          npm config set provenance true
          .github/scripts/npm-publish.sh packages/cratestack-cbor-node --access public

  # Same rationale as js-cbor-wasm in ci.yml: needs a real Rust wasm32
  # toolchain (the package's `prebuild` hook runs `wasm-pack build` against
  # crates/cratestack-cbor-wasm), so it gets its own toolchain setup rather
  # than reusing publish-npm-api-family's plain-Node job. No ordering
  # dependency on `build`/`build-cbor-node` — this package ships its own
  # compiled wasm bundle in the tarball, same as the API family.
  publish-npm-cbor-web:
    name: publish npm package (@cratestack/cbor-web)
    if: github.event_name == 'push'
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # wasm32-unknown-unknown is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel (same
      # mechanism ci.yml's js-cbor-wasm job relies on).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cbor-web
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-pack only downloads its own `wasm-opt` when one isn't
      # already on PATH (src/wasm_opt.rs short-circuits on
      # `which::which("wasm-opt")` with no version check), and the
      # version it reaches for is hardcoded — 0.15.0, the current
      # release, still pins binaryen version_117. That download is an
      # unpinned network fetch in the middle of a release build, and it
      # is what failed run 31094655414: `failed to download from
      # .../binaryen-version_117-x86_64-linux.tar.gz`. The asset itself
      # is fine (it still resolves), so that was a transient
      # GitHub-releases hiccup — installing wasm-opt ourselves takes the
      # fetch off the critical path so the same blip can't fail a
      # release again.
      #
      # Pinned to version_130 rather than tracking latest (version_131
      # at time of writing): 130 is the release upstream wasm-pack
      # itself vetted in rustwasm/wasm-pack#1599, merged 2026-08-05 but
      # not yet in a published wasm-pack release. x86_64-linux is
      # correct here — this job is `runs-on: ubuntu-latest`, no matrix.
      # taiki-e/install-action has no binaryen manifest, hence the
      # explicit curl.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/cbor-web (wasm-pack + tsc)
        run: pnpm turbo run build --filter='./packages/cratestack-cbor-web'
      # Pinned to the latest 11.x, not an unbounded `npm@latest` — see the
      # `publish-npm-cbor-node` job's own comment on this same step for why
      # (a real npm 12.x regression broke @napi-rs/cli's release-package
      # validation there; this job doesn't use napi, but there's no reason
      # to opt into the same moving-target risk everywhere else too).
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/cbor-web
        run: .github/scripts/npm-publish.sh packages/cratestack-cbor-web --access public --provenance

  # The umbrella package (issue #288) — pure TS, conditional node/browser
  # exports. Gated on both platform packages above (not just `prepare`)
  # for the same "avoid a window where `npm view` sees an unresolvable
  # dependency" reason publish-npm-api-family's ordering comment gives,
  # even though `.npmrc`'s `link-workspace-packages=true` means the local
  # `pnpm install` below resolves cbor-node/cbor-web from the workspace
  # symlink either way, not the registry. `turbo.json` deliberately scopes
  # this package's build dependency to `ts-types#build` only (see that
  # file's comment) — an ambient-types fallback + graceful test-skip means
  # this build doesn't actually need cbor-node/cbor-web's dist/ on disk.
  publish-npm-cbor:
    name: publish npm package (@cratestack/cbor)
    if: github.event_name == 'push'
    needs: [prepare, publish-npm-cbor-node, publish-npm-cbor-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/cbor
        run: pnpm turbo run build --filter='./packages/cratestack-cbor'
      # Pinned to the latest 11.x, not an unbounded `npm@latest` — see the
      # `publish-npm-cbor-node` job's own comment on this same step for why
      # (a real npm 12.x regression broke @napi-rs/cli's release-package
      # validation there; this job doesn't use napi, but there's no reason
      # to opt into the same moving-target risk everywhere else too).
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/cbor
        run: .github/scripts/npm-publish.sh packages/cratestack-cbor --access public --provenance

  # @cratestack/refine (issue #571) — a refine.dev dataProvider over the
  # generated TypeScript REST client. Deliberately its own job rather than
  # an 11th entry in publish-npm-api-family's loop: it is not part of the
  # @cratestack/api split (no `@cratestack/*` dependency at all, only a
  # `@refinedev/core` peer), and a missing Trusted Publisher entry on the
  # newest package name shouldn't be able to abort that loop. Same plain-TS
  # shape as publish-npm-cbor above — own compiled dist/ in the tarball, no
  # Rust/wasm toolchain, no ordering dependency beyond `prepare`.
  #
  # NOTE this job's build is `tsc` only. The package's *tests* need a real
  # generated client (`just refine-fixture`, which builds cratestack-cli) —
  # that runs in ci.yml's `js (@cratestack/refine)` job on every PR, not
  # here; a release tag publishes what CI already proved.
  publish-npm-refine:
    name: publish npm package (@cratestack/refine)
    if: github.event_name == 'push'
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/refine
        run: pnpm turbo run build --filter='./packages/cratestack-refine'
      # Pinned to the latest 11.x, not an unbounded `npm@latest` — see the
      # `publish-npm-cbor-node` job's own comment on this same step for why.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/refine
        run: .github/scripts/npm-publish.sh packages/cratestack-refine --access public --provenance

  # ---- cratestack_cbor (pub.dev, cratestack#563) --------------------------
  # The third registry this workflow publishes to, after crates.io and npm.
  # `dart-packages/cratestack_cbor` vendors prebuilt native/wasm binaries
  # INSIDE the pub.dev archive rather than fetching or building them at
  # consumer install time (maintainer decision — see
  # docs/tooling/cratestack-cbor-development.md and
  # docs/tooling/dart-publishing.md) — the pub.dev analogue of what
  # `build-cbor-node`/`publish-npm-cbor-node` already do for npm, except
  # pub.dev has no per-platform optionalDependencies mechanism, so every
  # platform's binary ships in the ONE archive instead of one subpackage
  # per platform.
  #
  # Auth is pub.dev's own GitHub Actions OIDC ("Automated publishing" —
  # https://dart.dev/tools/pub/automated-publishing), configured on the
  # package's Admin tab (repository `cratestack/cratestack`, tag pattern
  # `v{{version}}`) — no token, no secret, same shape as npm's Trusted
  # Publishing above. `id-token: write` (job-scoped) is what that OIDC
  # exchange uses; `dart pub publish` detects it automatically when run
  # inside GitHub Actions with that permission, no separate login step.
  #
  # **This job cannot bootstrap the package.** pub.dev's own docs are
  # explicit: "Today, you can only automate publishing of existing
  # packages. To create a new package, you must publish the first version
  # using `dart pub publish`." `cratestack_cbor` 0.8.0's first publish is
  # therefore a one-time manual step by a maintainer (see
  # docs/tooling/dart-publishing.md) — this job only works from the
  # release AFTER that, once Automated publishing is enabled on pub.dev.
  # Same tag-push-only gate as every other publish-* job here: a pub.dev
  # publish has no delete, only limited retraction, so a throwaway test
  # tag must never reach it.
  #
  # Same Flutter-not-Dart-SDK reasoning as `cratestack-cbor-package`/
  # `cratestack-cbor-example`/`cratestack-cbor-android` in ci.yml: this
  # package's pubspec declares `flutter.plugin.platforms`, which obliges
  # `environment.flutter` and makes it unresolvable by a standalone Dart
  # SDK. Every toolchain-install step below mirrors those three ci.yml
  # jobs exactly (same pins, same reasoning) because this job vendors all
  # three artifact sets those jobs vendor separately — see each ci.yml
  # job's own comments for the individual "why" of each step; not
  # repeated here.
  # Proves the pub.dev OIDC credential path works WITHOUT publishing anything.
  #
  # Why this exists: every fix to the publish path so far has been unverifiable
  # until a real tag met a real registry, and four consecutive releases each
  # surfaced a different defect that way. The last one — v0.8.2 — printed
  # "Authentication failed!", published nothing, and exited 0. This job closes
  # that loop cheaply: run it on demand, learn whether authentication works,
  # spend no version number finding out.
  #
  # The trick is to attempt a publish of a version pub.dev ALREADY HAS. The two
  # outcomes are unambiguous and neither one publishes:
  #
  #   "already exists" / "version ... has already been published"
  #        -> authentication SUCCEEDED. pub.dev accepted the credential and
  #           rejected on version. This is the pass condition.
  #   "Authentication failed" / "Invalid JWT" / an OAuth consent URL
  #        -> the credential path is still broken.
  #
  # SAFETY: this refuses to run unless the version in pubspec.yaml is already
  # live on pub.dev. Without that gate the job would be a publish button on a
  # workflow_dispatch trigger, which is exactly what `if: github.event_name ==
  # 'push'` on the real publish job exists to prevent.
  verify-pubdev-credentials:
    name: verify pub.dev OIDC credentials (publishes nothing)
    if: github.event_name == 'workflow_dispatch' && inputs.verify_pubdev_credentials
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # THE SAFETY GATE. Everything else in this job is a diagnostic; this is
      # the part that makes running it safe. If the version is not already on
      # pub.dev, the publish attempt below would really publish it.
      - name: Refuse to run unless this version is already published
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version:' dart-packages/cratestack_cbor/pubspec.yaml | awk '{print $2}')"
          live="$(curl -fsSL https://pub.dev/api/packages/cratestack_cbor \
                  | python3 -c 'import json,sys; print(" ".join(v["version"] for v in json.load(sys.stdin)["versions"]))')"
          echo "pubspec version: ${want}"
          echo "live on pub.dev: ${live}"
          case " ${live} " in
            *" ${want} "*)
              echo "✓ ${want} is already published — a publish attempt cannot create anything new" ;;
            *)
              echo "::error::cratestack_cbor ${want} is NOT yet on pub.dev. This job would really publish it, which is not what it is for. Run it against a tag whose version is already live (e.g. v0.8.2)." >&2
              exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter_rust_bridge_codegen (pinned =2.12.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.12.0
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - name: Install cargo-ndk (pinned =4.1.2)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: Install Android rustup targets
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      - name: Resolve Android NDK
        run: |
          set -euo pipefail
          pinned="${ANDROID_HOME}/ndk/28.2.13676358"
          if [ -d "$pinned" ]; then ndk="$pinned"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then ndk="${ANDROID_NDK_LATEST_HOME}"
          else ndk="$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"; fi
          if [ -z "${ndk:-}" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found under ${ANDROID_HOME}/ndk" >&2; exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
      # The archive must be VALID to reach the authentication step at all — pub
      # validates the package before it uploads, so a half-vendored tree would
      # fail earlier and tell us nothing about credentials.
      - name: Vendor artifacts (so the archive is valid enough to reach auth)
        run: |
          just cbor-vendor-native
          just cbor-vendor-web
          just cbor-vendor-android
      # Adjacent to the attempt, exactly as in the real publish job: the token
      # is short-lived, and a 9-minute gap is what produced "Invalid JWT token:
      # invalid timestamps" on v0.8.2. Keeping it here means this job tests the
      # real ordering, not a more forgiving one.
      - uses: dart-lang/setup-dart@v1
      - name: Attempt publish and classify the outcome
        working-directory: dart-packages/cratestack_cbor
        env:
          FLUTTER_DART: ${{ env.FLUTTER_ROOT }}/bin/dart
        run: |
          set -euo pipefail
          dart_bin="${FLUTTER_DART}"
          [ -x "$dart_bin" ] || dart_bin="$(command -v dart)"
          echo "using: $dart_bin"
          set +e
          out="$(timeout 600 "$dart_bin" pub publish --force 2>&1)"
          status=$?
          set -e
          echo "$out"
          echo "--- exit status: $status ---"

          # Order matters: check for auth failure FIRST. `dart pub publish`
          # exits 0 even when authentication fails (observed on v0.8.2), so the
          # status tells us nothing and the output is the only signal.
          if grep -qiE "authentication failed|invalid jwt|pub needs your authorization|accounts\.google\.com" <<<"$out"; then
            echo "::error::CREDENTIALS BROKEN — pub.dev did not accept the OIDC token. This is the same failure as v0.8.1/v0.8.2; the release pipeline cannot publish. See the output above for which stage failed." >&2
            exit 1
          fi
          if grep -qiE "already exists|has already been published|version already" <<<"$out"; then
            echo "✓ CREDENTIALS OK — pub.dev authenticated the OIDC token and rejected only on version. The release pipeline can publish."
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::timed out after 10 minutes — almost certainly blocked on an interactive OAuth prompt, i.e. credentials broken." >&2
            exit 1
          fi
          # Anything else is unclassified. Do NOT report success: an unrecognised
          # outcome is exactly how v0.8.2 passed while publishing nothing.
          echo "::error::UNCLASSIFIED outcome (exit ${status}). Neither an auth failure nor an already-published rejection was recognised in the output. Read it above rather than assuming this is fine." >&2
          exit 1

  publish-pubdev-cbor:
    name: publish pub.dev package (cratestack_cbor)
    if: github.event_name == 'push'
    needs: [prepare]
    runs-on: ubuntu-latest
    # No job in this workflow set a timeout, so GitHub's 6-hour default
    # applied. On v0.8.1 that meant a publish blocked on an interactive OAuth
    # prompt would have held a runner all afternoon while reporting nothing.
    # This job's real work (toolchain + three vendor builds + publish) runs in
    # well under 20 minutes; anything past that is stuck, not slow.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # `dart-lang/setup-dart` is what makes OIDC publishing work, and its
      # absence is why v0.8.1 never reached pub.dev. Per
      # https://dart.dev/tools/pub/automated-publishing: "The token is created
      # and configured in the dart-lang/setup-dart step." Nothing else does
      # it — not `permissions: id-token: write` on its own, which only grants
      # the *ability* to mint a token, and not flutter-action, which knows
      # nothing about pub.dev credentials.
      #
      # Without it `dart pub publish --force` finds no credential and falls
      # back to interactive OAuth, printing a Google consent URL and waiting
      # for a browser. That is exactly what v0.8.1 did, twice, for 24 minutes
      # each time — and it looked like a pub.dev configuration problem, which
      # sent the investigation to the Admin tab rather than to this file.
      #
      # It is ADDITIVE to flutter-action, not a replacement: this package
      # declares `environment.flutter`, so `dart pub publish` needs a Flutter
      # SDK present or version solving fails outright (cratestack#633).
      # Dart's own reusable publish workflow
      # (dart-lang/setup-dart/.github/workflows/publish.yml) does the same
      # thing — setup-dart first, then a Flutter install, then publish — so
      # this ordering is the upstream-blessed combination rather than a
      # local guess.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter_rust_bridge_codegen (pinned =2.12.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.12.0
      # wasm-pack downloads its own binaryen (hardcoded version) mid-build
      # unless a `wasm-opt` is already on PATH — see ci.yml's identical step
      # for the incident that made this pinned rather than left to chance.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - name: Install cargo-ndk (pinned =4.1.2)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: Install Android rustup targets
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      - name: Resolve Android NDK
        run: |
          set -euo pipefail
          pinned="${ANDROID_HOME}/ndk/28.2.13676358"
          if [ -d "$pinned" ]; then
            ndk="$pinned"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            ndk="${ANDROID_NDK_LATEST_HOME}"
          else
            ndk="$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ndk:-}" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found. ANDROID_HOME=${ANDROID_HOME:-unset}, ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}" >&2
            ls -la "${ANDROID_HOME:-/nonexistent}" || true
            ls -la "${ANDROID_HOME:-/nonexistent}/ndk" || true
            exit 1
          fi
          echo "Using Android NDK: ${ndk}"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
      # THE STEP THIS JOB EXISTS FOR: all three artifact sets are gitignored
      # build output, never committed (see dart-packages/cratestack_cbor/
      # .gitignore) — a fresh checkout has none of them. Skipping any one of
      # these three would still let `dart pub publish` succeed (see the
      # verification step below for proof that pub.dev's own validator
      # gives no warning for a missing native library), so all three run
      # unconditionally, every release, with no "already vendored, skip"
      # shortcut.
      - name: Vendor native artifacts (flutter_rust_bridge glue + Linux release library)
        run: just cbor-vendor-native
      - name: Vendor web artifact (wasm-pack --target web)
        run: just cbor-vendor-web
      - name: Vendor Android artifacts (cargo ndk cross-compile, 3 ABIs)
        run: just cbor-vendor-android
      # THE GATE (cratestack#563's explicit requirement): prove the archive
      # actually contains what was just vendored, BEFORE publishing, rather
      # than trusting the vendor steps above to have worked. This is not
      # decorative — verified by hand (see docs/tooling/dart-publishing.md's
      # "can it fail" experiment): `dart pub publish --dry-run` against this
      # package with `blobs/` deleted reports the exact same single warning
      # as a fully-vendored package and NO indication anything is missing —
      # the native library is loaded via a hardcoded runtime path string,
      # not a declared Flutter asset, so pub's own analyzer-backed validator
      # never sees it. Counting the archive listing itself is therefore the
      # only real check.
      - name: Verify the archive actually contains the vendored artifacts
        working-directory: dart-packages/cratestack_cbor
        run: |
          set -euo pipefail
          dart pub get
          # `dart pub publish --dry-run` exits non-zero even for a fully
          # vendored, genuinely publishable package — it always reports one
          # benign warning about the intentionally-exact `flutter_rust_bridge`
          # pin (required because the vendored glue is codegen-version-
          # specific; see docs/tooling/cratestack-cbor-development.md gotcha
          # 3). So the exit code can't distinguish "fine" from "broken" —
          # capture the output regardless of status and inspect its CONTENT.
          set +e
          dry_run_output="$(dart pub publish --dry-run 2>&1)"
          set -e
          echo "$dry_run_output"

          # Exactly 4 vendored native libraries are expected: linux-x64,
          # android/arm64-v8a, android/x86_64, android/armeabi-v7a.
          so_count=$(grep -c 'libcratestack_client_flutter\.so' <<<"$dry_run_output" || true)
          # Exactly 2 vendored web artifacts: cratestack_cbor_wasm.js and
          # cratestack_cbor_wasm_bg.wasm.
          wasm_count=$(grep -c 'cratestack_cbor_wasm' <<<"$dry_run_output" || true)

          fail=0
          if [ "$so_count" -ne 4 ]; then
            echo "::error::expected 4 vendored libcratestack_client_flutter.so entries in the pub.dev archive (linux-x64 + arm64-v8a + x86_64 + armeabi-v7a), found $so_count. cbor-vendor-native/cbor-vendor-android did not populate the archive — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$wasm_count" -ne 2 ]; then
            echo "::error::expected 2 vendored cratestack_cbor_wasm entries in the pub.dev archive (.js + _bg.wasm), found $wasm_count. cbor-vendor-web did not populate the archive — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "✓ archive contains all vendored artifacts: 4 native libraries + 2 wasm files"
      # Assert OIDC is actually usable BEFORE publishing. `--force` skips the
      # confirmation prompt, not authentication: if pub cannot authenticate
      # via OIDC it falls back to interactive OAuth, prints a Google consent
      # URL, and waits for a browser that will never come.
      #
      # That is not hypothetical — it happened on the v0.8.1 release. The job
      # sat for 24 minutes printing:
      #
      #   Pub needs your authorization to upload packages on your behalf.
      #   In a web browser, go to https://accounts.google.com/o/oauth2/auth?…
      #   Waiting for your authorization...
      #
      # and, with no `timeout-minutes` set, would have held a runner for
      # GitHub's 6-hour default before anyone learned anything. The cause was
      # pub.dev-side (automated publishing not active for the package), which
      # this job cannot fix — but it can refuse to hang while finding out.
      - name: Assert the OIDC token endpoint is available
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token endpoint unavailable — the job is missing 'permissions: id-token: write'. dart pub publish would fall back to interactive OAuth and hang." >&2
            exit 1
          fi
          echo "✓ OIDC token endpoint present"
      # setup-dart sits HERE, immediately before the publish, not up with the
      # other toolchain steps. It mints the GitHub OIDC token, and that token
      # is short-lived. On v0.8.2 it ran 9 minutes before the publish — three
      # Rust builds and an Android cross-compile in between — and pub.dev
      # rejected the expired credential:
      #
      #   Invalid token for https://pub.dev deleted.
      #   Invalid JWT token: invalid timestamps.
      #   Authentication failed!
      #
      # Dart's own reusable publish workflow runs setup-dart immediately
      # before `dart pub publish` for this reason; there is nothing slow
      # between them. Keep it adjacent — moving it back up with the other
      # `uses:` steps reintroduces the expiry window.
      - uses: dart-lang/setup-dart@v1
      - name: Publish cratestack_cbor to pub.dev
        working-directory: dart-packages/cratestack_cbor
        env:
          # Publish with FLUTTER'S dart, explicitly, not whatever `dart`
          # resolves to on PATH. setup-dart now runs after flutter-action and
          # prepends its own standalone SDK; this package declares
          # `environment.flutter`, so a standalone `dart pub publish` fails
          # version solving outright (cratestack#633). The credential
          # setup-dart writes is shared via the pub config directory, so
          # Flutter's dart picks it up regardless of which binary is first on
          # PATH.
          FLUTTER_DART: ${{ env.FLUTTER_ROOT }}/bin/dart
        # Wrapped in `timeout`, NOT redirected from /dev/null. Worth being
        # precise about why, because the obvious fix does not work here: pub's
        # OAuth fallback does not read stdin. It starts a local HTTP server and
        # waits for a browser redirect — the v0.8.1 log shows
        # `redirect_uri=http://localhost:46305` — so closing stdin changes
        # nothing; it would still block on a socket that nothing will ever
        # connect to.
        run: |
          set -euo pipefail
          dart_bin="${FLUTTER_DART}"
          [ -x "$dart_bin" ] || dart_bin="$(command -v dart)"
          echo "publishing with: $dart_bin ($("$dart_bin" --version 2>&1))"
          if ! timeout 600 "$dart_bin" pub publish --force; then
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::dart pub publish timed out after 10 minutes — it fell back to interactive OAuth, meaning no OIDC credential was configured. Check IN THIS ORDER: (1) the 'dart-lang/setup-dart' step immediately above is still present and still adjacent to this step; (2) 'permissions: id-token: write' on this job; (3) pub.dev -> cratestack_cbor -> Admin -> Automated publishing, repository '${{ github.repository }}', tag pattern matching '${{ github.ref_name }}'." >&2
            fi
            exit "$status"
          fi
      # `dart pub publish` EXITS 0 ON AUTHENTICATION FAILURE. That is not a
      # theory: on v0.8.2 the step printed "Authentication failed!", published
      # nothing, exited 0, and this job reported success — a green release
      # where pub.dev never received the package. Every other channel had
      # already published irreversibly by then.
      #
      # So the exit code cannot be trusted, exactly like the archive gate
      # above cannot trust `--dry-run`'s exit code. Ask pub.dev what it
      # actually has. This check is cause-independent: expired token, rejected
      # credential, silent upload failure — all of them land here.
      - name: Verify pub.dev actually received the version
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version:' dart-packages/cratestack_cbor/pubspec.yaml | awk '{print $2}')"
          echo "expecting cratestack_cbor ${want} on pub.dev"
          # pub.dev states uploads "may take up-to 10 minutes" to appear, so
          # poll rather than asserting once.
          for attempt in $(seq 1 20); do
            got="$(curl -fsSL "https://pub.dev/api/packages/cratestack_cbor" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "✓ pub.dev serves cratestack_cbor ${got}"
              exit 0
            fi
            echo "  attempt ${attempt}/20: pub.dev latest is '${got:-unknown}', waiting..."
            sleep 30
          done
          echo "::error::pub.dev does not serve cratestack_cbor ${want} after 10 minutes. The publish step exited 0, but that proves nothing — dart pub publish exits 0 even when authentication fails (observed on v0.8.2). Read the publish step's output for 'Authentication failed!' or 'Invalid JWT token'." >&2
          exit 1
