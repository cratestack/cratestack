  # ---- dart-packages/{cratestack_annotations,cratestack_builder} ---------
  # cratestack#668 phase 1. Same OIDC/tag-push shape as `publish-pubdev-cbor`
  # above, and the two failures that job encodes apply here verbatim — read
  # its comments before touching these.
  #
  # Two differences from cbor, both simplifications: these are PURE DART
  # packages (no `environment.flutter`, no vendored native artifacts), so
  # `dart-lang/setup-dart` alone is the whole toolchain and `dart pub publish`
  # needs no FLUTTER_DART indirection.
  #
  # Sequenced annotations -> builder rather than run in parallel. Today the
  # order is not load-bearing (`cratestack_builder` depends on
  # `cratestack_annotations: ^0.8.5`, already published, so it resolves either
  # way), but on any release where the builder starts requiring a version of
  # the annotation package that this same run is publishing, parallel jobs
  # would race and the builder's publish would fail version solving.
  #
  # Neither job can bootstrap its package — see `publish-pubdev-cbor`'s note.
  # Both were first published manually at 0.8.5; these jobs handle every
  # release after that, and only once Automated publishing is enabled on each
  # package's pub.dev Admin tab (repository `cratestack/cratestack`, tag
  # pattern `v{{version}}`).
  publish-pubdev-annotations:
    name: publish pub.dev package (cratestack_annotations)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, preflight, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Assert the OIDC token endpoint is available
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token endpoint unavailable — the job is missing 'permissions: id-token: write'. dart pub publish would fall back to interactive OAuth and hang." >&2
            exit 1
          fi
          echo "✓ OIDC token endpoint present"
      # Adjacent to the publish on purpose: setup-dart mints a short-lived
      # OIDC token, and v0.8.2 failed because 9 minutes of other work ran in
      # between and pub.dev rejected the expired credential. Nothing slow
      # belongs between these two steps.
      - uses: dart-lang/setup-dart@v1
      # THE IRREVERSIBLE ONE. pub.dev versions are permanent — they cannot
      # be replaced or removed. Guarded on `push` so a rehearsal
      # (cratestack#652) can never reach it. Everything ABOVE this step —
      # the vendoring, the cross-host artifact downloads and the
      # archive-contents gate — still runs in a rehearsal, which is the
      # coverage the rehearsal exists to provide.
      - name: Publish cratestack_annotations to pub.dev
        if: github.event_name == 'push'
        working-directory: dart-packages/cratestack_annotations
        # `timeout`, not stdin redirection: pub's OAuth fallback waits on a
        # local HTTP redirect, not stdin, so closing stdin would not unblock
        # it. See `publish-pubdev-cbor` for the full reasoning.
        run: |
          set -euo pipefail
          if ! timeout 600 dart pub publish --force; then
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::dart pub publish timed out after 10 minutes — it fell back to interactive OAuth, meaning no OIDC credential was configured. Check IN THIS ORDER: (1) the 'dart-lang/setup-dart' step immediately above is still present and still adjacent to this step; (2) 'permissions: id-token: write' on this job; (3) pub.dev -> cratestack_annotations -> Admin -> Automated publishing, repository '${{ github.repository }}', tag pattern matching '${{ github.ref_name }}'." >&2
            fi
            exit "$status"
          fi
      # `dart pub publish` EXITS 0 ON AUTHENTICATION FAILURE — observed on
      # v0.8.2, where it printed "Authentication failed!", published nothing,
      # and reported success. Ask pub.dev what it serves instead of trusting
      # the exit code.
      # Guarded with its publish: polling pub.dev for a version nothing
      # just uploaded would fail for the wrong reason and read as a
      # rehearsal defect.
      - name: Verify pub.dev actually received the version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version:' dart-packages/cratestack_annotations/pubspec.yaml | awk '{print $2}')"
          echo "expecting cratestack_annotations ${want} on pub.dev"
          for attempt in $(seq 1 20); do
            got="$(curl -fsSL "https://pub.dev/api/packages/cratestack_annotations" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "✓ pub.dev serves cratestack_annotations ${got}"
              exit 0
            fi
            echo "  attempt ${attempt}/20: pub.dev latest is '${got:-unknown}', waiting..."
            sleep 30
          done
          echo "::error::pub.dev does not serve cratestack_annotations ${want} after 10 minutes. The publish step exited 0, but that proves nothing — dart pub publish exits 0 even when authentication fails (observed on v0.8.2). Read the publish step's output for 'Authentication failed!' or 'Invalid JWT token'." >&2
          exit 1

  publish-pubdev-builder:
    name: publish pub.dev package (cratestack_builder)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    # Depends on the annotations publish, not just `prepare` — see the block
    # comment above for why the order matters on a version-bumping release.
    needs: [prepare, publish-pubdev-annotations, preflight, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Assert the OIDC token endpoint is available
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token endpoint unavailable — the job is missing 'permissions: id-token: write'. dart pub publish would fall back to interactive OAuth and hang." >&2
            exit 1
          fi
          echo "✓ OIDC token endpoint present"
      - uses: dart-lang/setup-dart@v1
      # THE IRREVERSIBLE ONE. pub.dev versions are permanent — they cannot
      # be replaced or removed. Guarded on `push` so a rehearsal
      # (cratestack#652) can never reach it. Everything ABOVE this step —
      # the vendoring, the cross-host artifact downloads and the
      # archive-contents gate — still runs in a rehearsal, which is the
      # coverage the rehearsal exists to provide.
      - name: Publish cratestack_builder to pub.dev
        if: github.event_name == 'push'
        working-directory: dart-packages/cratestack_builder
        run: |
          set -euo pipefail
          if ! timeout 600 dart pub publish --force; then
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::dart pub publish timed out after 10 minutes — it fell back to interactive OAuth, meaning no OIDC credential was configured. Check IN THIS ORDER: (1) the 'dart-lang/setup-dart' step immediately above is still present and still adjacent to this step; (2) 'permissions: id-token: write' on this job; (3) pub.dev -> cratestack_builder -> Admin -> Automated publishing, repository '${{ github.repository }}', tag pattern matching '${{ github.ref_name }}'." >&2
            fi
            exit "$status"
          fi
      # Guarded with its publish: polling pub.dev for a version nothing
      # just uploaded would fail for the wrong reason and read as a
      # rehearsal defect.
      - name: Verify pub.dev actually received the version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version:' dart-packages/cratestack_builder/pubspec.yaml | awk '{print $2}')"
          echo "expecting cratestack_builder ${want} on pub.dev"
          for attempt in $(seq 1 20); do
            got="$(curl -fsSL "https://pub.dev/api/packages/cratestack_builder" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "✓ pub.dev serves cratestack_builder ${got}"
              exit 0
            fi
            echo "  attempt ${attempt}/20: pub.dev latest is '${got:-unknown}', waiting..."
            sleep 30
          done
          echo "::error::pub.dev does not serve cratestack_builder ${want} after 10 minutes. The publish step exited 0, but that proves nothing — dart pub publish exits 0 even when authentication fails (observed on v0.8.2). Read the publish step's output for 'Authentication failed!' or 'Invalid JWT token'." >&2
          exit 1

  # ---- cratestack_cbor macOS native library (cratestack#563 platform-matrix
  # release slice) ------------------------------------------------------------
  # Cross-compiling a macOS `.dylib`/xcframework from Linux is not possible,
  # so — unlike Linux/Android/web below, which `publish-pubdev-cbor` still
  # builds inline on its own `ubuntu-latest` host — this leg runs on
  # `macos-latest` and uploads its output for the publish job to download.
  # Mirrors `build-cbor-node`'s per-platform-leg -> single-publish-job shape
  # (see that job's own comment), but as a dedicated job rather than another
  # matrix leg: this platform's step sequence (two rustup targets, a
  # `cbor-vendor-macos` call instead of `cbor-vendor-lib <target>`, a
  # directory-tree artifact instead of one file) genuinely differs from
  # Windows' below, not just its `--target` value — folding both into one
  # matrix would hide that difference behind conditionals instead of making
  # it auditable per job, the way `cratestack-cbor-windows` in ci.yml (and
  # its eventual macOS counterpart) already read.
  #
  # `macos-latest` is an Apple Silicon (arm64) runner — building the
  # `x86_64-apple-darwin` slice needs that target added explicitly
  # (`dtolnay/rust-toolchain`'s `targets:` input, same mechanism `build`'s
  # matrix above uses per-target). This mirrors the napi release matrix's
  # choice to cross-build x86_64 on one arm64 runner rather than add a
  # separate `macos-15-intel` leg (contrast `build-cbor-node`'s matrix,
  # which DOES use a separate Intel leg) — defensible either way; picked
  # here to keep this one job self-contained rather than adding a second
  # macOS leg only to combine its output with this one via another
  # upload/download round-trip before `cbor-vendor-macos` can lipo them
  # together.
  #
  # `just cbor-vendor-glue` MUST run before `just cbor-vendor-macos` on this
  # fresh-checkout runner: `crates/cratestack-client-flutter/
  # src/frb_generated.rs` is gitignored, and building with `--features
  # frb-glue` without it fails with E0583 — confirmed against a real CI run,
  # not Windows-specific (see `cratestack-cbor-windows` in ci.yml for the
  # identical gotcha on that other cross-host leg). `just cbor-vendor-macos`
  # itself composes `cbor-vendor-lib macos-arm64` + `cbor-vendor-lib
  # macos-x64` internally (lipo's the two into a universal binary, then
  # `xcodebuild -create-xcframework`) — this job does not call either of
  # those two sub-recipes directly.
  #
  # OUTPUT PATH IS NOT `blobs/macos/` — confirmed by reading `justfile`'s
  # `cbor-vendor-macos` recipe and `macos/cratestack_cbor.podspec` (both
  # landed by a parallel slice partway through this job being written; this
  # comment was corrected against their real source, not left as the
  # original guess). CocoaPods resolves a podspec's `vendored_frameworks`
  # relative to the podspec's OWN directory and does not reliably accept
  # `../` escapes out of it, so the assembled xcframework is written
  # directly under `dart-packages/cratestack_cbor/macos/Frameworks/
  # CratestackCborNative.xcframework` — sibling of the podspec, not a peer
  # of `blobs/<platform>/` the way every other platform's artifact is. The
  # framework's own name (`CratestackCborNative`) is deliberately different
  # from the vendored library's filename on every other platform — see the
  # podspec's header comment (collides with the `<pod_name>.framework`
  # CocoaPods itself generates under `use_frameworks!` otherwise).
  #
  # SETTLED, and it is why this job uploads a ZIP rather than the tree:
  # `dart pub publish` DEREFERENCES symlinks, and a macOS framework without
  # its symlinks fails `codesign`, taking a consumer's `flutter build macos`
  # down with "Command CodeSign failed with a nonzero exit code". Measured
  # on a real Mac, not inferred — see `just cbor-vendor-macos`'s header for
  # the full set of measurements and the layouts that were ruled out.
  #
  # `just cbor-vendor-macos` therefore also emits
  # `CratestackCborNative.xcframework.zip` (zips store symlinks), the
  # package's `.pubignore` keeps the unpacked directory OUT of the archive,
  # and the podspec's `prepare_command` unpacks the zip at pod-install time.
  # Uploading that single zip here rather than the directory tree closes the
  # same hole one step earlier: `actions/upload-artifact` follows symlinks,
  # so uploading the tree would hand the publish job an already-dereferenced
  # framework before `dart pub publish` was ever reached.
  # ---- shared flutter_rust_bridge glue for the release platform legs ------
  # Mirrors ci.yml's `cbor-glue` job — read that one's header for the full
  # reasoning. Short version: frb codegen 2.13.0 CANNOT run on Windows in
  # this repo's layout (it compares a mixed-separator path against a
  # canonicalized UNC base dir and fails "prefix not found"), and running it
  # per-platform elsewhere means a multi-minute `cargo install` per leg to
  # produce output that is platform-independent by construction. Generate
  # once, here, and ship it to the platform legs as an artifact.
  #
  # `publish-pubdev-cbor` below deliberately still runs its own
  # `just cbor-vendor-native` (glue + linux-x64) inline: it is on
  # ubuntu-latest where codegen works, and it needs the glue anyway for the
  # Linux/Android/web artifacts it builds itself.
  build-cbor-glue:
    name: build cratestack_cbor frb glue (generated once, Linux)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor-glue
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # REQUIRED — see ci.yml's `cbor-glue` job for the failure this
      # prevents: frb codegen is a Rust binary but shells out to `dart`,
      # and dies with "Dart/Flutter toolchain not available" without it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      - name: Vendor flutter_rust_bridge glue (both halves)
        run: just cbor-vendor-glue
      # Two paths whose least-common-ancestor is the workspace root, so the
      # artifact preserves `crates/…` and `dart-packages/…` and consumers can
      # restore with `path: .`.
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-frb-glue-release
          path: |
            crates/cratestack-client-flutter/src/frb_generated.rs
            dart-packages/cratestack_cbor/lib/src/native/rust
          if-no-files-found: error
          retention-days: 1

  build-cbor-macos:
    name: build cratestack_cbor native library (macos)
    needs: [prepare, build-cbor-glue]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Same reason as ci.yml's `cratestack-cbor-macos` job — see that step's
      # comment. `with: targets:` on the action targets `stable`, but
      # rust-toolchain.toml pins 1.98.0, so the cross-target must be added by
      # a RUN step inside the checkout or the x86_64 leg fails E0463.
      - name: Add both Darwin targets (to the pinned toolchain, not stable)
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor-macos
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Takes the shared artifact rather than running codegen locally —
      # drops a multi-minute `cargo install` and guarantees macOS and Windows
      # consume byte-identical glue. See `build-cbor-glue` above.
      - name: Restore frb glue (generated once on Linux by `build-cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue-release
          path: .
      - name: Assert the glue is present
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          echo "✓ frb glue restored"
      - name: Vendor macOS xcframework (arm64 + x86_64, lipo'd, via cbor-vendor-macos)
        run: just cbor-vendor-macos
      # The ZIP ONLY — not the directory beside it. See this job's header:
      # upload-artifact follows symlinks, so uploading the unpacked
      # xcframework would dereference it in transit. One file, nothing to
      # dereference.
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-native-macos
          path: dart-packages/cratestack_cbor/macos/Frameworks/CratestackCborNative.xcframework.zip
          if-no-files-found: error

  # ---- cratestack_cbor iOS native library (cratestack#563 iOS slice) --------
  # Same cross-compile-is-impossible reasoning as `build-cbor-macos` above,
  # for the three `*-apple-ios*` triples this time — see that job's header
  # comment for the full "why a dedicated job, not another matrix leg"
  # rationale, which applies unchanged here. `build-cbor-macos`'s Rust
  # toolchain setup mirrors `cratestack-cbor-macos` in `ci.yml`; this job
  # mirrors `cratestack-cbor-ios` there the same way.
  #
  # `just cbor-vendor-glue` MUST run before `just cbor-vendor-ios` on this
  # fresh-checkout runner — identical E0583 reasoning as `build-cbor-macos`
  # above.
  #
  # OUTPUT PATH IS `ios/Frameworks/`, not `blobs/ios/` — same
  # podspec-relative-`vendored_frameworks` reasoning as `build-cbor-macos`'s
  # job comment, see `ios/cratestack_cbor.podspec`'s own header comment.
  #
  # UPLOADS THE UNPACKED XCFRAMEWORK DIRECTORY, not a zip — the one genuine
  # difference from `build-cbor-macos`'s upload step. iOS frameworks are
  # flat/shallow bundles with no symlinks (unlike macOS's versioned bundles —
  # see `just cbor-vendor-ios`'s and `ios/cratestack_cbor.podspec`'s header
  # comments for the full reasoning and the build-time assertion that backs
  # it), so there is nothing for `actions/upload-artifact`'s symlink-following
  # behavior to corrupt in transit and nothing for `dart pub publish` to
  # dereference later — the directory tree IS the published shape here, same
  # as every other platform's `blobs/<platform>/` artifact.
  build-cbor-ios:
    name: build cratestack_cbor native library (ios)
    needs: [prepare, build-cbor-glue]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Same reason as ci.yml's `cratestack-cbor-ios` job — see that step's
      # comment. `with: targets:` on the action targets `stable`, but
      # rust-toolchain.toml pins 1.98.0, so the cross-targets must be added
      # by a RUN step inside the checkout or they fail E0463.
      - name: Add all three iOS targets (to the pinned toolchain, not stable)
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor-ios
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Takes the shared artifact rather than running codegen locally — same
      # reason as `build-cbor-macos`'s identical step.
      - name: Restore frb glue (generated once on Linux by `build-cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue-release
          path: .
      - name: Assert the glue is present
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          echo "✓ frb glue restored"
      - name: Vendor iOS xcframework (all three triples, lipo'd simulator slice, via cbor-vendor-ios)
        run: just cbor-vendor-ios
      # THE DIRECTORY, not a zip — see this job's header comment for why
      # there is nothing here for upload-artifact's symlink-following
      # behavior to corrupt, unlike macOS's zip-only upload.
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-native-ios
          path: dart-packages/cratestack_cbor/ios/Frameworks/CratestackCborNative.xcframework
          if-no-files-found: error

  # ---- cratestack_cbor Windows native library (cratestack#563
  # platform-matrix release slice) --------------------------------------------
  # Same cross-compile-is-impossible reasoning as build-cbor-macos above,
  # for the MSVC `.dll` this time — see that job's comment for why this is a
  # dedicated job (mirroring ci.yml's `cratestack-cbor-windows`) rather than
  # another `build-cbor-node`-style matrix leg. `x86_64-pc-windows-msvc`
  # needs no extra `targets:` entry: it is already `windows-latest`'s
  # default host triple (same note as ci.yml's `cratestack-cbor-windows` and
  # this workflow's own `build` job matrix, which pairs that target with
  # `windows-latest` the same way).
  #
  # `just cbor-vendor-glue` before `just cbor-vendor-lib windows-x64` for the
  # identical E0583 reason as build-cbor-macos above and ci.yml's
  # `cratestack-cbor-windows` — not optional, confirmed against a real CI
  # run.
  build-cbor-windows:
    name: build cratestack_cbor native library (windows-x64)
    needs: [prepare, build-cbor-glue]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor-windows
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # No frb codegen on this runner — it cannot work here. See
      # `build-cbor-glue`'s header for the upstream Windows path bug.
      - name: Restore frb glue (generated once on Linux by `build-cbor-glue`)
        uses: actions/download-artifact@v8
        with:
          name: cbor-frb-glue-release
          path: .
      - name: Assert the glue is present
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/cratestack-client-flutter/src/frb_generated.rs \
            || { echo "::error::frb_generated.rs missing after download-artifact — cargo build --features frb-glue would fail with E0583." >&2; exit 1; }
          echo "✓ frb glue restored"
      - name: Vendor Windows native artifact (release build + copy)
        run: just cbor-vendor-lib windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-native-windows-x64
          path: dart-packages/cratestack_cbor/blobs/windows-x64
          if-no-files-found: error

  # ---- cratestack_cbor (pub.dev, cratestack#563) --------------------------
  # The third registry this workflow publishes to, after crates.io and npm.
  # `dart-packages/cratestack_cbor` vendors prebuilt native/wasm binaries
  # INSIDE the pub.dev archive rather than fetching or building them at
  # consumer install time (maintainer decision — see
  # docs/tooling/cratestack-cbor-development.md and
  # docs/tooling/dart-publishing.md) — the pub.dev analogue of what
  # `build-cbor-node`/`publish-npm-cbor-node` already do for npm, except
  # pub.dev has no per-platform optionalDependencies mechanism, so every
  # platform's binary ships in the ONE archive instead of one subpackage
  # per platform.
  #
  # SPLIT ACROSS THREE JOBS (cratestack#563 macOS/Windows platform-matrix
  # slice), not one, for the same reason `build-cbor-node` is a matrix
  # feeding a single `publish-npm-cbor-node`: you cannot cross-build a
  # macOS `.dylib`/xcframework or an MSVC `.dll` from Linux, so those two
  # platforms' native libraries have to come from `macos-latest`/
  # `windows-latest` runners and get carried into this job as
  # `actions/upload-artifact`/`actions/download-artifact` payloads, exactly
  # like `build-cbor-node`'s per-platform `.node` binaries do for
  # `publish-npm-cbor-node` below. Linux x86_64, the 3 Android ABIs, and web
  # deliberately STAY inline in this job rather than becoming their own
  # legs: `ubuntu-latest` can already build all three natively (Android via
  # `cargo-ndk` cross-compilation, no separate host needed), so splitting
  # them out would only add upload/download round-trips for artifacts that
  # already build on this exact host — see `build-cbor-macos` and
  # `build-cbor-windows` above this job for the two platforms that
  # genuinely can't.
  #
  # Auth is pub.dev's own GitHub Actions OIDC ("Automated publishing" —
  # https://dart.dev/tools/pub/automated-publishing), configured on the
  # package's Admin tab (repository `cratestack/cratestack`, tag pattern
  # `v{{version}}`) — no token, no secret, same shape as npm's Trusted
  # Publishing above. `id-token: write` (job-scoped) is what that OIDC
  # exchange uses; `dart pub publish` detects it automatically when run
  # inside GitHub Actions with that permission, no separate login step.
  #
  # **This job cannot bootstrap the package.** pub.dev's own docs are
  # explicit: "Today, you can only automate publishing of existing
  # packages. To create a new package, you must publish the first version
  # using `dart pub publish`." `cratestack_cbor` 0.8.0's first publish is
  # therefore a one-time manual step by a maintainer (see
  # docs/tooling/dart-publishing.md) — this job only works from the
  # release AFTER that, once Automated publishing is enabled on pub.dev.
  # Same tag-push-only gate as every other publish-* job here: a pub.dev
  # publish has no delete, only limited retraction, so a throwaway test
  # tag must never reach it.
  #
  # Same Flutter-not-Dart-SDK reasoning as `cratestack-cbor-package`/
  # `cratestack-cbor-example`/`cratestack-cbor-android` in ci.yml: this
  # package's pubspec declares `flutter.plugin.platforms`, which obliges
  # `environment.flutter` and makes it unresolvable by a standalone Dart
  # SDK. Every toolchain-install step below mirrors those three ci.yml
  # jobs exactly (same pins, same reasoning) because this job vendors the
  # Linux/Android/web artifact sets those jobs vendor separately — see each
  # ci.yml job's own comments for the individual "why" of each step; not
  # repeated here. The macOS and Windows native libraries are NOT built
  # here — they are downloaded below from `build-cbor-macos`/
  # `build-cbor-windows` above, which run on hosts that can actually
  # produce them.
  # NOTE — do not try to build a workflow_dispatch "verify credentials"
  # variant of this job. One was added (cratestack#640) and removed again,
  # because pub.dev's own documentation is explicit:
  #
  #   "Pub.dev only allows automated publishing from GitHub Actions when the
  #    workflow is triggered by pushing a git tag to GitHub."
  #   — https://dart.dev/tools/pub/automated-publishing
  #
  # So a dispatch-triggered attempt is rejected for TRIGGER reasons regardless
  # of whether the credential path works, and cannot distinguish "OIDC is
  # broken" from "this trigger is not allowed". It reports a false negative,
  # which is worse than no check — the ambiguity is exactly what made
  # diagnosing the v0.8.1/v0.8.2 failures take three rounds.
  #
  # The verification that DOES work is the "Verify pub.dev actually received
  # the version" step at the end of this job: it asks pub.dev what it serves
  # rather than trusting `dart pub publish`, which exits 0 even when
  # authentication fails. That is what proved v0.8.3 genuinely published.
  publish-pubdev-cbor:
    name: publish pub.dev package (cratestack_cbor)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, build-cbor-macos, build-cbor-ios, build-cbor-windows, preflight, publish-crates]
    runs-on: ubuntu-latest
    # No job in this workflow set a timeout, so GitHub's 6-hour default
    # applied. On v0.8.1 that meant a publish blocked on an interactive OAuth
    # prompt would have held a runner all afternoon while reporting nothing.
    # This job's own real work (toolchain + Linux/Android/web vendor builds +
    # downloading the macOS/iOS/Windows legs' artifacts + publish) runs in
    # well under 20 minutes; anything past that is stuck, not slow. The
    # `build-cbor-macos`/`build-cbor-ios`/`build-cbor-windows` jobs it now
    # waits on have their own separate `timeout-minutes: 30`, so a hang on
    # any of THOSE hosts is bounded independently rather than eating into
    # this job's own budget.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-pubdev-cbor
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack
      # `dart-lang/setup-dart` is what makes OIDC publishing work, and its
      # absence is why v0.8.1 never reached pub.dev. Per
      # https://dart.dev/tools/pub/automated-publishing: "The token is created
      # and configured in the dart-lang/setup-dart step." Nothing else does
      # it — not `permissions: id-token: write` on its own, which only grants
      # the *ability* to mint a token, and not flutter-action, which knows
      # nothing about pub.dev credentials.
      #
      # Without it `dart pub publish --force` finds no credential and falls
      # back to interactive OAuth, printing a Google consent URL and waiting
      # for a browser. That is exactly what v0.8.1 did, twice, for 24 minutes
      # each time — and it looked like a pub.dev configuration problem, which
      # sent the investigation to the Admin tab rather than to this file.
      #
      # It is ADDITIVE to flutter-action, not a replacement: this package
      # declares `environment.flutter`, so `dart pub publish` needs a Flutter
      # SDK present or version solving fails outright (cratestack#633).
      # Dart's own reusable publish workflow
      # (dart-lang/setup-dart/.github/workflows/publish.yml) does the same
      # thing — setup-dart first, then a Flutter install, then publish — so
      # this ordering is the upstream-blessed combination rather than a
      # local guess.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter_rust_bridge_codegen (pinned =2.13.0)
        run: cargo install --locked flutter_rust_bridge_codegen --version 2.13.0
      # wasm-pack downloads its own binaryen (hardcoded version) mid-build
      # unless a `wasm-opt` is already on PATH — see ci.yml's counterpart
      # step for the incident that made this pinned rather than left to
      # chance. Deliberately no longer described as "identical": since
      # cratestack#850 the two release-cli.yml binaryen downloads verify a
      # sha256 and ci.yml's seven do not. Checksumming those is worth doing
      # and is a separate change — a CI-wide supply-chain edit does not
      # belong in a release-pipeline PR, and CI cannot burn a version
      # number the way this workflow can.
      #
      # The sha256 is the digest GitHub reports for that release asset
      # (`gh api repos/WebAssembly/binaryen/releases/tags/version_130`,
      # `.assets[].digest`), cross-checked against a local `sha256sum` of
      # the downloaded file. Added by cratestack#850, whose own pinned-zig
      # step in `build-cbor-node` cites this step as the precedent for
      # "pin the version, verify the checksum" — a version pin alone does
      # not make a mutable release asset tamper-evident, so the precedent
      # had to actually exist before it could be cited.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-connrefused -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  binaryen.tar.gz" \
            | sha256sum -c -
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - name: Install cargo-ndk (pinned =4.1.2)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: Install Android rustup targets
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi
      - name: Resolve Android NDK
        run: |
          set -euo pipefail
          pinned="${ANDROID_HOME}/ndk/28.2.13676358"
          if [ -d "$pinned" ]; then
            ndk="$pinned"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            ndk="${ANDROID_NDK_LATEST_HOME}"
          else
            ndk="$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${ndk:-}" ] || [ ! -d "$ndk" ]; then
            echo "::error::no Android NDK found. ANDROID_HOME=${ANDROID_HOME:-unset}, ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}" >&2
            ls -la "${ANDROID_HOME:-/nonexistent}" || true
            ls -la "${ANDROID_HOME:-/nonexistent}/ndk" || true
            exit 1
          fi
          echo "Using Android NDK: ${ndk}"
          echo "ANDROID_NDK_HOME=${ndk}" >> "$GITHUB_ENV"
      # THE STEP THIS JOB EXISTS FOR: all three artifact sets are gitignored
      # build output, never committed (see dart-packages/cratestack_cbor/
      # .gitignore) — a fresh checkout has none of them. Skipping any one of
      # these three would still let `dart pub publish` succeed (see the
      # verification step below for proof that pub.dev's own validator
      # gives no warning for a missing native library), so all three run
      # unconditionally, every release, with no "already vendored, skip"
      # shortcut.
      - name: Vendor native artifacts (flutter_rust_bridge glue + Linux release library)
        run: just cbor-vendor-native
      - name: Vendor web artifact (wasm-pack --target web)
        run: just cbor-vendor-web
      - name: Vendor Android artifacts (cargo ndk cross-compile, 3 ABIs)
        run: just cbor-vendor-android
      # These three CANNOT be built on this (ubuntu-latest) host — downloaded
      # from `build-cbor-macos`/`build-cbor-ios`/`build-cbor-windows` above
      # instead of vendored inline, same "download what a cross-host job
      # produced" shape as `publish-npm-cbor-node`'s download of
      # `build-cbor-node`'s per-platform `.node` binaries. Explicit `name:` +
      # `path:` (not `pattern:`) on each — unlike that job's 5-target fan-in,
      # there are only three artifacts here and each has a known 1:1
      # destination directory, so there is no need for `pattern:`'s
      # per-artifact-name subfolder + a follow-up "find and copy" step; the
      # file(s) land directly where the gate and `dart pub publish` expect
      # them.
      # NOT blobs/macos/ — see build-cbor-macos's job comment: CocoaPods
      # resolves the podspec's `vendored_frameworks` relative to the
      # podspec's own directory, so `just cbor-vendor-macos` (that job)
      # writes the assembled xcframework under `macos/Frameworks/` instead,
      # sibling of `macos/cratestack_cbor.podspec`.
      - name: Download macOS xcframework (built on macos-latest — cannot cross-compile from this host)
        uses: actions/download-artifact@v8
        with:
          name: cbor-native-macos
          path: dart-packages/cratestack_cbor/macos/Frameworks
      # Same podspec-relative-path reasoning as the macOS download above,
      # aimed at `ios/Frameworks/` instead — see `ios/cratestack_cbor
      # .podspec`'s own header comment. UNLIKE the macOS download, this one
      # restores a DIRECTORY TREE, not a single zip file: `build-cbor-ios`
      # uploaded the unpacked xcframework directly (see that job's own
      # comment for why iOS has no zip to begin with), so
      # `download-artifact`'s `path:` here is the xcframework directory
      # itself — its contents land directly inside it, the same shape
      # `cbor-native-windows-x64`'s single-`.dll` download already uses for
      # a directory-shaped artifact, just with more files inside.
      - name: Download iOS xcframework (built on macos-latest — cannot cross-compile from this host)
        uses: actions/download-artifact@v8
        with:
          name: cbor-native-ios
          path: dart-packages/cratestack_cbor/ios/Frameworks/CratestackCborNative.xcframework
      - name: Download Windows native library (built on windows-latest — cannot cross-compile from this host)
        uses: actions/download-artifact@v8
        with:
          name: cbor-native-windows-x64
          path: dart-packages/cratestack_cbor/blobs/windows-x64
      - name: List downloaded cross-host artifacts
        run: |
          find dart-packages/cratestack_cbor/macos/Frameworks -type f
          find dart-packages/cratestack_cbor/ios/Frameworks -type f
          find dart-packages/cratestack_cbor/blobs/windows-x64 -type f
      # THE GATE (cratestack#563's explicit requirement): prove the archive
      # actually contains what was just vendored, BEFORE publishing, rather
      # than trusting the vendor steps above to have worked. This is not
      # decorative — verified by hand (see docs/tooling/dart-publishing.md's
      # "can it fail" experiment): `dart pub publish --dry-run` against this
      # package with `blobs/` deleted reports the exact same single warning
      # as a fully-vendored package and NO indication anything is missing —
      # the native library is loaded via a hardcoded runtime path string,
      # not a declared Flutter asset, so pub's own analyzer-backed validator
      # never sees it. Counting the archive listing itself is therefore the
      # only real check.
      - name: Verify the archive actually contains the vendored artifacts
        working-directory: dart-packages/cratestack_cbor
        run: |
          set -euo pipefail
          dart pub get
          # `dart pub publish --dry-run` exits non-zero even for a fully
          # vendored, genuinely publishable package — it always reports one
          # benign warning about the intentionally-exact `flutter_rust_bridge`
          # pin (required because the vendored glue is codegen-version-
          # specific; see docs/tooling/cratestack-cbor-development.md gotcha
          # 3). So the exit code can't distinguish "fine" from "broken" —
          # capture the output regardless of status and inspect its CONTENT.
          set +e
          dry_run_output="$(dart pub publish --dry-run 2>&1)"
          set -e
          echo "$dry_run_output"

          # Exactly 4 vendored native libraries are expected: linux-x64,
          # android/arm64-v8a, android/x86_64, android/armeabi-v7a.
          so_count=$(grep -c 'libcratestack_client_flutter\.so' <<<"$dry_run_output" || true)
          # Exactly 2 vendored web artifacts: cratestack_cbor_wasm.js and
          # cratestack_cbor_wasm_bg.wasm.
          wasm_count=$(grep -c 'cratestack_cbor_wasm' <<<"$dry_run_output" || true)
          # Exactly 1 vendored Windows native library — the one file
          # `build-cbor-windows` uploaded and this job downloaded into
          # blobs/windows-x64/ above.
          dll_count=$(grep -c 'cratestack_client_flutter\.dll' <<<"$dry_run_output" || true)
          # macOS ships ONE FILE: the symlink-preserving
          # `CratestackCborNative.xcframework.zip`. The unpacked directory
          # is deliberately excluded by the package's `.pubignore`, because
          # `dart pub publish` dereferences symlinks and a macOS framework
          # stripped of its symlinks fails `codesign` — a consumer's
          # `flutter build macos` then dies with "Command CodeSign failed".
          # Measured on a real Mac; see `just cbor-vendor-macos`'s header.
          #
          # So there are two assertions here, and the NEGATIVE one is the
          # load-bearing one. The previous version of this gate counted
          # entries under the unpacked directory and floored at 3 — which
          # passed happily on the broken shape, since dereferencing ADDS
          # entries rather than removing them. Counting more is exactly what
          # being broken looks like, so a floor could never have caught it.
          # SCOPED to the `macos`/`ios` top-level archive entries' own
          # lines, not flat whole-output greps — see below for why scoping
          # is load-bearing here, not a style choice. `dart pub publish
          # --dry-run`'s tree renderer never concatenates a parent directory
          # and its child onto one line (verified against this repo's
          # currently-resolved pub version — every nesting level gets its
          # OWN line with a box-drawing prefix, e.g. `│   ├── `), so a line
          # never contains a full path — only ONE path segment. That matters
          # because `CratestackCborNative.framework` (the per-slice iOS
          # directory name) and `CratestackCborNative.xcframework` (the
          # macOS/iOS top-level directory name) can each appear under EITHER
          # platform's archive entry with an identical-looking line, and a
          # global grep cannot tell which platform's entry it came from.
          macos_block="$(awk '
            /^(├── |└── )macos$/ { capture=1 }
            capture && !/^(├── |└── )macos$/ && /^(├── |└── )/ { capture=0 }
            capture { print }
          ' <<<"$dry_run_output")"
          ios_block="$(awk '
            /^(├── |└── )ios$/ { capture=1 }
            capture && !/^(├── |└── )ios$/ && /^(├── |└── )/ { capture=0 }
            capture { print }
          ' <<<"$dry_run_output")"

          # macOS ships ONE FILE: the symlink-preserving
          # `CratestackCborNative.xcframework.zip`. The unpacked directory
          # is deliberately excluded by the package's `.pubignore`, because
          # `dart pub publish` dereferences symlinks and a macOS framework
          # stripped of its symlinks fails `codesign` — a consumer's
          # `flutter build macos` then dies with "Command CodeSign failed".
          # Measured on a real Mac; see `just cbor-vendor-macos`'s header.
          #
          # So there are two assertions here, and the NEGATIVE one is the
          # load-bearing one. The previous version of this gate counted
          # entries under the unpacked directory and floored at 3 — which
          # passed happily on the broken shape, since dereferencing ADDS
          # entries rather than removing them. Counting more is exactly what
          # being broken looks like, so a floor could never have caught it.
          macos_zip_count=$(grep -c 'CratestackCborNative\.xcframework\.zip' <<<"$macos_block" || true)
          # THIS NEGATIVE CHECK WAS DEAD CODE UNTIL THIS FIX (found while
          # adding the analogous iOS checks below, cratestack#563's iOS
          # slice — not a pre-existing intentional design, a real bug). The
          # ORIGINAL pattern here was a flat, whole-output `grep -c
          # 'CratestackCborNative\.xcframework/'` (trailing SLASH, intended
          # to catch any archive line naming a path *under* the raw
          # directory). Per the box-drawing-per-line renderer behavior
          # explained above, that substring — parent directory name
          # immediately followed by `/` — never appears ANYWHERE in real
          # `dart pub publish --dry-run` output, leaked or not, so the old
          # check always evaluated to 0 regardless of whether the framework
          # had actually leaked unpacked into the archive. CONFIRMED, not
          # theorized: constructed a real leaked-directory fixture locally
          # (emptied `.pubignore`, ran a real `dart pub publish --dry-run`,
          # restored `.pubignore`) and the old pattern reported 0 against
          # it — a genuine "check that cannot fail," the exact anti-pattern
          # this gate exists to avoid (see the same job's own "counting more
          # is exactly what being broken looks like, so a floor could never
          # have caught it" reasoning two paragraphs up — same blind spot,
          # different mechanism). The replacement below — an anchored,
          # `macos`-scoped bare-directory-line match — correctly reports 0
          # against the healthy fixture and a real nonzero count against
          # the same constructed leaked fixture; both measured.
          macos_raw_count=$(grep -cE '(├── |└── )CratestackCborNative\.xcframework$' <<<"$macos_block" || true)

          # iOS ships the OPPOSITE way from macOS: the unpacked xcframework
          # directory tree IS the published shape (no zip, no
          # prepare_command) — see `just cbor-vendor-ios`'s and
          # `ios/cratestack_cbor.podspec`'s header comments for why a flat/
          # shallow iOS framework has no symlinks for `dart pub publish` to
          # dereference, so there is nothing the zip mechanism would buy
          # here. Two flat frameworks are assembled into the one
          # xcframework (device `ios-arm64` + universal simulator
          # `ios-arm64_x86_64-simulator`), so the positive assertion counts
          # exactly 2 `CratestackCborNative.framework` slice entries within
          # the `ios`-scoped block — confirmed against a real `dart pub
          # publish --dry-run` fixture to render as exactly 2 matching
          # lines, and confirmed to correctly drop to 1/0 against fixtures
          # missing one/both slices.
          ios_framework_count=$(grep -cE '(├── |└── )CratestackCborNative\.framework$' <<<"$ios_block" || true)
          # Negative check, mirroring macOS's intent — iOS is never expected
          # to ship a zip at all; one appearing would mean a future change
          # started zipping iOS's framework (mirroring macOS) without wiring
          # the corresponding `prepare_command`/`.pubignore` half, so the
          # zip would ship as dead weight nobody ever unpacks. MUST be
          # scoped to `ios_block`, not global, for the identical reason
          # `macos_raw_count` above must be scoped — an unscoped `grep -c
          # 'CratestackCborNative\.xcframework\.zip'` here would also match
          # macOS's own, entirely legitimate zip one entry up, silently
          # passing this check even when it should fail (verified: a real
          # fixture with a stray `ios/Frameworks/CratestackCborNative
          # .xcframework.zip` present alongside the real macOS zip made an
          # earlier, unscoped version of this check report 0, purely by
          # accident of the OTHER (macos_zip_count) check happening to also
          # fire — which would have silently stopped being true the moment
          # someone scoped `macos_zip_count` for accuracy, the same fix this
          # comment sits next to. Scoping both closes that coupling.
          ios_zip_count=$(grep -c 'CratestackCborNative\.xcframework\.zip' <<<"$ios_block" || true)

          fail=0
          if [ "$so_count" -ne 4 ]; then
            echo "::error::expected 4 vendored libcratestack_client_flutter.so entries in the pub.dev archive (linux-x64 + arm64-v8a + x86_64 + armeabi-v7a), found $so_count. cbor-vendor-native/cbor-vendor-android did not populate the archive — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$wasm_count" -ne 2 ]; then
            echo "::error::expected 2 vendored cratestack_cbor_wasm entries in the pub.dev archive (.js + _bg.wasm), found $wasm_count. cbor-vendor-web did not populate the archive — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$dll_count" -ne 1 ]; then
            echo "::error::expected 1 vendored cratestack_client_flutter.dll entry in the pub.dev archive (windows-x64), found $dll_count. The build-cbor-windows -> download-artifact step above did not populate blobs/windows-x64/ — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$macos_zip_count" -ne 1 ]; then
            echo "::error::expected exactly 1 CratestackCborNative.xcframework.zip entry in the pub.dev archive, found $macos_zip_count. The build-cbor-macos -> download-artifact step above did not populate macos/Frameworks/ — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$macos_raw_count" -ne 0 ]; then
            echo "::error::found $macos_raw_count archive entries for the unpacked CratestackCborNative.xcframework directory under macos/Frameworks/ — the UNPACKED framework is being shipped. dart pub publish dereferences symlinks, so what a consumer extracts would fail codesign and break their 'flutter build macos'. Check dart-packages/cratestack_cbor/.pubignore — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$ios_framework_count" -ne 2 ]; then
            echo "::error::expected exactly 2 CratestackCborNative.framework slice entries in the pub.dev archive under ios/Frameworks/ (device ios-arm64 + universal simulator), found $ios_framework_count. The build-cbor-ios -> download-artifact step above did not populate ios/Frameworks/ correctly — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$ios_zip_count" -ne 0 ]; then
            echo "::error::found $ios_zip_count CratestackCborNative.xcframework.zip entries under ios/Frameworks/ — iOS ships its xcframework UNPACKED (flat/shallow frameworks have no symlinks to lose), so a zip here means something now zips it without the matching prepare_command/.pubignore wiring macOS has. Check just cbor-vendor-ios and ios/cratestack_cbor.podspec — DO NOT PUBLISH." >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "✓ archive contains all vendored artifacts: 4 Linux/Android .so + 2 wasm files + 1 Windows .dll + 1 macOS .xcframework.zip (0 unpacked macOS framework entries) + 2 iOS xcframework slices (0 iOS zip entries)"
      # Assert OIDC is actually usable BEFORE publishing. `--force` skips the
      # confirmation prompt, not authentication: if pub cannot authenticate
      # via OIDC it falls back to interactive OAuth, prints a Google consent
      # URL, and waits for a browser that will never come.
      #
      # That is not hypothetical — it happened on the v0.8.1 release. The job
      # sat for 24 minutes printing:
      #
      #   Pub needs your authorization to upload packages on your behalf.
      #   In a web browser, go to https://accounts.google.com/o/oauth2/auth?…
      #   Waiting for your authorization...
      #
      # and, with no `timeout-minutes` set, would have held a runner for
      # GitHub's 6-hour default before anyone learned anything. The cause was
      # pub.dev-side (automated publishing not active for the package), which
      # this job cannot fix — but it can refuse to hang while finding out.
      - name: Assert the OIDC token endpoint is available
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC token endpoint unavailable — the job is missing 'permissions: id-token: write'. dart pub publish would fall back to interactive OAuth and hang." >&2
            exit 1
          fi
          echo "✓ OIDC token endpoint present"
      # setup-dart sits HERE, immediately before the publish, not up with the
      # other toolchain steps. It mints the GitHub OIDC token, and that token
      # is short-lived. On v0.8.2 it ran 9 minutes before the publish — three
      # Rust builds and an Android cross-compile in between — and pub.dev
      # rejected the expired credential:
      #
      #   Invalid token for https://pub.dev deleted.
      #   Invalid JWT token: invalid timestamps.
      #   Authentication failed!
      #
      # Dart's own reusable publish workflow runs setup-dart immediately
      # before `dart pub publish` for this reason; there is nothing slow
      # between them. Keep it adjacent — moving it back up with the other
      # `uses:` steps reintroduces the expiry window.
      - uses: dart-lang/setup-dart@v1
      # THE IRREVERSIBLE ONE. pub.dev versions are permanent — they cannot
      # be replaced or removed. Guarded on `push` so a rehearsal
      # (cratestack#652) can never reach it. Everything ABOVE this step —
      # the vendoring, the cross-host artifact downloads and the
      # archive-contents gate — still runs in a rehearsal, which is the
      # coverage the rehearsal exists to provide.
      - name: Publish cratestack_cbor to pub.dev
        if: github.event_name == 'push'
        working-directory: dart-packages/cratestack_cbor
        env:
          # Publish with FLUTTER'S dart, explicitly, not whatever `dart`
          # resolves to on PATH. setup-dart now runs after flutter-action and
          # prepends its own standalone SDK; this package declares
          # `environment.flutter`, so a standalone `dart pub publish` fails
          # version solving outright (cratestack#633). The credential
          # setup-dart writes is shared via the pub config directory, so
          # Flutter's dart picks it up regardless of which binary is first on
          # PATH.
          FLUTTER_DART: ${{ env.FLUTTER_ROOT }}/bin/dart
        # Wrapped in `timeout`, NOT redirected from /dev/null. Worth being
        # precise about why, because the obvious fix does not work here: pub's
        # OAuth fallback does not read stdin. It starts a local HTTP server and
        # waits for a browser redirect — the v0.8.1 log shows
        # `redirect_uri=http://localhost:46305` — so closing stdin changes
        # nothing; it would still block on a socket that nothing will ever
        # connect to.
        run: |
          set -euo pipefail
          dart_bin="${FLUTTER_DART}"
          [ -x "$dart_bin" ] || dart_bin="$(command -v dart)"
          echo "publishing with: $dart_bin ($("$dart_bin" --version 2>&1))"
          if ! timeout 600 "$dart_bin" pub publish --force; then
            status=$?
            if [ "$status" -eq 124 ]; then
              echo "::error::dart pub publish timed out after 10 minutes — it fell back to interactive OAuth, meaning no OIDC credential was configured. Check IN THIS ORDER: (1) the 'dart-lang/setup-dart' step immediately above is still present and still adjacent to this step; (2) 'permissions: id-token: write' on this job; (3) pub.dev -> cratestack_cbor -> Admin -> Automated publishing, repository '${{ github.repository }}', tag pattern matching '${{ github.ref_name }}'." >&2
            fi
            exit "$status"
          fi
      # `dart pub publish` EXITS 0 ON AUTHENTICATION FAILURE. That is not a
      # theory: on v0.8.2 the step printed "Authentication failed!", published
      # nothing, exited 0, and this job reported success — a green release
      # where pub.dev never received the package. Every other channel had
      # already published irreversibly by then.
      #
      # So the exit code cannot be trusted, exactly like the archive gate
      # above cannot trust `--dry-run`'s exit code. Ask pub.dev what it
      # actually has. This check is cause-independent: expired token, rejected
      # credential, silent upload failure — all of them land here.
      # Guarded with its publish: polling pub.dev for a version nothing
      # just uploaded would fail for the wrong reason and read as a
      # rehearsal defect.
      - name: Verify pub.dev actually received the version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          want="$(grep -m1 '^version:' dart-packages/cratestack_cbor/pubspec.yaml | awk '{print $2}')"
          echo "expecting cratestack_cbor ${want} on pub.dev"
          # pub.dev states uploads "may take up-to 10 minutes" to appear, so
          # poll rather than asserting once.
          for attempt in $(seq 1 20); do
            got="$(curl -fsSL "https://pub.dev/api/packages/cratestack_cbor" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin)["latest"]["version"])' 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "✓ pub.dev serves cratestack_cbor ${got}"
              exit 0
            fi
            echo "  attempt ${attempt}/20: pub.dev latest is '${got:-unknown}', waiting..."
            sleep 30
          done
          echo "::error::pub.dev does not serve cratestack_cbor ${want} after 10 minutes. The publish step exited 0, but that proves nothing — dart pub publish exits 0 even when authentication fails (observed on v0.8.2). Read the publish step's output for 'Authentication failed!' or 'Invalid JWT token'." >&2
          exit 1

  # ---- THE OUTCOME MANIFEST (cratestack#651, option (c)) -------------------
  #
  # `if: always()` and `needs:` EVERY publish job, so this runs whether the
  # release succeeded, failed, or was skipped. Its whole job is to answer the
  # question a red release used to leave open: the run is marked failed, but
  # WHICH channels are live?
  #
  # That question was not academic. On v0.8.2 the run went red with
  # crates.io and all seven npm packages already published irreversibly and
  # pub.dev not — and the failure notification could not distinguish that
  # from "nothing shipped". Recovery was an investigation. With this it is a
  # table.
  #
  # `needs.<job>.result` is one of success / failure / cancelled / skipped.
  # `skipped` is the normal state for every publish job on a
  # `workflow_dispatch` rebuild (they carry `if: github.event_name ==
  # 'push'`), and it is reported as "not attempted" rather than folded in
  # with a failure — conflating the two is how a green-looking summary lies.
  release-manifest:
    name: release manifest (what actually published)
    if: always()
    needs:
      - prepare
      - preflight
      - publish-crates
      - publish-npm
      - publish-npm-api-family
      - publish-npm-cbor-node
      - publish-npm-cbor-web
      - publish-npm-cbor
      - publish-npm-refine
      - publish-pubdev-annotations
      - publish-pubdev-builder
      - publish-pubdev-cbor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the channel manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PREFLIGHT: ${{ needs.preflight.result }}
          REHEARSAL: ${{ needs.prepare.outputs.rehearsal }}
          R_CRATES: ${{ needs.publish-crates.result }}
          R_NPM: ${{ needs.publish-npm.result }}
          R_NPM_API: ${{ needs.publish-npm-api-family.result }}
          R_NPM_CBOR_NODE: ${{ needs.publish-npm-cbor-node.result }}
          R_NPM_CBOR_WEB: ${{ needs.publish-npm-cbor-web.result }}
          R_NPM_CBOR: ${{ needs.publish-npm-cbor.result }}
          R_NPM_REFINE: ${{ needs.publish-npm-refine.result }}
          R_PUBDEV_ANNOTATIONS: ${{ needs.publish-pubdev-annotations.result }}
          R_PUBDEV_BUILDER: ${{ needs.publish-pubdev-builder.result }}
          R_PUBDEV_CBOR: ${{ needs.publish-pubdev-cbor.result }}
        run: |
          set -uo pipefail
          # success -> LIVE (irreversible), failure -> FAILED, skipped ->
          # not attempted, cancelled -> cancelled. The LIVE wording is
          # deliberate: it is what tells a reader at a glance that this
          # version number is spent on that registry.
          render() {
            # In a rehearsal a green publish job means "the gates passed and
            # the write was skipped" — emphatically NOT that anything is
            # live. Rendering it as LIVE would be the exact false-green
            # cratestack#651 and #652 both exist to kill, one level up.
            if [ "${REHEARSAL}" = "true" ] && [ "$1" = "success" ]; then
              echo "🧪 rehearsed — gates passed, nothing published"
              return
            fi
            case "$1" in
              success)   echo "🟢 **LIVE** (irreversible)" ;;
              failure)   echo "🔴 FAILED — nothing published" ;;
              skipped)   echo "⚪ not attempted" ;;
              cancelled) echo "🟡 cancelled" ;;
              *)         echo "❔ $1" ;;
            esac
          }
          {
            if [ "${REHEARSAL}" = "true" ]; then
              echo "## REHEARSAL — nothing was published (cratestack#652)"
              echo
              echo "Ref built: \`${TAG}\`. Every artifact was built and every content"
              echo "gate ran; every irreversible write was skipped. No version number"
              echo "was consumed. The guard that makes that structural rather than"
              echo "hopeful is \`.ci/release-rehearsal-guard-check.py\`, enforced on"
              echo "every PR."
              echo
              echo "**Channels below show what a real release WOULD have attempted.**"
            else
              echo "## Release channel manifest — \`${TAG}\`"
            fi
            echo
            echo "Pre-flight (cratestack#651): \`${PREFLIGHT}\`"
            if [ "${{ github.event_name }}" != "push" ]; then
              echo
              echo "> pub.dev credentials were **NOT COVERED** by the pre-flight on this trigger."
              echo "> Its OIDC trust is per-tag-pattern, so only a tag push can mint an accepted"
              echo "> token (cratestack#641). Uncovered is not the same as passed."
            fi
            echo
            echo "| Channel | Package | Outcome |"
            echo "| --- | --- | --- |"
            echo "| crates.io | (whole workspace) | $(render "$R_CRATES") |"
            echo "| npm | @cratestack/cli | $(render "$R_NPM") |"
            echo "| npm | api family | $(render "$R_NPM_API") |"
            echo "| npm | @cratestack/cbor-node | $(render "$R_NPM_CBOR_NODE") |"
            echo "| npm | @cratestack/cbor-web | $(render "$R_NPM_CBOR_WEB") |"
            echo "| npm | @cratestack/cbor | $(render "$R_NPM_CBOR") |"
            echo "| npm | @cratestack/refine | $(render "$R_NPM_REFINE") |"
            echo "| pub.dev | cratestack_annotations | $(render "$R_PUBDEV_ANNOTATIONS") |"
            echo "| pub.dev | cratestack_builder | $(render "$R_PUBDEV_BUILDER") |"
            echo "| pub.dev | cratestack_cbor | $(render "$R_PUBDEV_CBOR") |"
            echo
            if [ "${REHEARSAL}" = "true" ]; then
              echo "**No recovery needed — this was a rehearsal.** Re-run it as often as you like."
            else
            echo "**Recovery.** A channel marked LIVE cannot be republished at this version —"
            echo "crates.io versions are immutable, npm unpublish is time-limited and"
            echo "discouraged, pub.dev versions are permanent. If any channel above is FAILED"
            echo "while others are LIVE, the fix is a NEW version number, not a re-run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
