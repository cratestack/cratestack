# Builds and publishes prebuilt `cratestack-cli` binaries to a GitHub
# Release, so consumers can install without a Rust toolchain (see #131).
# Also publishes every workspace crate to crates.io, every npm package this
# repo ships (with npm provenance attached: @cratestack/cli — the
# binary-fetching npm wrapper, the @cratestack/api family — 10 hand-written
# packages shipping their own compiled dist/, the @cratestack/cbor family —
# cbor, cbor-node (a real napi-rs multi-platform native addon), cbor-web,
# and @cratestack/refine), and the `cratestack_cbor` pub.dev package (a real
# flutter_rust_bridge/wasm-bindgen Flutter plugin vendoring prebuilt
# binaries for every platform it claims — see the publish-pubdev-cbor job).
#
# Triggers on a `vX.Y.Z` tag push. The normal way to produce one is the
# "Prepare Release" workflow (bump versions → open a PR → merging it
# auto-tags via "Cut Release Tag"); `just release VERSION PUSH=1` remains
# available as a local/manual fallback that produces the same tag push.
# This workflow also accepts a manual `workflow_dispatch` against an
# EXISTING tag, for re-running a failed release — that dispatch path only
# rebuilds/re-attaches binaries, it never touches crates.io, npm, or pub.dev
# (see the publish-crates/publish-npm*/publish-pubdev-cbor jobs' own
# comments for why — none of these three registries support a delete+retry
# the way a GitHub Release does).
#
# Artifact naming follows the cargo-binstall convention declared in
# crates/cratestack-cli/Cargo.toml's [package.metadata.binstall] — the
# two must stay in sync; see that file for the pkg-url template.
name: Release CLI Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and attach binaries to, e.g. v0.4.13. Leave EMPTY for a rehearsal on the current branch."
        required: false
        default: ""
      # cratestack#652. Every pipeline defect between v0.8.0 and v0.8.3 was
      # found by cutting a real release and watching it fail — or watching
      # it SUCCEED while shipping nothing. Eleven PRs, not one of them
      # found by CI, because this workflow's first execution against any
      # change to it *is* a production release.
      #
      # A rehearsal runs the same jobs, the same builds and the same
      # content gates, and stops immediately before each irreversible
      # write. It is a FLAG ON THE REAL PIPELINE, never a second copy —
      # that is #652's Risk 1, and a diverging copy would stop
      # representing reality within one release.
      rehearsal:
        description: "Rehearse: build everything, run every gate, publish NOTHING. Safe on any branch; consumes no version number."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the tag once so every downstream job (checkout ref, archive
  # names, release target) agrees, whether triggered by a tag push or a
  # manual dispatch against an existing tag.
  prepare:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      # Filename-safe form of `tag`. On a real release these are identical
      # (`v0.9.1`), so nothing about a tagged run changes. They differ only
      # in a rehearsal, where `tag` falls back to `GITHUB_REF_NAME` — a
      # BRANCH name, which in this repo routinely contains a slash
      # (`claude/release-0.9.1`). Interpolated into an asset filename, that
      # slash is a path separator: `tar` was asked to write
      # `cratestack-cli-x86_64-unknown-linux-gnu-claude/release-0.9.1.tar.gz`
      # into a directory that does not exist, and every one of the five
      # `build` jobs died there — after compiling successfully. That made
      # rehearsal unusable on exactly the branches this repo creates, and
      # meant a rehearsal could never reach the pre-flight it exists to
      # exercise. Use `tag` for refs and release names; use this for paths.
      asset_slug: ${{ steps.resolve.outputs.asset_slug }}
      rehearsal: ${{ steps.resolve.outputs.rehearsal }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          # A rehearsal (cratestack#652) needs NO tag — that is the whole
          # point, since the thing being avoided is spending a version
          # number. With the input empty it builds whatever ref triggered
          # the run, which is normally a branch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            resolved="${{ inputs.tag }}"
          else
            resolved="${GITHUB_REF_NAME}"
          fi
          echo "tag=${resolved}" >> "$GITHUB_OUTPUT"
          # Slashes are legal in a branch name and illegal in a flat
          # filename. Identical to `tag` for any real release tag.
          echo "asset_slug=${resolved//\//-}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rehearsal }}" = "true" ]; then
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
            echo "::notice::REHEARSAL — every build and gate runs; nothing is published."
          else
            echo "rehearsal=false" >> "$GITHUB_OUTPUT"
          fi
      # A manual dispatch against a tag that doesn't exist yet used to fail
      # deep inside `actions/checkout` with an opaque `git fetch` error (no
      # such ref). Fail fast here instead, with an actionable message — this
      # dispatch path only rebuilds/re-attaches binaries for an EXISTING
      # tag; cutting a NEW release goes through the "Prepare Release"
      # workflow (bump → PR → merge → auto-tag), not this input.
      # Skipped for a rehearsal with no tag — there is nothing to validate,
      # and requiring one would defeat the purpose.
      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          if ! git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' does not exist in ${{ github.repository }}. If you're trying to cut a NEW release, run the 'Prepare Release' workflow instead (it bumps versions and opens a PR; merging it auto-creates the tag). This workflow's manual dispatch only rebuilds binaries for an existing tag." >&2
            exit 1
          fi

  # The Studio UI (embedded in cratestack-cli via cratestack-studio's
  # default `embed-ui` feature) needs a Trunk build of the wasm app.
  # Built once here and shared with every platform job below — Trunk
  # output isn't target-specific, and re-running it per matrix leg would
  # just burn CI time for an identical artifact. Without this, a fresh
  # checkout in each build job has no `dist/`, and cratestack-studio's
  # build.rs falls back to a placeholder admin UI (see its doc comment).
  studio-ui:
    name: bundle studio UI
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      - name: Bundle Studio UI
        run: just bundle-studio-ui
      - uses: actions/upload-artifact@v7
        with:
          name: studio-ui-bundle
          path: |
            crates/cratestack-studio/embedded-ui.tar.gz
            crates/cratestack-studio/embedded-ui-dist.tar.gz
          retention-days: 1

  # ---- THE PUBLISH GATE (cratestack#651) ----------------------------------
  #
  # RELEASE PUBLISH POLICY, decided by the maintainer on cratestack#651
  # (2026-08-29) and recorded here so the next person does not re-derive it:
  # options (b) AND (c) combined.
  #
  #   (b) Every channel's credentials and artifacts are validated in this
  #       one pre-flight, and NO channel publishes until it passes. Every
  #       `publish-*` job below carries `preflight` in its `needs`.
  #   (c) Whatever happens, `release-manifest` at the end of this file
  #       states which channels are live at which version.
  #
  # WHY, in one paragraph. During v0.8.1-v0.8.3 the pub.dev leg failed
  # repeatedly (hang, then a false green, then an OIDC timestamp error)
  # while crates.io and every npm publish had ALREADY succeeded
  # irreversibly. Three version numbers were burned recovering from a
  # failure in the least-established channel. (c) alone makes recovery a
  # known procedure but does not prevent that; (b) is what prevents it.
  # (c) is kept alongside because (b) cannot cover a mid-publish failure,
  # and when one happens the run must still say unambiguously what went
  # out. Option (a) — order by recoverability — was NOT chosen: it
  # lengthens the release and still publishes eight channels before
  # discovering the ninth is broken.
  #
  # WHAT THIS CANNOT COVER, stated rather than implied. A pre-flight that
  # quietly green-lights an unverifiable credential recreates the exact
  # false-green this came from, so:
  #   - pub.dev's OIDC trust is configured per-tag-pattern, so a
  #     `workflow_dispatch` run cannot mint an accepted token at all (see
  #     cratestack#641, which reverted an attempt built on the wrong
  #     assumption). On that trigger this job reports pub.dev as NOT
  #     COVERED — never as passed. On a real tag push it IS checked.
  #   - `publish-pubdev-cbor` vendors its Linux/web/Android artifacts
  #     INSIDE the publish job, so those specific artifacts are not behind
  #     this barrier. Everything built by a separate `build-*` job is,
  #     because this job waits on all of them.
  #   - Nothing here proves a publish will succeed. It proves the
  #     credential authenticates and the artifacts exist. The last step of
  #     each publish remains untestable without doing it.
  #
  # The per-channel gates downstream (the pub.dev archive-contents check,
  # the post-publish "did pub.dev actually receive this version" poll) are
  # UNTOUCHED. This job is additive; it does not replace or weaken them.
  preflight:
    name: publish pre-flight (credentials + artifacts)
    # Deliberately runs on BOTH triggers, unlike the publish jobs. On a
    # `workflow_dispatch` rebuild nothing publishes, but running the
    # pre-flight anyway is how the credential checks get exercised outside
    # a release — with pub.dev honestly reported as uncovered.
    needs:
      - prepare
      - studio-ui
      - build
      - build-cbor-node
      - build-cbor-glue
      - build-cbor-macos
      - build-cbor-ios
      - build-cbor-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Minting a token here is the check — see the two OIDC steps below.
      id-token: write
    steps:
      # crates.io is the one channel with a classic secret rather than
      # OIDC. Presence is not enough: an EXPIRED token is present and
      # non-empty, and would sail through a `-z` check straight into an
      # irreversible-for-every-other-channel release. So ask crates.io
      # whether it accepts it.
      - name: crates.io credential
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. publish-crates would fail after other channels had already published." >&2
            exit 1
          fi
          # `--user-agent` is REQUIRED, not politeness. crates.io rejects
          # curl's default `curl/X.Y.Z` User-Agent at the edge, BEFORE it
          # looks at the Authorization header, and answers `403` with a
          # ZERO-BYTE body. That is indistinguishable by status code from a
          # genuinely bad token, and it is what this check did on its first
          # ever real run (v0.9.0): it failed a token that had published
          # successfully hours earlier, and told the maintainer to rotate a
          # credential that was never evaluated.
          #
          # The two cases are only separable by the body:
          #   no/instant-rejected UA -> 403, body is empty
          #   bad token, real UA     -> 403, {"errors":[{"detail":"authentication failed"}]}
          # crates.io does not use 401 for any of these, so the status code
          # alone can never tell them apart.
          code="$(curl -sS -o /tmp/crates_me.json -w '%{http_code}' \
            --user-agent "cratestack-release-preflight (https://github.com/cratestack/cratestack)" \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            https://crates.io/api/v1/me || echo 000)"
          # `/api/v1/me` is a WEBSITE-SESSION endpoint: no API token can ever
          # complete it, so `200` is not a reachable success here. What the
          # response distinguishes is whether the token AUTHENTICATED, which
          # is the thing worth proving before ten channels start publishing.
          # crates.io evaluates auth first, then the endpoint's session
          # requirement, so the two failures are ordered and separable:
          #
          #   bad/unknown token -> {"errors":[{"detail":"authentication failed"}]}
          #   VALID token       -> {"errors":[{"detail":"this action can only be
          #                          performed on the crates.io website"}]}
          #
          # The second message is only ever emitted AFTER authentication
          # succeeds — reaching it is positive proof the credential is good.
          # An empty body means the request was rejected at the edge before
          # the token was read at all (a missing or blocked User-Agent),
          # which says nothing about the credential either way.
          body="$(head -c 400 /tmp/crates_me.json 2>/dev/null || true)"
          case "$body" in
            *"authentication failed"*)
              echo "::error::crates.io REJECTED CARGO_REGISTRY_TOKEN (HTTP ${code}): authentication failed. This one really is a bad or revoked credential — rotate it in Settings -> Secrets." >&2
              printf '%s\n' "$body" >&2
              exit 1
              ;;
            *"can only be performed on the crates.io website"*)
              echo "✓ crates.io authenticated the token (the endpoint itself is website-only, which is expected and is what proves auth succeeded)"
              ;;
            "")
              echo "::error::crates.io returned HTTP ${code} with an EMPTY body — the request was rejected before the token was read (historically: a missing or blocked User-Agent). This is NOT a credential signal; do not rotate on it." >&2
              exit 1
              ;;
            *)
              if [ "$code" = "200" ]; then
                echo "✓ crates.io accepts the token"
              else
                echo "::error::crates.io returned an unrecognised HTTP ${code} response. Body follows — check it against the two known cases before assuming the credential is at fault." >&2
                printf '%s\n' "$body" >&2
                exit 1
              fi
              ;;
          esac
          echo "✓ crates.io accepts the token"

      # npm trusted publishing is OIDC, so there is no secret to check.
      # What CAN fail — and has, on pub.dev, which is the same mechanism —
      # is the job lacking `id-token: write`, leaving the publish to fall
      # back to an interactive flow. Minting a token proves the permission
      # is actually granted, not merely written in the YAML.
      - name: npm OIDC token is mintable
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token endpoint in this job's environment — 'permissions: id-token: write' is missing. Every npm publish job would fall back to an interactive flow." >&2
            exit 1
          fi
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)"
          if [ -z "$token" ]; then
            echo "::error::OIDC token endpoint returned no token for the npm audience. The npm publish jobs cannot authenticate." >&2
            exit 1
          fi
          echo "✓ OIDC token minted for npm (length ${#token})"

      # THE HONEST ONE. Read cratestack#641 before changing this.
      - name: pub.dev OIDC token is mintable (tag push only)
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::warning::pub.dev: NOT COVERED by this pre-flight. Its OIDC trust is configured per-tag-pattern, so a '${{ github.event_name }}' run cannot mint a token pub.dev would accept (cratestack#641). This is reported as uncovered, NOT as passed."
            exit 0
          fi
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)"
          if [ -z "$token" ]; then
            echo "::error::Could not mint an OIDC token for the pub.dev audience on a tag push. All three pub.dev publishes would fall back to interactive OAuth and hang." >&2
            exit 1
          fi
          echo "✓ OIDC token minted for pub.dev (length ${#token})"

      # The artifact half of the gate is the `needs:` list above, not a
      # step: every cross-host `build-*` job must have SUCCEEDED for this
      # job to start, and every publish job waits on this one. A missing
      # or failed artifact in ANY channel therefore blocks EVERY publish,
      # which is the property cratestack#651 asks for and which the
      # previous fan-out could not provide.
      - name: Gate summary
        run: |
          echo "✓ pre-flight passed for ${{ needs.prepare.outputs.tag }} — all build artifacts present, credentials accepted"

  # Publishes every workspace crate to crates.io in dependency order via the
  # same `just release-publish real` a human would otherwise run locally.
  # Idempotent (the recipe skips already-published versions), so a re-run
  # after a partial failure — or a re-dispatch against the same tag — is
  # safe. Independent of the binary build matrix / npm publish below, so it
  # runs in parallel with `build` rather than gating on it. Needs its own
  # trunk + wasm32 setup (not the studio-ui job's artifact) because
  # `release-publish`'s `cratestack-studio` step unconditionally re-invokes
  # `just bundle-studio-ui`, which always rebuilds via trunk regardless of
  # whether a tarball already exists — a downloaded artifact would just be
  # overwritten, so there's nothing to gain from depending on studio-ui here.
  publish-crates:
    name: publish crates.io
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pins wasm-bindgen-cli to the studio-ui lockfile's exact version so
      # Trunk resolves it from PATH instead of downloading it mid-build.
      # See the action's header for the incident and the verification.
      - uses: ./.github/actions/install-trunk-toolchain
      # THE IRREVERSIBLE ONE. crates.io versions are immutable; there is
      # no undo, only `yank`. Guarded on `push` so a rehearsal
      # (cratestack#652) can never reach it under any input combination.
      - name: Publish crates (just release-publish real)
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not set; skipping crates.io publish." >&2
            echo "See docs/tooling/npm-publishing.md for setup." >&2
            exit 0
          fi
          just release-publish real

      # The rehearsal's substitute: `just release-publish dry` runs
      # `cargo publish --dry-run`, which packages AND verifies every crate
      # in the same topological order the real publish uses, and uploads
      # nothing. Same recipe, different mode — not a second transcription.
      - name: Rehearse crates.io publish (just release-publish dry — uploads nothing)
        if: needs.prepare.outputs.rehearsal == 'true'
        run: just release-publish dry
  build:
    name: build (${{ matrix.target }})
    needs: [prepare, studio-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: studio-ui-bundle
          path: crates/cratestack-studio
      - name: Build cratestack-cli
        run: cargo build --profile dist --locked -p cratestack-cli --target ${{ matrix.target }}
      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # asset_slug, not tag — see the `prepare` job's output comment.
          tag="${{ needs.prepare.outputs.asset_slug }}"
          target="${{ matrix.target }}"
          bin_dir="target/${target}/dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="cratestack-cli-${target}-${tag}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path '${bin_dir}/cratestack.exe' -DestinationPath '${asset}'"
          else
            asset="cratestack-cli-${target}-${tag}.tar.gz"
            tar -czf "$asset" -C "$bin_dir" cratestack
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist
      # Guarded for rehearsals (cratestack#652). A GitHub Release is the
      # one outward-facing write here that IS reversible — but publishing
      # release notes for a branch that is not a release would still be
      # visible to users, so a rehearsal does not create one.
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Only on a real tag push, never on a manual workflow_dispatch test run —
  # unlike a GitHub Release, an npm publish can't be deleted and retried
  # cleanly, so a throwaway test tag must not reach the registry.
  #
  # Auth is npm's OIDC "Trusted Publishing" (GA since npm CLI 11.5.1 / Node
  # 22.14+) — no NPM_TOKEN at all. This is a hard cutover, not a soft-skip:
  # unlike the PAT it replaces, there's no secret to check for absence, so
  # until the Trusted Publisher is configured on npmjs.com for this package
  # (org `cratestack`, repo `cratestack/cratestack`, workflow filename
  # `release-cli.yml`, no environment) this step just fails rather than
  # quietly no-op'ing. See docs/tooling/npm-publishing.md for setup.
  # `id-token: write` (job-scoped, not workflow-wide) is also npm
  # provenance's Sigstore/OIDC requirement — needs a public repo, which
  # this is — and is what the trusted-publish token exchange itself uses.
  publish-npm:
    name: publish npm package (@cratestack/cli)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, build, preflight, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/cli
        env:
          # cratestack#652: the shared wrapper switches to
          # `npm publish --dry-run` when this is 1. Wiring it here rather
          # than adding a second rehearsal-only step keeps ONE code path
          # per package — a duplicated step is what drifts.
          NPM_PUBLISH_REHEARSAL: ${{ needs.prepare.outputs.rehearsal == 'true' && '1' || '0' }}
        run: .github/scripts/npm-publish.sh packages/cratestack-cli-npm --access public --provenance

  # @cratestack/api and its split family (ts-types, link-*, runtime-*,
  # validator-*, adapter-*) all ship their own compiled dist/ in the
  # tarball and never fetch a GitHub Release binary (unlike
  # @cratestack/cli), so this job has no ordering dependency on the
  # `build` matrix — only needs `prepare` for the resolved tag. Same
  # tag-push-only gate and OIDC Trusted Publishing hard-cutover as
  # publish-npm above, for the same reasons — EACH of these 10 packages
  # needs its own separate Trusted Publisher entry on npmjs.com (same
  # repo/workflow-filename values; see docs/tooling/npm-publishing.md),
  # not just @cratestack/api's.
  #
  # Published in dependency order (ts-types has no `@cratestack/*` deps;
  # link-*/runtime-*/validator-*/adapter-* depend only on ts-types;
  # api depends on all of them) even though a registry publish doesn't
  # strictly require its dependency to already be live — this just
  # avoids a brief window where `npm view` on a mid-publish package
  # would show an unresolvable dependency.
  publish-npm-api-family:
    name: publish npm packages (@cratestack/api family)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, preflight, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        # `pnpm install` runs postinstall for every workspace package,
        # including cratestack-cli-npm's — which downloads the matching
        # GitHub Release binary for whatever version is in its
        # package.json (the same tag this job checked out). This job
        # doesn't need that binary and only depends on `prepare`, not
        # `build`/`release`, so that GitHub Release may not exist yet at
        # this point — skip the download rather than race it.
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/api family
        run: |
          pnpm turbo run build \
            --filter='./packages/cratestack-ts-types' \
            --filter='./packages/cratestack-link-batch' \
            --filter='./packages/cratestack-link-logger' \
            --filter='./packages/cratestack-runtime-fetch' \
            --filter='./packages/cratestack-runtime-axios' \
            --filter='./packages/cratestack-validator-zod' \
            --filter='./packages/cratestack-validator-yup' \
            --filter='./packages/cratestack-adapter-tanstack-query' \
            --filter='./packages/cratestack-adapter-rtk' \
            --filter='./packages/cratestack-api'
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/api family
        env:
          # cratestack#652: the shared wrapper switches to
          # `npm publish --dry-run` when this is 1. Wiring it here rather
          # than adding a second rehearsal-only step keeps ONE code path
          # per package — a duplicated step is what drifts.
          NPM_PUBLISH_REHEARSAL: ${{ needs.prepare.outputs.rehearsal == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          for pkg in \
            cratestack-ts-types cratestack-link-batch cratestack-link-logger \
            cratestack-runtime-fetch cratestack-runtime-axios \
            cratestack-validator-zod cratestack-validator-yup \
            cratestack-adapter-tanstack-query cratestack-adapter-rtk \
            cratestack-api; do
            echo "::group::npm publish $pkg"
            # Not called directly under `set -e` — that would exit the
            # script the instant a publish fails, skipping the
            # `::endgroup::` below and leaving that log group open (and
            # misleadingly labeled) in the Actions UI for the rest of
            # the (now-aborted) run.
            #
            # An already-published package is a success as far as the
            # wrapper is concerned, so a re-run of a partially-completed
            # release no longer dies on the first package that already
            # landed and skips every package after it. A genuine failure
            # (bad auth, missing Trusted Publisher entry) still aborts
            # the loop here, as it should.
            if ! .github/scripts/npm-publish.sh "packages/$pkg" --access public --provenance; then
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done

  # ---- @cratestack/cbor family (issue #285) ------------------------------
  # Unlike the API family above, @cratestack/cbor-node is a real napi-rs
  # native addon (crates/cratestack-cbor-napi) — it needs a per-platform
  # release binary for each of `napi.targets` in its package.json: the same
  # 5 platforms `build` builds `cratestack-cli` for above, PLUS the two musl
  # (Alpine) targets `cratestack-cli` has no equivalent of — see the matrix
  # comment below and cratestack#850, which is the Alpine load failure the
  # missing `-musl` platform packages caused in production. CI's
  # own `js-cbor-napi` job (ci.yml) deliberately only proves a single-host
  # sanity build; this is the real release matrix that job's own comment
  # said was deferred (issue #286's explicit scope note).
  build-cbor-node:
    name: build @cratestack/cbor-node (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # musl (Alpine) — cratestack#850. Unlike every other leg here
          # these CROSS-compile: napi-rs's current guidance for musl is
          # zig + `--cross-compile`/`-x` on an ordinary glibc runner (the
          # `ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine` image it used
          # to document is deprecated), and the CLI appends
          # `-C target-feature=-crt-static` to RUSTFLAGS for musl itself.
          # Each musl leg still runs on the runner arch it targets, mirroring
          # the -gnu legs above — the zig cross is glibc->musl, not a change
          # of CPU — which is what lets the smoke-load step below actually
          # RUN the artifact it just built under `node:22-alpine`, on both
          # architectures, with no qemu in the picture.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: "-x"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: "-x"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # REQUIRED on the musl legs, and the reason the first version of them
      # failed a real rehearsal run with E0463 "can't find crate for `core`
      # … the x86_64-unknown-linux-musl target may not be installed".
      # `with: targets:` above installs the target for `stable`, but
      # rust-toolchain.toml pins 1.98.0 and cargo selects THAT inside the
      # checkout — so the std the action installed is never the one in use.
      # Identical to what `build-cbor-macos` and `build-cbor-ios` already do
      # further down this file; see their steps' comments.
      - name: Add the cross target to the pinned toolchain (not stable)
        if: contains(matrix.target, 'musl')
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cbor-node-${{ matrix.target }}
      # musl legs only (cratestack#850). `napi build -x` shells out to
      # `cargo zigbuild`, which needs BOTH cargo-zigbuild and a real `zig`
      # on PATH. @napi-rs/cli will `cargo install` cargo-zigbuild itself if
      # it's missing; taiki-e/install-action fetches the prebuilt release
      # binary instead, which is the same tool minutes faster. Version-
      # pinned rather than floating: 0.23.4 is what the musl build was
      # verified against with zig 0.14.1, and an unpinned `@latest` is
      # exactly the shape of dependency that turns a release red on someone
      # else's release day (the first rehearsal picked up 0.23.3 this way).
      #
      # zig itself is a pinned curl download rather than a setup-zig
      # action: taiki-e/install-action has no zig manifest (checked), and
      # this is exactly the precedent `publish-npm-cbor-web` already sets
      # for binaryen a few jobs below — pin the version, verify the
      # checksum, add one directory to PATH, add no new third-party action
      # to the release pipeline's trust surface. Both checksums are the
      # ones published in https://ziglang.org/download/index.json for
      # 0.14.1; the tarball is selected by RUNNER arch, which is not the
      # same thing as the target arch (the arm64 leg cross-compiles
      # glibc->musl on an arm64 runner, so it needs the arm64 zig).
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Install zig (pinned) for the musl cross-build
        if: contains(matrix.target, 'musl')
        # Unpacked into RUNNER_TEMP rather than the checkout purely to keep
        # a ~400 MB toolchain tree out of the repo working copy.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              ZIG_ARCH=x86_64
              ZIG_SHA=24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
              ;;
            aarch64|arm64)
              ZIG_ARCH=aarch64
              ZIG_SHA=f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b
              ;;
            *)
              echo "::error::no pinned zig 0.14.1 tarball for runner arch $(uname -m)"
              exit 1
              ;;
          esac
          ZIG_DIR="zig-${ZIG_ARCH}-linux-0.14.1"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-connrefused -o zig.tar.xz \
            "https://ziglang.org/download/0.14.1/${ZIG_DIR}.tar.xz"
          echo "${ZIG_SHA}  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz
          rm zig.tar.xz
          echo "$RUNNER_TEMP/$ZIG_DIR" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$ZIG_DIR/zig" version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      # Same underlying command as the package's own `build:napi` script,
      # plus `--target` to cross-build for this matrix leg instead of the
      # runner's host target. `native.mjs`/`native.d.mts` (the platform-
      # dispatch JS/TS loader `napi build --platform` generates) come out
      # identical on every leg — uploaded from each anyway so the publish
      # job below doesn't need to special-case which leg "owns" them.
      #
      # `${{ matrix.cross }}` is `-x` on the two musl legs and EMPTY
      # everywhere else (the key is simply absent from those matrix
      # entries) — `-x` swaps `cargo build` for `cargo zigbuild`, which is
      # only correct where a zig toolchain was installed above.
      - name: Build native addon (napi build)
        working-directory: packages/cratestack-cbor-node
        # Explicit bash — the default shell on the windows-msvc leg is
        # PowerShell, which doesn't understand `\` line continuations and
        # fails to parse this command ("Missing expression after unary
        # operator '--'"). Same reason `Package archive` above pins it.
        shell: bash
        run: |
          pnpm exec napi build \
            --manifest-path ../../crates/cratestack-cbor-napi/Cargo.toml \
            --platform --release --esm \
            --js native.mjs --dts native.d.mts \
            --output-dir . \
            --target ${{ matrix.target }} ${{ matrix.cross }}
      # The musl legs' actual acceptance test, and the only step in this
      # workflow that RUNS an artifact it built rather than just packaging
      # it. cratestack#850 was a load failure, not a build failure: the
      # glibc build compiled perfectly and CI was green the whole time it
      # was unusable on Alpine. Each leg runs on its own architecture, so
      # `node:22-alpine` here is the real arm64 image on the arm64 leg —
      # no qemu, no emulation caveat.
      #
      # `scripts/smoke-load.mjs` asserts a fixed hex vector through the
      # package's own generated `native.mjs`, so it fails on a binding that
      # loads but encodes differently, not only on one that won't load.
      - name: Smoke-load the musl binding under node:22-alpine
        if: contains(matrix.target, 'musl')
        working-directory: packages/cratestack-cbor-node
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/pkg:ro" node:22-alpine \
            node /pkg/scripts/smoke-load.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: cbor-node-binary-${{ matrix.target }}
          path: |
            packages/cratestack-cbor-node/*.node
            packages/cratestack-cbor-node/native.mjs
            packages/cratestack-cbor-node/native.d.mts
          if-no-files-found: error

  # Downloads every platform's `.node` binary built above into per-leg
  # subdirectories (deliberately NOT `merge-multiple` — `napi artifacts`
  # below expects to find each leg's file nested under its own artifact
  # name, the same layout `actions/download-artifact@v4` produces without
  # that flag), then runs the real `@napi-rs/cli` scaffolding sequence:
  # `napi create-npm-dirs` creates `npm/<platform>/package.json` for every
  # target in `napi.targets`, `napi artifacts` copies each downloaded
  # `.node` file into its matching `npm/<platform>/` dir (confirmed by
  # hand: it validates ALL configured targets are present before copying
  # any of them — an earlier version of this comment assumed `napi
  # prepublish` alone would handle this via its `prepublishOnly` hook; it
  # doesn't — `napi prepublish` hard-fails with "Release package directory
  # does not exist" if `npm/<platform>/` isn't pre-scaffolded, confirmed by
  # actually running it locally). Only then does `npm publish`'s
  # `prepublishOnly` hook (`napi prepublish -t npm`, see the package's
  # package.json) publish each now-populated platform subpackage (e.g.
  # `@cratestack/cbor-node-darwin-arm64`) BEFORE npm packs and publishes
  # this main package with `optionalDependencies` pointing at them. Same
  # tag-push-only gate and OIDC Trusted Publishing hard-cutover as the
  # other publish-npm* jobs, except EACH of the 7 auto-generated platform
  # subpackages ALSO needs its own separate Trusted Publisher entry on
  # npmjs.com, on top of `@cratestack/cbor-node` itself — see
  # docs/tooling/npm-publishing.md, including the bootstrap note there:
  # a brand-new package name can't have Trusted Publishing configured
  # until it's been published manually at least once, so this job will
  # keep failing for any platform subpackage that hasn't gone through that
  # one-time manual bootstrap yet, even once all 7 binaries build cleanly.
  #
  # The two names cratestack#850 added —
  # `@cratestack/cbor-node-linux-x64-musl` and
  # `@cratestack/cbor-node-linux-arm64-musl` — were bootstrapped by hand on
  # 2026-09-02 and are live at 0.10.1, so nothing here is outstanding. The
  # note stays because the constraint is permanent: the NEXT target added to
  # `napi.targets` will need the same manual first publish
  # (docs/tooling/npm-publishing.md).
  #
  # What it no longer does is take the release down with it. #850 also
  # changed the publish shape here (see the steps' own comments): the
  # platform packages are published by an explicit loop that attempts every
  # name and fails at the end, and the main package publishes regardless —
  # so an un-bootstrapped platform name costs a red job, not a burned
  # version number. Consumers on that platform still work in the meantime,
  # because the main package's tarball bundles every `.node` binary and the
  # generated loader prefers the bundled file over the subpackage.
  #
  # Separately and still true: `napi artifacts` and `napi prepublish` each
  # validate that EVERY target in `napi.targets` is present before touching
  # any of them (verified by hand — deleting one musl artifact fails the
  # whole step). That is a BUILD-completeness gate, not a publish gate: it
  # is what makes a missing matrix leg fail here loudly rather than ship a
  # package with a platform silently absent.
  publish-npm-cbor-node:
    name: publish npm package (@cratestack/cbor-node)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, build-cbor-node, preflight, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: cbor-node-binary-*
          path: cbor-node-artifacts
      - name: List downloaded platform binaries
        run: find cbor-node-artifacts -name '*.node'
      # `napi artifacts` (below) only handles the `.node` binaries — it
      # does NOT copy `native.mjs`/`native.d.mts` (the JS/TS loader `napi
      # build --platform` generates), confirmed the hard way: a first
      # version of this job without this step failed tsc with "Cannot
      # find module '../native.mjs'". Every leg's copy is identical (see
      # build-cbor-node's own comment), so grabbing the first match found
      # is enough.
      - name: Copy the native.mjs/native.d.mts loader (identical on every leg)
        run: |
          find cbor-node-artifacts -name 'native.mjs' -exec cp {} packages/cratestack-cbor-node/ \; -quit
          find cbor-node-artifacts -name 'native.d.mts' -exec cp {} packages/cratestack-cbor-node/ \; -quit
      - name: Scaffold per-platform npm packages
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec napi create-npm-dirs
      - name: Move each platform's binary into its npm/<platform>/ dir
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec napi artifacts --output-dir ../../cbor-node-artifacts
      # cbor-node's own `tsc` doesn't build its workspace dependency
      # (`@cratestack/ts-types`) — that only happens automatically via
      # turbo's `^build` dependency graph, which this job deliberately
      # doesn't invoke for cbor-node itself (its full `build` script also
      # runs `build:napi`, needing a Rust toolchain this job doesn't set
      # up). Confirmed the hard way: without this, tsc fails with "Cannot
      # find module '@cratestack/ts-types'" (no `dist/` to resolve types
      # against).
      - name: Build @cratestack/ts-types (cbor-node's only workspace dependency)
        run: pnpm --filter ./packages/cratestack-ts-types run build
      - name: Compile TypeScript wrapper (native artifacts already built above)
        working-directory: packages/cratestack-cbor-node
        run: pnpm exec tsc -p tsconfig.json
      # Trusted Publishing needs npm CLI >= 11.5.1 — pinned to the latest
      # 11.x rather than an unbounded `npm@latest`, since a fresh npm major
      # is a real, demonstrated risk here, not a hypothetical one: npm
      # 12.0.2 silently changed `npm pack --dry-run --json`'s output shape
      # from an array to an object, breaking @napi-rs/cli@3.8.2's hardcoded
      # array assumption inside `napi prepublish` — confirmed by hand
      # (`npx -y npm@latest pack --dry-run --json` on a throwaway package)
      # after publish-npm-cbor-node failed with a generic "Failed to
      # validate the release package ... Ensure npm is available and the
      # package can be packed" error that gave no hint of the real cause.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      # `--provenance` on the outer `npm publish` only covers THIS command,
      # and `napi prepublish` no longer publishes npm SUBPACKAGES itself
      # (see the `--skip-optional-publish` note below), so provenance is
      # requested via npm config instead — covering the platform loop too.
      #
      # Scoped deliberately to npm: `napi prepublish` still attempts its
      # GitHub-release side effects regardless of that flag. Rehearsal
      # 33677846346 shows it issuing `POST /repos/…/releases` (401, no token
      # wired) followed by seven asset uploads. That is pre-existing
      # behaviour, unrelated to the musl targets, and out of scope for
      # cratestack#850 — noted here so the next reader does not mistake
      # "publishes no subpackages" for "does nothing".
      # `npm config set` writes to the *user* config (~/.npmrc) by
      # default, so it applies regardless of which directory it runs
      # from — the wrapper below cd's into each package itself.
      #
      # PLATFORM SUBPACKAGES ARE PUBLISHED HERE, EXPLICITLY, NOT BY THE
      # `prepublishOnly` HOOK (cratestack#850). That hook — `napi prepublish
      # -t npm`, now carrying `--skip-optional-publish` — used to publish
      # each `npm/<platform>` package itself, SEQUENTIALLY, from inside the
      # root `npm publish`. Two things follow from that shape, both bad:
      #
      #   1. The first subpackage that fails aborts the hook, so the root
      #      package never publishes at all — and every later subpackage is
      #      skipped. With a brand-new platform name in the list (which
      #      404s until it is hand-bootstrapped; Trusted Publishing cannot
      #      create a name, npm/cli#8544) that means: some platform
      #      packages live, the main package missing, and the tag's version
      #      number burned. Adding the two musl targets made that
      #      reachable, which is why this shape changed alongside them.
      #   2. In rehearsal mode the root `npm publish --dry-run` does NOT
      #      propagate `--dry-run` into the hook, so `napi prepublish`
      #      attempted REAL subpackage publishes during a run whose whole
      #      contract is "writes to no registry". Pre-existing hole; newly
      #      reachable for the same reason.
      #
      # The loop below closes both. It goes through the same
      # `npm-publish.sh` wrapper as every other package here — so it
      # honours NPM_PUBLISH_REHEARSAL per name, and already-published counts
      # as success — attempts EVERY name rather than stopping at the first
      # failure, and only then exits non-zero. Loud, but no longer
      # load-bearing for the names beside it.
      #
      # Note what this does NOT put at risk: the root tarball bundles every
      # `.node` file (`files: ["*.node"]`, and `napi artifacts` copies each
      # binary to the package root as well as into `npm/<platform>/`), and
      # the generated `native.mjs` tries
      # `./cratestack-cbor-node.<platform>.node` BEFORE the
      # `@cratestack/cbor-node-<platform>` subpackage. So an Alpine consumer
      # resolves a working binding from the main package even while the musl
      # subpackage names are still un-bootstrapped.
      - name: Publish the per-platform subpackages (all attempted, then fail loudly)
        env:
          NPM_PUBLISH_REHEARSAL: ${{ needs.prepare.outputs.rehearsal == 'true' && '1' || '0' }}
        run: |
          set -uo pipefail
          npm config set provenance true
          failed=()
          for dir in packages/cratestack-cbor-node/npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            echo "::group::npm publish $name"
            if ! .github/scripts/npm-publish.sh "$dir" --access public; then
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::platform subpackage publish failed for: ${failed[*]} — the main package is published by the next step regardless (it bundles every .node binary, so consumers still resolve a working binding). A brand-new platform name needs the one-time manual bootstrap in docs/tooling/npm-publishing.md."
            echo "SUBPACKAGE_PUBLISH_FAILED=${failed[*]}" >> "$GITHUB_ENV"
          fi
      # Runs even when the loop above reported failures — but WITHOUT
      # `if: always()`, deliberately. The loop step never fails on its own:
      # it runs under `set -uo pipefail` (no `-e`), collects failed names
      # into an array, and ends on an `if` block that exits 0, recording the
      # failures into `$GITHUB_ENV` for the final step to act on. Measured:
      # the loop exits 0 with two names failing.
      #
      # So `always()` would buy nothing for the case it looks like it covers,
      # while silently covering a case it must NOT: any EARLIER step failing
      # — `pnpm exec tsc`, the `@cratestack/ts-types` build — would still
      # reach this publish, shipping a tarball whose `main: ./dist/index.js`
      # is not in it, at a version number that can never be reused. Plain
      # step ordering gives the intended behaviour and nothing else.
      - name: Publish @cratestack/cbor-node
        env:
          # cratestack#652: the shared wrapper switches to
          # `npm publish --dry-run` when this is 1. Wiring it here rather
          # than adding a second rehearsal-only step keeps ONE code path
          # per package — a duplicated step is what drifts.
          NPM_PUBLISH_REHEARSAL: ${{ needs.prepare.outputs.rehearsal == 'true' && '1' || '0' }}
        run: |
          npm config set provenance true
          .github/scripts/npm-publish.sh packages/cratestack-cbor-node --access public
      - name: Fail the job if any platform subpackage did not publish
        if: always()
        run: |
          if [ -n "${SUBPACKAGE_PUBLISH_FAILED:-}" ]; then
            echo "::error::these platform subpackages did not publish: $SUBPACKAGE_PUBLISH_FAILED"
            exit 1
          fi
          echo "all platform subpackages published (or were already published)"

  # Same rationale as js-cbor-wasm in ci.yml: needs a real Rust wasm32
  # toolchain (the package's `prebuild` hook runs `wasm-pack build` against
  # crates/cratestack-cbor-wasm), so it gets its own toolchain setup rather
  # than reusing publish-npm-api-family's plain-Node job. No ordering
  # dependency on `build`/`build-cbor-node` — this package ships its own
  # compiled wasm bundle in the tarball, same as the API family.
  publish-npm-cbor-web:
    name: publish npm package (@cratestack/cbor-web)
    if: github.event_name == 'push' || needs.prepare.outputs.rehearsal == 'true'
    needs: [prepare, preflight, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # wasm32-unknown-unknown is installed by rustup from
      # rust-toolchain.toml's `targets` for the pinned channel (same
      # mechanism ci.yml's js-cbor-wasm job relies on).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cbor-web
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-pack only downloads its own `wasm-opt` when one isn't
      # already on PATH (src/wasm_opt.rs short-circuits on
      # `which::which("wasm-opt")` with no version check), and the
      # version it reaches for is hardcoded — 0.15.0, the current
      # release, still pins binaryen version_117. That download is an
      # unpinned network fetch in the middle of a release build, and it
      # is what failed run 31094655414: `failed to download from
      # .../binaryen-version_117-x86_64-linux.tar.gz`. The asset itself
      # is fine (it still resolves), so that was a transient
      # GitHub-releases hiccup — installing wasm-opt ourselves takes the
      # fetch off the critical path so the same blip can't fail a
      # release again.
      #
      # Pinned to version_130 rather than tracking latest (version_131
      # at time of writing): 130 is the release upstream wasm-pack
      # itself vetted in rustwasm/wasm-pack#1599, merged 2026-08-05 but
      # not yet in a published wasm-pack release. x86_64-linux is
      # correct here — this job is `runs-on: ubuntu-latest`, no matrix.
      # taiki-e/install-action has no binaryen manifest, hence the
      # explicit curl.
      #
      # The sha256 is the digest GitHub reports for that release asset
      # (`gh api repos/WebAssembly/binaryen/releases/tags/version_130`,
      # `.assets[].digest`), cross-checked against a local `sha256sum` of
      # the downloaded file. Added by cratestack#850, whose own pinned-zig
      # step in `build-cbor-node` cites this step as the precedent for
      # "pin the version, verify the checksum" — a version pin alone does
      # not make a mutable release asset tamper-evident, so the precedent
      # had to actually exist before it could be cited.
      - name: Install binaryen (wasm-opt), pinned
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-connrefused -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  binaryen.tar.gz" \
            | sha256sum -c -
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
          rm binaryen.tar.gz
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: pnpm install
        env:
          CRATESTACK_CLI_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile
      - name: Build @cratestack/cbor-web (wasm-pack + tsc)
        run: pnpm turbo run build --filter='./packages/cratestack-cbor-web'
      # Pinned to the latest 11.x, not an unbounded `npm@latest` — see the
      # `publish-npm-cbor-node` job's own comment on this same step for why
      # (a real npm 12.x regression broke @napi-rs/cli's release-package
      # validation there; this job doesn't use napi, but there's no reason
      # to opt into the same moving-target risk everywhere else too).
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11
      - name: Publish @cratestack/cbor-web
        env:
          # cratestack#652: the shared wrapper switches to
          # `npm publish --dry-run` when this is 1. Wiring it here rather
          # than adding a second rehearsal-only step keeps ONE code path
          # per package — a duplicated step is what drifts.
          NPM_PUBLISH_REHEARSAL: ${{ needs.prepare.outputs.rehearsal == 'true' && '1' || '0' }}
        run: .github/scripts/npm-publish.sh packages/cratestack-cbor-web --access public --provenance

