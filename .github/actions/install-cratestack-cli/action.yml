name: Install cratestack-cli
description: >
  Downloads a prebuilt cratestack-cli binary from this repo's GitHub Releases,
  verifies its SHA-256 checksum against the published .sha256 sidecar, and
  adds it to PATH — no Rust toolchain required. Mirrors the same asset
  naming and target-triple convention as
  packages/cratestack-cli-npm/scripts/install.js and
  crates/cratestack-cli/Cargo.toml's [package.metadata.binstall]; keep all
  three in sync if the release asset layout ever changes.

inputs:
  version:
    description: >
      Version to install, e.g. "0.6.7" (no leading "v"). Defaults to
      "latest", which resolves the newest GitHub Release via the API.
    required: false
    default: latest
  github-token:
    description: >
      Token used only to resolve "latest" via the GitHub API (avoids
      unauthenticated rate limiting on public runners). Defaults to the
      workflow's own token, which is sufficient for a public-repo read.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The resolved version that was installed (no leading "v").
    value: ${{ steps.install.outputs.version }}
  cratestack-cli-path:
    description: Absolute path to the installed cratestack binary.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name: Resolve target triple, download, verify, and install
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        repo="https://github.com/cratestack/cratestack"

        # --- 0. Retry helper (cratestack#578) --------------------------------
        # Every `curl` fetch in this script goes through here so that a
        # transient network blip (curl exit 52 "empty reply", 56 "recv
        # failure" — the two actually observed failing unrelated PRs on
        # 2026-08-12/13) gets retried, while a permanent failure (404 on a
        # missing asset) fails immediately rather than burning the budget.
        #
        # Three distinct behaviours, measured rather than assumed (see the
        # exit/attempt counts below — each was reproduced against a local
        # fixture server that counts hits):
        #
        #   connection-level (52/56)  retried 6x, then exit 52/56   [7 attempts]
        #   HTTP 5xx                  retried 6x, then exit 1       [7 attempts]
        #   HTTP 404                  NOT retried, exit 1           [1 attempt]
        #
        # The 5xx row is deliberate, not an oversight: curl's *default*
        # transient set already includes 500/502/503/504 and it retries
        # them with or without `-f`, so a 5xx from the release CDN — which
        # genuinely is usually transient — gets the same treatment as a
        # dropped connection, and still fails loud once the budget is
        # spent. Only a 4xx is treated as permanent.
        #
        # The two curl behaviours this relies on are NOT handled the same way:
        #
        #   - `--retry-all-errors` is required to cover 52/56 at all.
        #     Verified locally (curl 8.18.0) that plain `--retry` — with no
        #     `--retry-all-errors` — does NOT retry a connection-reset/
        #     empty-reply failure: curl's own manual scopes the *default*
        #     retry set to timeouts, FTP 4xx, and HTTP
        #     408/429/500/502/503/504/522/524 only. 52/56 aren't timeouts,
        #     they're "the peer went away", which is exactly the class
        #     `--retry-all-errors` exists for.
        #
        #   - `-f`/`--fail` is deliberately NOT combined with
        #     `--retry-all-errors` here. curl's own manual for
        #     --retry-all-errors says combining it with --fail makes curl
        #     retry on *all* HTTP error status codes, not just the narrow
        #     transient set — confirmed locally: `curl -f --retry-all-errors`
        #     against a plain 404 retried it 5 times before giving up,
        #     burning the whole retry budget on a request that will never
        #     succeed (this is AC2's trap — a missing release asset must
        #     fail on the first try, not the sixth). So this helper drops
        #     `-f` and checks the HTTP status itself, once, after curl
        #     returns: --retry-all-errors still retries the connection-level
        #     failures (confirmed it does, with or without -f), but a 404 —
        #     which isn't a curl-level error without -f, and isn't in curl's
        #     transient set either — reaches the check below on the very
        #     first attempt and fails loud. A 5xx still gets retried first
        #     (see the table above), then reaches the same check.
        #
        # Checksum verification (step 4) is untouched by any of this: it
        # only ever runs after a file has already passed the HTTP-status
        # check below, so a retry can never substitute a partial file for
        # a verified one.
        fetch_with_retry() {
          local url="$1" out="$2" label="$3"
          shift 3
          local http_code curl_status
          # `x=$(cmd) && st=0 || st=$?`, not a bare `x=$(cmd); st=$?`: under
          # `set -e`, a failing command-substitution assignment aborts the
          # script on the spot, before the next line (the `$?` capture)
          # ever runs — confirmed locally. Wrapping it in this and/or list
          # is the idiom that lets `set -e` see the list as "handled" while
          # still landing the real exit code in $curl_status.
          http_code=$(curl -sS -L \
            --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -o "$out" -w '%{http_code}' "$@" "$url") && curl_status=0 || curl_status=$?
          if [ "$curl_status" -ne 0 ]; then
            echo "::error::download of ${label} failed after retries (curl exit ${curl_status})" >&2
            exit "$curl_status"
          fi
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::download of ${label} returned HTTP ${http_code} (not retried — this indicates a real failure such as a missing release asset, not a transient network error)" >&2
            exit 1
          fi
        }

        # --- 1. Resolve version --------------------------------------------
        version="$INPUT_VERSION"
        if [ "$version" = "latest" ] || [ -z "$version" ]; then
          # Capture the full response into a file FIRST, then parse it with
          # jq — piping curl straight into `grep -m1` raced curl's own write
          # against grep's early exit under `pipefail` (grep found its match
          # and closed the pipe before curl finished writing the rest of the
          # network-paced response, so curl got SIGPIPE'd — `curl: (23)
          # Failure writing output to destination`). Worked locally every
          # time (small/fast loopback-ish response) but failed reliably on
          # real CI runners. Buffering the whole response first removes the
          # live-pipe race entirely.
          response_file=$(mktemp)
          fetch_with_retry \
            "https://api.github.com/repos/cratestack/cratestack/releases/latest" \
            "$response_file" "GitHub releases API" \
            -H "Authorization: Bearer ${GH_TOKEN}"
          response=$(cat "$response_file")
          tag=$(echo "$response" | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::could not resolve the latest cratestack release via the GitHub API" >&2
            exit 1
          fi
          version="$tag"
        fi
        version="${version#v}"

        # --- 2. Resolve target triple ---------------------------------------
        # Same mapping as packages/cratestack-cli-npm/scripts/install.js —
        # keep both in sync.
        os="${RUNNER_OS}"
        arch="${RUNNER_ARCH}"
        case "${os}:${arch}" in
          macOS:X64) target=x86_64-apple-darwin ;;
          macOS:ARM64) target=aarch64-apple-darwin ;;
          Linux:X64) target=x86_64-unknown-linux-gnu ;;
          Linux:ARM64) target=aarch64-unknown-linux-gnu ;;
          Windows:X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "::error::no prebuilt cratestack-cli binary for ${os}/${arch}. Supported: macOS/X64, macOS/ARM64, Linux/X64, Linux/ARM64, Windows/X64." >&2
            exit 1
            ;;
        esac

        # --- 3. Resolve asset name/URL --------------------------------------
        ext=tar.gz
        [ "$os" = "Windows" ] && ext=zip
        asset="cratestack-cli-${target}-v${version}.${ext}"
        asset_url="${repo}/releases/download/v${version}/${asset}"

        workdir=$(mktemp -d)
        echo "Downloading ${asset} ..."
        fetch_with_retry "${asset_url}" "${workdir}/${asset}" "${asset}"
        fetch_with_retry "${asset_url}.sha256" "${workdir}/${asset}.sha256" "${asset}.sha256"

        # --- 4. Verify checksum ----------------------------------------------
        cd "$workdir"
        expected=$(cut -d' ' -f1 "${asset}.sha256")
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "${asset}" | cut -d' ' -f1)
        else
          actual=$(shasum -a 256 "${asset}" | cut -d' ' -f1)
        fi
        if [ "$expected" != "$actual" ]; then
          echo "::error::checksum mismatch for ${asset}: expected ${expected}, got ${actual}" >&2
          exit 1
        fi
        echo "Checksum verified: ${actual}"

        # --- 5. Extract + install ---------------------------------------------
        # NOT a single `tar -xf` for every OS: confirmed by hand on a real
        # Windows runner that `shell: bash` there is Git Bash, whose `tar`
        # on PATH is MSYS2's GNU tar — genuinely unable to read a .zip
        # ("This does not look like a tar archive"), unlike the bsdtar this
        # command was verified against locally on macOS. Windows needs
        # PowerShell's Expand-Archive instead (same tool
        # packages/cratestack-cli-npm/scripts/install.js already uses for
        # this exact reason) — and its path arguments need to be real
        # Windows paths, not Git Bash's POSIX-style ones, hence `cygpath -w`.
        if [ "$os" = "Windows" ]; then
          win_archive=$(cygpath -w "${workdir}/${asset}")
          win_dest=$(cygpath -w "$workdir")
          powershell -NoProfile -Command "Expand-Archive -Path '${win_archive}' -DestinationPath '${win_dest}' -Force"
        else
          tar -xzf "${asset}" -C "$workdir"
        fi

        bin_name=cratestack
        [ "$os" = "Windows" ] && bin_name=cratestack.exe
        if [ ! -f "${workdir}/${bin_name}" ]; then
          echo "::error::expected ${bin_name} inside ${asset}, but it was not found" >&2
          exit 1
        fi

        install_dir="${RUNNER_TEMP}/cratestack-cli-bin"
        mkdir -p "$install_dir"
        mv "${workdir}/${bin_name}" "${install_dir}/${bin_name}"
        [ "$os" != "Windows" ] && chmod +x "${install_dir}/${bin_name}"

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "path=${install_dir}/${bin_name}" >> "$GITHUB_OUTPUT"

        echo "Installed cratestack-cli ${version} (${target}) to ${install_dir}/${bin_name}"
