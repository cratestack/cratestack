[package]
name = "cratestack-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[features]
default = ["decimal-rust-decimal"]
# Forwards to `cratestack-core`'s (independently-selectable, as of
# cratestack#505 Direction 2 — see `cratestack-core/src/decimal.rs`'s
# module doc) decimal backend feature(s). Required because
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root — every direct consumer must explicitly re-select a
# backend, or `cratestack-core` fails to compile at all (cratestack#495).
# Note this crate is a proc-macro — this feature controls what THIS crate
# (the macro implementation) compiles against, not what the schema it
# expands generates: which concrete `Decimal` type generated code names is
# decided per macro invocation by the `decimal = RustDecimal | BigDecimal`
# argument on the three entry macros (`src/include/decimal_arg.rs`), never
# by this crate's own compiled-in feature set — a proc-macro can only ever
# observe *its own* features via `cfg!`, not the invoking crate's
# (cratestack#505 §5), so routing the choice through a Cargo feature here
# would silently reintroduce the exact bug this crate exists to fix. Also
# forwards to `cratestack-policy` and `cratestack-parser` — this crate's
# other direct `cratestack-core`-consuming dependencies (each with the same
# `default-features = false` treatment — see root `Cargo.toml`). Neither
# actually needs a concrete `Decimal`/`RustDecimal`/`BigDecimal` type to
# compile against post-cratestack#505 (both only ever match the schema type
# name `"Decimal"` as a string); this toggle is kept for `cratestack-core`
# itself to build cleanly end-to-end and for parity with every other
# `cratestack-core`-consuming crate in the workspace, not because any
# code here names the concrete type.
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-policy/decimal-rust-decimal",
    "cratestack-parser/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-policy/decimal-bigdecimal",
    "cratestack-parser/decimal-bigdecimal",
]
# Marks whether the facade crate being compiled into has `cratestack-sqlx`
# available at all — see
# `crates/cratestack-macros/src/include/datasource_guard.rs`'s
# `guard_server_postgres_backend` (cratestack#347). Same `cfg!(feature =
# "postgres")`-against-this-crate's-own-feature-set mechanism as
# `rate_limit`/`pgvector` below. Forwarded from `cratestack-pg`'s own
# (default-on) `postgres` feature; `cratestack-api` never forwards it, so
# `db = Postgres` under that facade fails this guard with a clear
# `compile_error!` instead of a wall of unrelated "cannot find
# `sqlx`/`SqlxRuntime` in `cratestack`" errors.
postgres = []
# Gates codegen for the `rate_limit` extension, declared in `.cstack` via
# `extension rate_limit { }` (cratestack#153/#161). Same `cfg!(feature =
# "rate_limit")`-against-this-crate's-own-feature-set mechanism as
# `postgres` above — see `crates/cratestack-macros/src/include/extension_gate.rs`
# and `docs/design/extensions.md` §2. Forwarded from the `cratestack-pg`/
# `cratestack-sqlite` facades' own `rate_limit` feature (cratestack#154):
# enables the `@no_rate_limit` procedure attribute and threads
# `rate_limited_by_default` onto the generated `OpDescriptor` — participation
# only, never a numeric limit. Deliberately does *not* gate
# `cratestack-axum`'s existing `RateLimitLayer`/`RateLimitConfig`/store code,
# which stays unconditionally compiled (cratestack#154 scoped that move out;
# see its ticket and PR for the reasoning). Off by default.
rate_limit = []
# Gates codegen for the `pgvector` extension, declared in `.cstack` via
# `extension pgvector { }` (cratestack#153/#161). Same mechanism as
# `rate_limit` above — see `extension_gate.rs`. Intended to be forwarded
# from `cratestack-migrate`/`cratestack-sqlx`/`cratestack-pg`'s own
# `pgvector` feature once cratestack#155 wires that up. Note:
# `include_embedded_schema!` rejects `extension pgvector { }`
# unconditionally regardless of this feature — rusqlite has no vector
# extension, so no Cargo feature can make it valid there (see
# `extension_gate.rs`, `docs/design/extensions.md` §6). Off by default.
pgvector = []

[dependencies]
cratestack-core.workspace = true
cratestack-parser.workspace = true
cratestack-policy.workspace = true
proc-macro2.workspace = true
quote.workspace = true
sha2.workspace = true
syn.workspace = true

[dev-dependencies]
# UI/compile-fail testing for `extension_gate.rs`'s `compile_error!`
# diagnostics (cratestack#161) — trybuild spawns an isolated `rustc`
# invocation per fixture and asserts it fails to compile, which a plain
# `tests/*.rs` integration test can't do without hard-failing the whole
# `cargo test` run. Not used anywhere else in the workspace yet; scoped to
# this crate rather than added to `[workspace.dependencies]` since it's the
# first consumer.
trybuild = "1"
# cratestack#512: the `ProcedureRegistry` witness compile-fail fixture
# (`tests/ui_procedure_registry_witness.rs`) needs a *fully expanding*
# `include_server_schema!` — the generated `ProcedureRegistry` trait and
# its impl reference `::cratestack::*` runtime paths (`CratestackContext`,
# `CratestackError`, `Cratestack`, ...) that this crate's own `[dependencies]`
# deliberately never provide (`cratestack-macros` only emits code; it
# doesn't need the runtime types to do that — see every other fixture in
# `tests/ui.rs`/`tests/ui_semantic.rs`, none of which reach real codegen
# for exactly this reason). `cratestack-api` is the right facade here: no
# Postgres, no extra system packages, matches the `db = None` schema the
# fixture declares. This is a dev-dependency cycle back through
# `cratestack-macros` (`cratestack-api` depends on it normally) — Cargo
# explicitly supports that, since dev-dependencies are excluded from a
# crate's own library build and only apply to test/example/bench targets.
cratestack = { package = "cratestack-api", path = "../cratestack-api" }
# The generated `#[derive(serde::Serialize, serde::Deserialize)]` structs
# land directly in the fixture crate (not in `cratestack-api`), so — same
# as every real consumer crate (see `cratestack-api/Cargo.toml`'s own
# direct `serde` dependency, and every example that also depends on the
# facade) — `serde` needs to be a *direct* dependency here too, not just
# reachable transitively through `cratestack`.
serde.workspace = true
