[package]
name = "cratestack-webtransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `DevCertificate` is behind `dev-cert`, which docs.rs would otherwise skip.
[package.metadata.docs.rs]
features = ["dev-cert"]

[features]
# Forwards to `cratestack-core`'s decimal backend choice, and to both
# codecs, for the same reason every direct `cratestack-core` consumer does
# (cratestack#495). This crate never names a decimal type itself.
default = ["decimal-rust-decimal"]
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-codec-json/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-codec-json/decimal-bigdecimal",
]
# `DevCertificate`: a short-lived self-signed certificate and its SHA-256
# hash, for browsers' `serverCertificateHashes` during local development
# (design §6a.5). Never needed in production, so never on by default.
dev-cert = ["dep:rcgen", "dep:time", "dep:sha2"]

[dependencies]
cratestack-core.workspace = true
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
# The one dependency the `transport` module wraps; nothing else in this
# crate names it (design §6a.5, "behind our own seam").
web-transport-quinn.workspace = true
rcgen = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
# The integration tests drive the server with this crate's own client half.
web-transport-quinn.workspace = true
rcgen.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
url.workspace = true

# The server half of the real-browser end-to-end check (`tests/browser/`).
[[example]]
name = "browser_harness"
required-features = ["dev-cert"]
