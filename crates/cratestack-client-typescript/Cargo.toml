[package]
name = "cratestack-client-typescript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Forwards to `cratestack-core`'s mutually-exclusive decimal backend choice
# (see that crate's Cargo.toml for the full rationale). Required because
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root — every direct consumer must explicitly re-select a
# backend, or `cratestack-core` fails to compile at all (cratestack#495).
default = ["decimal-rust-decimal"]
# Also forwards to `cratestack-axum`/`cratestack-parser`, this crate's
# dev-dependency-only test fixtures — Cargo's feature resolver unifies
# dev-dependency feature requests with the rest of the graph for the same
# workspace member, so leaving those on a hardcoded backend would conflict
# with `--features decimal-bigdecimal` under `cargo test`/`cargo check
# --all-targets`.
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-axum/decimal-rust-decimal",
    "cratestack-parser/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-axum/decimal-bigdecimal",
    "cratestack-parser/decimal-bigdecimal",
]

[dependencies]
cratestack-core.workspace = true
minijinja.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Used by `tests/rpc_list_query_wire_format.rs` (issue #333) to compare
# the generated TypeScript's `toRpcListInput()` output against a real
# `serde_json::to_value(&RpcListInput { .. })` — the actual server-side
# wire contract, not a hand-copied guess at its shape.
#
# Plain edges: see the `decimal-rust-decimal`/`decimal-bigdecimal` feature
# forwards above.
cratestack-axum.workspace = true
cratestack-parser.workspace = true
serde_json.workspace = true
tempfile = "3"
