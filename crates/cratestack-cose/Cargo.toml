[package]
name = "cratestack-cose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack's COSE envelope (ADR 0006): unary COSE_Mac0 / COSE_Sign1 over the CBOR codec's bytes, bound to the request through external AAD, with nonce replay protection and RFC 9679 thumbprint key ids."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# No decimal features to forward, unlike `cratestack-exec`: this crate's
# source never names a decimal type, so it never selects a backend on
# `cratestack-core`, and a `--features decimal-bigdecimal` build of a
# consumer is unaffected by it (cratestack#495's bar holds trivially).
#
# The `auth` feature (the `ServiceSigningKey` / `DeviceKeyResolver`
# adapters, the Redis nonce bridge and the enrolment code, ADR 0006 "P0
# scoping decisions") is added by the second half of cratestack#1005. It is
# not declared here yet, so that nothing can turn on a feature that does
# nothing.

[dependencies]
# The only workspace dependency (ADR 0006 §11 as amended: L2, and
# `cratestack-core` only without `auth`), so clients and the wasm/napi
# builds stay free of `cratestack-auth`'s Redis, reqwest and rustls graph.
cratestack-core.workspace = true
# `CoseSigner` / `CoseVerifierResolver` are used as `dyn` (a KMS or an HSM
# signer, a device-key database), so they desugar the way core's
# `KeyProvider` / `NonceStore` do.
async-trait.workspace = true
bytes.workspace = true
# `NonceStore::record_if_unseen` takes a `chrono` expiry, and the default
# clock is `chrono::Utc::now`, which works on `wasm32-unknown-unknown`
# (where `std::time::SystemTime::now` panics).
chrono.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hmac.workspace = true
p256.workspace = true
sha2.workspace = true
subtle.workspace = true

[dev-dependencies]
# Independent implementation the wire bytes are checked against: the
# `Sig_structure` / `MAC_structure`, the tagged message, and the AAD array
# (through its `ciborium::Value`). Not a normal dependency: `coset` can
# neither encode the payload in place nor parse strictly, so the crate
# emits and parses the outer structure itself (see `src/wire.rs`).
coset.workspace = true
# Encodes the payment fixture the shared vectors are built on, the way a
# real service would.
cratestack-codec-cbor.workspace = true
# A randomized (non-RFC 6979) ES256 signature for the verify-only test.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
uuid.workspace = true
