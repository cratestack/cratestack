[package]
name = "cratestack-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack gRPC server runtime — tonic/prost integration for `transport grpc` schemas: error-code mapping, tonic metadata <-> header conversion, and unframed-body envelope canonicalization."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
# Forwards to `cratestack-core`'s mutually-exclusive decimal backend choice
# (see that crate's Cargo.toml for the full rationale). Required because
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root — every direct consumer must explicitly re-select a
# backend, or `cratestack-core` fails to compile at all (cratestack#495).
default = ["decimal-rust-decimal"]
decimal-rust-decimal = ["cratestack-core/decimal-rust-decimal"]
decimal-bigdecimal = ["cratestack-core/decimal-bigdecimal"]

[dependencies]
axum.workspace = true
base64.workspace = true
cratestack-core.workspace = true
http.workspace = true
prost.workspace = true
prost-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
