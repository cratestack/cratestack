[package]
name = "cratestack-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
cratestack-core.workspace = true
erased-serde.workspace = true
futures-util.workspace = true
http.workspace = true
minicbor = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Only `sync` (the `@@subscribe` SSE bridge's bounded `mpsc` channel,
# `crates/cratestack-axum/src/rpc/subscription_bridge.rs`, cratestack#390) —
# the runtime-driving features (`macros`, `net`, `rt-multi-thread`, `time`)
# stay dev-only below since production code here never starts its own
# runtime or listens on a socket; it's a library the host binary drives.
tokio = { workspace = true, features = ["sync"] }
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
minicbor-serde.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
