[package]
name = "cratestack-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Forwards to `cratestack-core`'s mutually-exclusive decimal backend choice
# (see that crate's Cargo.toml for the full rationale). Required because
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root — every direct consumer must explicitly re-select a
# backend, or `cratestack-core` fails to compile at all (cratestack#495).
# Also forwards to `cratestack-sql`, this crate's other direct
# `cratestack-core` consumer (same `default-features = false` treatment,
# see root `Cargo.toml`), so the two stay in lockstep.
default = ["decimal-rust-decimal"]
# Also forwards to `cratestack-codec-cbor`/`cratestack-codec-json` — Cargo's
# feature resolver unifies feature requests across the whole graph for the
# same workspace member, so leaving those on a hardcoded backend would
# conflict with `--features decimal-bigdecimal` under `cargo test`/`cargo
# check --all-targets`.
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-exec/decimal-rust-decimal",
    "cratestack-sql/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-codec-json/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-exec/decimal-bigdecimal",
    "cratestack-sql/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-codec-json/decimal-bigdecimal",
]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
cratestack-core.workspace = true
# Normal (not dev-only) dependencies since cratestack#846: the middleware
# layers in this crate (`ratelimit`, `idempotency`) run *outside* the
# generated router, so unlike every handler they have no `C: HttpTransport`
# type parameter to encode their error bodies with — they have to name a
# concrete codec pair themselves (`middleware_error::middleware_codec`).
# Blast radius is nil for the facades: `cratestack-pg` and `cratestack-api`,
# the only two that pull `cratestack-axum`, already depend on both codec
# crates unconditionally. Layering-legal both ways (L2 -> L4, ADR 0014).
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
# ADR 0015 slice 1: `IdempotencyLayer` is now a thin adapter over the L3
# `OpExecutor`. L4 -> L3 is a legal direction (ADR 0014), and this pulls
# nothing new into any facade's graph — `cratestack-exec` depends on
# `cratestack-core` and `uuid`, both of which this crate already has.
cratestack-exec.workspace = true
cratestack-sql.workspace = true
erased-serde.workspace = true
futures-util.workspace = true
http.workspace = true
ipnet.workspace = true
minicbor = { workspace = true, features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `sync` for the `@@subscribe` SSE bridge's bounded `mpsc` channel
# (`crates/cratestack-axum/src/rpc/subscription_bridge.rs`, cratestack#390),
# and `time` for `RateLimitLayer`'s store-lookup budget
# (`tokio::time::timeout`, cratestack#846 — without a ceiling a Redis
# outage made every rate-limited request wait out the driver's unbounded
# reconnect cycle). The runtime-driving features (`macros`, `net`,
# `rt-multi-thread`) stay dev-only below since production code here never
# starts its own runtime or listens on a socket; it's a library the host
# binary drives.
tokio = { workspace = true, features = ["sync", "time"] }
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
minicbor-serde.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true
