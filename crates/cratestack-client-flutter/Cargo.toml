[package]
name = "cratestack-client-flutter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# The Flutter bridge surface exposes `FlutterRuntimeCodec::Json` as a
# selectable transport, so the JSON codec has to be linked in or
# `RuntimeHandle::new` rejects the Json variant at runtime. Keep it
# on by default; a host shell that locks the bridge to CBOR can
# `default-features = false` to drop it.
default = ["codec-json", "decimal-rust-decimal"]
codec-json = ["cratestack-client-rust/codec-json"]
# `cratestack-client-rust`'s dependency edge has `default-features = false`
# at the workspace root, so — same as `codec-json` above — this crate must
# explicitly forward its own decimal-backend choice through, or the plain
# `cratestack-client-rust.workspace = true` edge below picks up neither of
# `cratestack-client-rust`'s own `decimal-rust-decimal`/`decimal-bigdecimal`
# features at all (cratestack#495).
# Also forwards to `cratestack-codec-cbor`/`cratestack-core`: the `cbor`
# module (cratestack#563) uses `CborCodec` directly, and a `Decimal`-typed
# dev-dependency test fixture exercises the same backend, so both real and
# dev-dependency edges need the choice threaded through, or
# `--features decimal-bigdecimal` under `cargo test`/`cargo check
# --all-targets` conflicts with a hardcoded backend here.
decimal-rust-decimal = [
    "cratestack-client-rust/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-core/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-client-rust/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-core/decimal-bigdecimal",
]

[dependencies]
cratestack-client-rust.workspace = true
# Real (not dev-only) as of cratestack#563: the `cbor` module wraps
# `CborCodec` directly for the flutter_rust_bridge-facing encode/decode
# entry points — see `src/cbor.rs`.
cratestack-codec-cbor.workspace = true
cratestack-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
async-stream = "0.3"
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
url.workspace = true
uuid.workspace = true
