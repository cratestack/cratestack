[package]
name = "cratestack-pg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack server facade — Postgres (sqlx) backend with Axum HTTP bindings, generated Rust client runtime, and the shared schema/parser/policy/SQL surface. Pick this crate via `cratestack = { package = \"cratestack-pg\" }` for backend services."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# The library is named `cratestack` so that integration tests under
# `tests/` resolve `::cratestack::*` paths (which the schema macros
# emit) without per-file aliasing. External consumers depend on the
# package as `cratestack = { package = "cratestack-pg" }` — Cargo's
# package-rename mechanism already exposes the lib under whatever name
# they pick on their side, so this `[lib] name` change is invisible
# downstream.
[lib]
name = "cratestack"
path = "src/lib.rs"

[features]
default = ["postgres", "decimal-rust-decimal", "codec-json"]
# Cargo-feature-gates `sqlx`/`cratestack-sqlx` (cratestack#329). Default-on so
# every existing `db = Postgres` consumer sees zero behavior change; a
# consumer that only ever uses `db = None` schemas (cratestack#327/#328) can
# opt out with `default-features = false` (re-adding whichever of
# `decimal-rust-decimal`/`codec-json` they still want) to keep `sqlx` and its
# transitive dependency tree out of their build entirely. `datasource
# { provider = "none" }` schemas can never declare a `model`, so nothing
# generated under `db = None` ever references the sqlx-backed symbols this
# feature gates — see `crates/cratestack-macros/src/include/server.rs` and
# `include/server/runtime/none.rs`. Also forwards `cratestack-macros`'s own
# `postgres` feature (cratestack#347), which
# `datasource_guard::guard_server_postgres_backend` checks before emitting
# any sqlx-flavored codegen — this crate has it on by default (via this very
# line), so nothing changes here; the guard exists to give a clear
# `compile_error!` under facades that don't, like `cratestack-api`.
#
# `cratestack-sqlx/decimal-rust-decimal` (cratestack#421): the `postgres`
# backend structurally requires sqlx's `rust_decimal` integration to
# compile at all — `cratestack-sqlx`'s query-builder support code
# (`query/support/values.rs`) binds `cratestack_core::Decimal` values
# unconditionally, not behind any feature gate, the same way it binds
# `Uuid`/`DateTime`/etc. So unlike `codec-json`/`grpc` below,
# `decimal-rust-decimal` on `cratestack-sqlx` was never a genuinely
# optional add-on for a Postgres consumer — it's forwarded here
# unconditionally so `--no-default-features --features postgres` alone
# (no separate `decimal-rust-decimal` request) still compiles, instead of
# failing with `rust_decimal::Decimal: Type<Postgres>` not satisfied.
postgres = [
    "dep:cratestack-sqlx",
    "cratestack-macros/postgres",
    "cratestack-sqlx/decimal-rust-decimal",
]
# `cratestack-sqlx?/...` (weak-dependency syntax, not plain `cratestack-sqlx/...`)
# is required here: a plain `pkg/feature` edge unconditionally activates the
# optional `cratestack-sqlx` dependency as a side effect, which would defeat
# `postgres`'s gating for a `default-features = false` consumer who still
# wants `decimal-rust-decimal` for a `Decimal`-typed procedure arg/return
# under `db = None`. The `?` makes the sub-feature apply only if
# `cratestack-sqlx` is already enabled some other way (i.e. via `postgres`).
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-sqlx?/decimal-rust-decimal",
]
# Forwards the JSON codec to the generated client runtime. On by default
# so `include_client_schema!` keeps offering both CBOR and JSON; disable
# (`default-features = false`) on backend services that speak only CBOR
# on the wire and want to drop the `JsonCodec` wrapper type from the
# client surface. CBOR stays unconditional — the schema macros emit
# `pub struct Client<C = CborCodec>` — and the projection-view client
# methods (`get_view` / `list_view` / `list_view_paged`) route through
# the client's codec, so they keep working over CBOR when this feature
# is off.
codec-json = ["cratestack-client-rust/codec-json"]
# Real `transport grpc` Rust codegen — a `Grpc` schema otherwise fails
# `include_server_schema!` with a `compile_error!` pointing here (see
# `crates/cratestack-macros/src/include/reject_grpc.rs`). Off by default:
# pulls in `tonic`/`prost` (and `tonic`'s own `axum` dependency — verified
# workspace-aligned with this crate's own `axum`, `docs/design/protobuf.md`
# §7.2's first acceptance criterion) for every consumer otherwise, whether
# or not they use gRPC.
#
# `dep:prost` (not just `dep:cratestack-grpc`) is required here, not a
# belt-and-suspenders addition: `prost-derive`'s `#[derive(Message)]`
# expansion hardcodes bare `::prost::...` paths in the code it generates
# (verified against `prost-derive`'s own source — there is no `#[prost(crate
# = "...")]` escape hatch, unlike e.g. serde's `#[serde(crate = "...")]`).
# That means every crate whose generated `pb::` mirror structs derive
# `Message` — i.e. every consumer enabling this feature — needs `prost`
# resolvable as a literal top-level crate name in *their own* crate graph,
# which only a direct (even if unused-by-name) Cargo dependency provides;
# `::cratestack::grpc::prost::...` re-exports a *module path* to the same
# crate for everything this crate's own code references by path, but
# cannot satisfy `prost-derive`'s hardcoded `::prost::` — Rust's extern
# prelude is per-crate, not transitive through a re-exporting dependency.
#
# `cratestack-client-rust/grpc` (ticket #209): forwards the native Rust
# gRPC *client* runtime (`::cratestack::client_rust::grpc::
# CratestackGrpcClient`) that `include_client_schema!`'s `transport grpc`
# codegen references. Both server and client gRPC codegen share this one
# Cargo feature (same reasoning `cratestack-macros/grpc` already applies
# to both `include_server_schema!` and `include_client_schema!` — see
# `cratestack-macros/src/include/reject_grpc.rs`'s module doc): a crate
# using this facade purely as a gRPC client still needs the client-runtime
# half, not the server (`cratestack-grpc`/`dep:prost` for the tonic
# service) half, but there is currently no split finer than "the `grpc`
# feature is on or off" — narrowing that is future work if the unified
# cost (tonic pulled in either way) ever becomes a problem in practice.
grpc = [
    "cratestack-macros/grpc",
    "dep:cratestack-grpc",
    "dep:prost",
    "cratestack-client-rust/grpc",
]
# NOT YET FUNCTIONAL — enabling this feature is a hard compile_error!, not a
# working FIPS mode. It exists only as a reserved name so a future PR can
# wire it up without a breaking rename. `aws-lc-rs` is not a dependency of
# this crate under any feature, and `cratestack-sqlx`/`cratestack-client-rust`
# both hard-select the `ring` rustls backend at compile time regardless of
# this flag — additive Cargo features can't subtract that. Making this a
# real FIPS mode requires the TLS backend becoming a genuine choice across
# both of those crates first (tracked:
# https://github.com/cratestack/cratestack/issues/334). Until then this
# feature must never silently compile and return success — see
# `install_fips_crypto_provider`'s compile_error! below.
crypto-aws-lc-rs = []
# Forwards `cratestack-macros`'s own `rate_limit` feature (cratestack#161's
# Cargo-feature enforcement mechanism, `crates/cratestack-macros/src/include/
# extension_gate.rs`) — this is what turns off the `compile_error!` a schema
# declaring `extension rate_limit { }` otherwise hits. Off by default, same
# non-default posture as `grpc` above: enabling it only unlocks the
# `@no_rate_limit` procedure attribute and the `rate_limited_by_default`
# field it threads onto the generated `OpDescriptor` (docs/design/
# extensions.md §5) — participation-only, never a numeric limit. Does *not*
# gate `cratestack-axum`'s existing `RateLimitLayer`/`RateLimitConfig`/store
# code, which stays unconditionally compiled and is unaffected by this
# feature — see cratestack#154's scope note.
rate_limit = ["cratestack-macros/rate_limit"]
# End-to-end `pgvector` extension support (see
# `docs/design/extensions.md` §6): unlocks `Vector(n)` model fields
# for `include_server_schema!`/`include_client_schema!` schemas that
# declare `extension pgvector { }`. Forwards to `cratestack-macros`'
# own gate-only `pgvector` feature (#161's compile-time check — a
# schema declaring the extension without this feature enabled is a
# `compile_error!`, not a silent no-op) and to `cratestack-sqlx`'s
# `pgvector` feature (real Postgres `vector` column encode/decode via
# the `pgvector` crate).
pgvector = ["cratestack-macros/pgvector", "cratestack-sqlx/pgvector"]

[dependencies]
async-stream.workspace = true
chrono.workspace = true
cratestack-axum.workspace = true
cratestack-client-rust.workspace = true
cratestack-core.workspace = true
cratestack-grpc = { workspace = true, optional = true }
cratestack-macros.workspace = true
futures-util.workspace = true
prost = { workspace = true, optional = true }
cratestack-parser.workspace = true
cratestack-policy.workspace = true
cratestack-sql.workspace = true
cratestack-sqlx = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
cratestack-migrate.workspace = true
minicbor-serde.workspace = true
# Real HTTP/1.1 client for the `@@subscribe` SSE end-to-end test
# (`tests/rpc_subscribe_sse.rs`, cratestack#390) — handles
# `Transfer-Encoding: chunked` framing (axum streams SSE bodies without a
# known `Content-Length`) so the test doesn't have to hand-roll chunked
# decoding on top of a raw `TcpStream`. Already a workspace dependency
# (`examples/rpc-streaming` uses it the same way for `@stream` procedures).
# #440: `rustls-no-provider` needs a crypto provider installed before the
# bare `reqwest::Client::new()` above (`generated_client_rust*.rs`'s
# `CratestackClient`-based tests get it for free via that constructor's own
# fallback; only `rpc_subscribe_sse.rs`'s direct `reqwest::Client` needs this
# explicitly).
reqwest.workspace = true
rustls.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Only compiled/run under `--features pgvector` — the fixture schema
# declares `extension pgvector { }`, which is a `compile_error!`
# without the feature (see the `pgvector` feature doc comment above).
[[test]]
name = "pgvector_feature_forwarding"
path = "tests/pgvector_feature_forwarding.rs"
required-features = ["pgvector"]

# Live nearest-neighbor verification of the cratestack#163 query-builder
# distance operators — needs a real `pgvector/pgvector` Postgres (not
# the default `compose.yml` one), so it's not part of `just test-pg`'s
# normal green path either; see the test file's own module docs for how
# to run it.
[[test]]
name = "pgvector_distance_query"
path = "tests/pgvector_distance_query.rs"
required-features = ["pgvector"]
