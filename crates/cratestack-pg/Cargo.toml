[package]
name = "cratestack-pg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack server facade — Postgres (sqlx) backend with Axum HTTP bindings, generated Rust client runtime, and the shared schema/parser/policy/SQL surface. Pick this crate via `cratestack = { package = \"cratestack-pg\" }` for backend services."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# The library is named `cratestack` so that integration tests under
# `tests/` resolve `::cratestack::*` paths (which the schema macros
# emit) without per-file aliasing. External consumers depend on the
# package as `cratestack = { package = "cratestack-pg" }` — Cargo's
# package-rename mechanism already exposes the lib under whatever name
# they pick on their side, so this `[lib] name` change is invisible
# downstream.
[lib]
name = "cratestack"
path = "src/lib.rs"

[features]
default = ["decimal-rust-decimal", "codec-json"]
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-sqlx/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-sqlx/decimal-bigdecimal",
]
# Forwards the JSON codec to the generated client runtime. On by default
# so `include_client_schema!` keeps offering both CBOR and JSON; disable
# (`default-features = false`) on backend services that speak only CBOR
# on the wire and want to drop the `JsonCodec` wrapper type from the
# client surface. CBOR stays unconditional — the schema macros emit
# `pub struct Client<C = CborCodec>` — and the projection-view client
# methods (`get_view` / `list_view` / `list_view_paged`) route through
# the client's codec, so they keep working over CBOR when this feature
# is off.
codec-json = ["cratestack-client-rust/codec-json"]
# Real `transport grpc` Rust codegen — a `Grpc` schema otherwise fails
# `include_server_schema!` with a `compile_error!` pointing here (see
# `crates/cratestack-macros/src/include/reject_grpc.rs`). Off by default:
# pulls in `tonic`/`prost` (and `tonic`'s own `axum` dependency — verified
# workspace-aligned with this crate's own `axum`, `docs/design/protobuf.md`
# §7.2's first acceptance criterion) for every consumer otherwise, whether
# or not they use gRPC.
#
# `dep:prost` (not just `dep:cratestack-grpc`) is required here, not a
# belt-and-suspenders addition: `prost-derive`'s `#[derive(Message)]`
# expansion hardcodes bare `::prost::...` paths in the code it generates
# (verified against `prost-derive`'s own source — there is no `#[prost(crate
# = "...")]` escape hatch, unlike e.g. serde's `#[serde(crate = "...")]`).
# That means every crate whose generated `pb::` mirror structs derive
# `Message` — i.e. every consumer enabling this feature — needs `prost`
# resolvable as a literal top-level crate name in *their own* crate graph,
# which only a direct (even if unused-by-name) Cargo dependency provides;
# `::cratestack::grpc::prost::...` re-exports a *module path* to the same
# crate for everything this crate's own code references by path, but
# cannot satisfy `prost-derive`'s hardcoded `::prost::` — Rust's extern
# prelude is per-crate, not transitive through a re-exporting dependency.
grpc = ["cratestack-macros/grpc", "dep:cratestack-grpc", "dep:prost"]
# Replace the default `ring`-backed rustls provider with `aws-lc-rs`, which
# is the only provider with current FIPS 140-3 validation among the
# pure-Rust rustls backends. Selecting this feature does not make a build
# "FIPS-certified" — that requires the vendor's validated binary; it lets
# you compile and ship a binary that uses the validated crypto module.
crypto-aws-lc-rs = []

[dependencies]
chrono.workspace = true
cratestack-axum.workspace = true
cratestack-client-rust.workspace = true
cratestack-core.workspace = true
cratestack-grpc = { workspace = true, optional = true }
cratestack-macros.workspace = true
futures-util.workspace = true
prost = { workspace = true, optional = true }
cratestack-parser.workspace = true
cratestack-policy.workspace = true
cratestack-sql.workspace = true
cratestack-sqlx.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-stream = "0.3"
axum.workspace = true
cratestack-codec-cbor.workspace = true
cratestack-codec-json.workspace = true
cratestack-migrate.workspace = true
minicbor-serde.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
