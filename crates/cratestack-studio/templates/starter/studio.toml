# CrateStack Studio workspace config — ejected starter.
#
# Tune `targets` to point at your real DBs / APIs. The example below
# wires the bundled `schemas/example.cstack` to an on-disk SQLite file
# so `cargo run` boots into a working admin app without any external
# services.

[workspace]
name = "studio"
default_mode = "rw"

[[target]]
key = "example"
display_name = "Example"
schema = "schemas/example.cstack"
mode = "rw"

# [target.db] is a direct SQL connection, not a proxy to a deployed
# service — it is NOT equivalent to the generated API (cratestack#507,
# #553). @version bumping is routed for real on every driver. @@emit(...)
# is routed for real only on driver = "postgres" — SQLite has no
# event-outbox equivalent, and include_embedded_schema! itself treats
# @@emit(...) as a no-op on the framework's own embedded backend, so
# this is a permanent backend capability difference. No schema-declared
# write constraint is enforced on [target.db] either way: @@allow /
# @@deny are never evaluated, and @@internal(...) route suppression
# does not apply, so a suppressed or denied action is still performable
# here. That is deliberate for a direct-SQL admin tool
# (cratestack#744) — `mode = "rw"` on a [target.db] target is
# database-level access. Point the target at [target.api] instead when
# you need the schema's constraints enforced; the deployed service
# applies them itself.
# `schemas/example.cstack` declares neither @version nor @@emit, so
# none of this applies to this starter — but for a model that declares
# @@emit(...) on a non-Postgres target, Studio refuses
# POST/PATCH/DELETE against it with 403 UNSAFE_DB_WRITE unless
# `allow_unsafe_writes = true` is set here explicitly.
[target.db]
url = "sqlite:./studio.sqlite"
driver = "sqlite"
