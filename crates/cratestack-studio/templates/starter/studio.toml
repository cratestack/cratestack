# CrateStack Studio workspace config — ejected starter.
#
# Tune `targets` to point at your real DBs / APIs. The example below
# wires the bundled `schemas/example.cstack` to an on-disk SQLite file
# so `cargo run` boots into a working admin app without any external
# services.

[workspace]
name = "studio"
default_mode = "rw"

[[target]]
key = "example"
display_name = "Example"
schema = "schemas/example.cstack"
mode = "rw"

# [target.db] is a direct SQL connection, not a proxy to a deployed
# service: writes here bypass @version bumping, @@emit(...) event
# outbox rows, and @@allow policy checks (cratestack#507). It is NOT
# equivalent to the generated API. `schemas/example.cstack` declares
# neither @version nor @@emit, so the bypass is a no-op for this
# starter — but for a model that declares either, Studio refuses
# POST/PATCH/DELETE against this target with 403 UNSAFE_DB_WRITE
# unless `allow_unsafe_writes = true` is set here explicitly.
[target.db]
url = "sqlite:./studio.sqlite"
driver = "sqlite"
