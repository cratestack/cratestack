# CrateStack Studio workspace configuration.
#
# Each [[target]] describes one .cstack schema and how the studio reaches
# its data. A target needs at least one of `[target.db]` or `[target.api]`.
#
# Phase 0 only validates this file's shape. The fields below are the v0
# surface — DB/API targets become functional in Phase 1.

[workspace]
name = "studio"
# default_mode applies when a target omits `mode`. Values: "ro" | "rw".
default_mode = "ro"

# Optional: persist the audit log of Studio's own writes (CREATE /
# UPDATE / DELETE) to an append-only JSONL file, replayed on boot so it
# survives restarts. Relative paths resolve against this file's
# directory.
#
# Left unset, the audit log lives in process memory only — Studio writes
# nothing to your filesystem and creates nothing in your database. The
# file is Studio-local either way: audit rows are never written into the
# target database's schema.
#
# The file is append-only and Studio never rotates or truncates it; the
# in-memory ring the API serves stays capped regardless of its size.
#
# audit_file = ".cratestack-studio/audit.jsonl"

# Example target — replace with your own and remove this stub before booting.
#
# [[target]]
# key = "catalog"
# display_name = "Catalog"
# schema = "schemas/catalog.cstack"
# mode = "rw"
#
# [target.db]
# url = "env:CATALOG_DB_URL"
# driver = "postgres"
# max_connections = 5
#
# IMPORTANT: a [target.db] target is a direct SQL connection, not a
# proxy to your deployed service — it is NOT equivalent to the
# generated API (cratestack#507, #553):
#
# - @version bumping is routed for real on every driver (Postgres and
#   SQLite alike), so a @version-only model is never refused here.
# - @@emit(...) is routed for real (a cratestack_event_outbox row lands
#   in the same transaction) ONLY on driver = "postgres". SQLite has no
#   event-outbox equivalent, and include_embedded_schema! itself treats
#   @@emit(...) as a no-op on the framework's own embedded backend — so
#   this is a permanent backend capability difference, not a gap
#   waiting to be closed. A model that declares @@emit(...) on a
#   non-Postgres [target.db] target still gets a 403 UNSAFE_DB_WRITE
#   unless you opt in below:
#
# allow_unsafe_writes = true
#
# NO schema-declared write constraint is enforced on a [target.db]
# target — not @@allow / @@deny (reads or writes), and not
# @@internal(...) route suppression. A model whose create is
# suppressed with @@internal("create"), or denied by an @@allow rule,
# is still creatable here. That is deliberate for a direct-SQL admin
# tool (cratestack#744), but it means `mode = "rw"` on a [target.db]
# target grants unauthenticated, database-level access through
# Studio's HTTP API to anything the schema declares off-limits. Use
# [target.api] (below) when you need the schema's constraints
# enforced.
#
# [target.api]
# base_url = "https://catalog.internal"
# auth = { kind = "bearer", token = "env:CATALOG_TOKEN" }
# # Writes through [target.api] go through your deployed service's own
# # generated routes, so @version, @@emit, @@allow/@@deny and
# # @@internal(...) all apply exactly as declared — enforced by the
# # service, not by Studio. `rw` here grants no more than the token
# # above already has.
# #
# # A target that declares BOTH blocks is a [target.db] target for
# # every read and write: the loader prefers [target.db] whenever it is
# # present, so adding [target.api] alongside it buys no enforcement.
