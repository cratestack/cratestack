[package]
name = "cratestack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Any combination of these two may be selected — neither, one, or both
# (cratestack#505 Direction 2; see `src/decimal.rs`'s module doc for the
# full history: both-selected used to be a hard `compile_error!`, which was
# itself the defect cratestack#505 reports). `default-features = false` on
# this crate's `[workspace.dependencies]` entry (root `Cargo.toml`) means
# every direct dependency edge onto `cratestack-core` elsewhere in the
# workspace must explicitly re-select one of these two if it wants
# `Decimal`/`RustDecimal`/`BigDecimal` to exist at all — that is deliberate
# (cratestack#495/#421): it is what lets a consumer pick `decimal-bigdecimal`
# without this crate's own `default` silently forcing `decimal-rust-decimal`
# back in behind them.
default = ["decimal-rust-decimal"]
# rust_decimal: 96-bit fixed-precision, stack-allocated, `Copy`. The
# long-standing default — fast, no heap allocation, but capped at 28-29
# significant decimal digits.
decimal-rust-decimal = ["dep:rust_decimal"]
# bigdecimal: arbitrary-precision, heap-allocated (backed by `num-bigint`),
# NOT `Copy` (unlike rust_decimal — every call site that used to rely on
# implicit `Decimal` copies needs `.clone()` instead; audited across the
# workspace for cratestack#495). Chosen over rust_decimal when a schema's
# monetary/precision requirements can exceed 28-29 significant digits, at
# the cost of an allocation per value.
decimal-bigdecimal = ["dep:bigdecimal"]
# Driver trait impls for `BigInt` (ADR 0019 D3, amended in PR B). Off by default
# and enabled only by the backend runtime that needs it: `cratestack-sqlx`
# turns on `sqlx-postgres`, `cratestack-rusqlite` turns on `rusqlite`. They
# live in this crate, behind optional dependencies, because the orphan rule
# lets only the crate that owns `BigInt` or the crate that owns the driver
# traits implement them, and a `BigInt @id` or foreign key reaches the sqlx
# delegates' `PK: Type<Postgres> + Encode<Postgres>` bounds directly. They are
# optional so that no facade other than the one that opts in pulls a driver:
# `cratestack-api` and `cratestack-client` stay free of sqlx, and
# `cratestack-pg` stays free of `libsqlite3-sys` (`facade-disjointness`).
# `sqlx-core` and `sqlx-postgres` are the pair `cratestack-sqlx` already
# depends on, not the `sqlx` umbrella, for the same `links = "sqlite3"` reason.
sqlx-postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]
rusqlite = ["dep:rusqlite"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hmac.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
rust_decimal = { workspace = true, optional = true }
bigdecimal = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

[dev-dependencies]
# Installs a counting `#[global_allocator]`. It is linked only into the test
# binary that names it (`tests/no_envelope_alloc.rs`), never into the library.
allocation-counter.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Pins `Value`'s CBOR wire shape against the first-party backend. A
# dev-dependency rather than a real one: depending on `cratestack-codec-cbor`
# from core would be a cycle, and the wire shape is core's contract to keep.
minicbor-serde.workspace = true
