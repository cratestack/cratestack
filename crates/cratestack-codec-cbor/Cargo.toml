[package]
name = "cratestack-codec-cbor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Forwards to `cratestack-core`'s decimal backend features (see that crate's
# Cargo.toml for the full rationale). Since cratestack#505 any combination
# may be selected: neither, one, or both. The forward is still required:
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root, so without it this crate's build may get no decimal type
# at all (cratestack#521).
default = ["decimal-rust-decimal"]
decimal-rust-decimal = ["cratestack-core/decimal-rust-decimal"]
decimal-bigdecimal = ["cratestack-core/decimal-bigdecimal"]

[dependencies]
cratestack-core.workspace = true
# `seq::CborSeqChunkDecoder` uses `minicbor::Decoder::skip` for item
# boundaries; `minicbor-serde` already brings the same crate in.
minicbor = { workspace = true, features = ["alloc"] }
minicbor-serde.workspace = true
serde.workspace = true
serde_path_to_error.workspace = true

[dev-dependencies]
# `tests/encode_into_alloc.rs` counts allocations to prove `encode_into`
# writes into the caller's buffer (cratestack#1005). Its own test binary,
# because it installs a `#[global_allocator]`.
allocation-counter.workspace = true
serde_json.workspace = true
