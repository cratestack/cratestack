[package]
name = "cratestack-codec-cbor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Forwards to `cratestack-core`'s mutually-exclusive decimal backend choice
# (see that crate's Cargo.toml for the full rationale). Required because
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root — every direct consumer must explicitly re-select a
# backend, or `cratestack-core` fails to compile at all (cratestack#495).
default = ["decimal-rust-decimal"]
decimal-rust-decimal = ["cratestack-core/decimal-rust-decimal"]
decimal-bigdecimal = ["cratestack-core/decimal-bigdecimal"]

[dependencies]
cratestack-core.workspace = true
minicbor-serde.workspace = true
serde.workspace = true

[dev-dependencies]
# `tests/encode_into_alloc.rs` counts allocations to prove `encode_into`
# writes into the caller's buffer (cratestack#1005). Its own test binary,
# because it installs a `#[global_allocator]`.
allocation-counter.workspace = true
serde_json.workspace = true
