[package]
name = "cratestack-client-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
# CBOR is the framework's default backend-to-backend transport and
# is the type the schema macro emits as the default codec parameter
# (`pub struct Client<C = CborCodec>`), so it is **not** opt-out.
# Only `JsonCodec` is feature-gated — it is useful for debugging
# and content-negotiation fallback but production deployments that
# treat JSON as a misconfiguration may want to disable it so a
# stray `application/json` response surfaces as a hard codec error.
default = ["codec-json", "decimal-rust-decimal"]
codec-json = ["dep:cratestack-codec-json"]
# `cratestack-core`'s dependency edge has `default-features = false` at the
# workspace root (cratestack#495), so this crate — a real, non-macro
# consumer of `cratestack_core::Decimal` in its own generated-code support
# surface — must explicitly re-select a backend, same as every other direct
# `cratestack-core` edge in the workspace.
#
# `cratestack-codec-json?/...` (weak-dependency syntax): `codec-json` is
# itself optional (`dep:cratestack-codec-json`), and `cratestack-codec-json`
# is its own `cratestack-core` consumer with the identical two-backend
# choice. A plain (non-weak) `cratestack-codec-json/decimal-rust-decimal`
# edge here would force-activate the optional `cratestack-codec-json`
# dependency as a side effect even when `codec-json` itself is off — see
# `cratestack-pg`'s `decimal-rust-decimal` feature for the same pattern
# applied to `cratestack-sqlx?/...`. The `?` makes the forward apply only
# when `cratestack-codec-json` is already enabled some other way (i.e. via
# the `codec-json` feature), so this crate's own backend choice and
# `cratestack-codec-json`'s stay in lockstep without ever mismatching.
#
# `cratestack-codec-cbor/...` (plain, not weak): unlike `codec-json`,
# `cratestack-codec-cbor` is a mandatory (non-optional) dependency — see
# the `[dependencies]` entry below — so it always needs an explicit
# forward here, with no "only if already enabled" condition to gate on.
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-codec-cbor/decimal-rust-decimal",
    "cratestack-codec-json?/decimal-rust-decimal",
]
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-codec-cbor/decimal-bigdecimal",
    "cratestack-codec-json?/decimal-bigdecimal",
]
# Native Rust gRPC client runtime (ticket #209) — `crate::grpc::
# CratestackGrpcClient`, the tonic-based counterpart to `CratestackClient`
# (REST) and `RpcClient` (RPC). Off by default: pulls in `tonic` (and
# transitively `prost`, `h2`, `tower`) for every consumer otherwise,
# whether or not they use gRPC. Forwarded from `cratestack-pg`'s own
# `grpc` feature, same wiring as `cratestack-macros/grpc`.
#
# Uses `tonic`'s workspace-pinned *default* features (`router`,
# `transport`, `codegen`, `prost`) rather than trimming to just
# `channel`+`codegen`+`prost`: Cargo's workspace-dependency inheritance
# does not allow a member to set `default-features = false` against a root
# `workspace.dependencies` entry that itself didn't declare
# `default-features` explicitly (verified — `cargo check` hard-errors with
# "cannot override workspace's default-features" when attempted), and
# `cratestack-grpc` (the server runtime) already pulls in the same default
# features unconditionally, so this doesn't add new weight to the
# workspace's dependency graph overall — only to this one crate's own
# graph when `grpc` is enabled. Revisit (a non-inherited, locally-versioned
# `tonic` entry instead of `.workspace = true`) if that ever becomes a
# real problem in practice.
#
# `prost` itself is also a direct dependency here (not just reachable
# through `tonic`): `CratestackGrpcClient::unary`'s own `where Req: prost::
# Message` bound needs to name the trait, which requires `prost` resolvable
# as a literal crate name in *this* crate's graph — the same requirement
# `cratestack-grpc`'s module doc documents for `prost_derive`'s hardcoded
# `::prost::` paths, except here it's an ordinary trait-bound reference, not
# a derive-macro expansion, so a ordinary (non-derive) dependency suffices.
grpc = ["dep:tonic", "dep:prost"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
# `default-features = false`: pairs with the plain (mandatory) forward in
# `decimal-rust-decimal`/`decimal-bigdecimal` above.
cratestack-codec-cbor = { workspace = true, default-features = false }
# `default-features = false`: pairs with the `?` weak-dependency forwards in
# `decimal-rust-decimal`/`decimal-bigdecimal` above — without it,
# `cratestack-codec-json`'s own `default = ["decimal-rust-decimal"]` would
# activate the moment `codec-json` turns the dependency on at all,
# independent of which backend this crate itself selected.
cratestack-codec-json = { workspace = true, optional = true, default-features = false }
cratestack-core.workspace = true
futures-util.workspace = true
minicbor.workspace = true
minicbor-serde.workspace = true
prost = { workspace = true, optional = true }
reqwest.workspace = true
# #440: `reqwest`'s `rustls-no-provider` feature (see the workspace
# `Cargo.toml`'s `reqwest` entry) ships no crypto provider — `CratestackClient::new`
# installs a `ring` fallback (`client/core.rs`'s `ensure_crypto_provider`) so
# this crate keeps working out of the box, so this is a real (non-dev)
# dependency now, not just a test-support one.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tonic = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
async-stream = "0.3"
axum.workspace = true
# Plain edge, not a hardcoded `features = [...]`: this is the same
# `cratestack-core` instance as the `[dependencies]` entry above, and Cargo
# unifies features for a single dependency across normal/dev edges of the
# same crate — the real edge's `decimal-rust-decimal`/`decimal-bigdecimal`
# forward already covers what `cargo test` needs here. Hardcoding a backend
# here independently would fight that forward under
# `--features decimal-bigdecimal` (both backends active at once trips the
# mutual-exclusion `compile_error!` in `cratestack-core`).
cratestack-core.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
