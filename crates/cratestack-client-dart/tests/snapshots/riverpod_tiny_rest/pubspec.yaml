name: tiny_rest_client
description: Generated CrateStack Flutter client package.
publish_to: 'none'
version: 0.1.0

environment:
  # `^3.5.0`, matching every other declared SDK floor in this repo
  # (`dart-packages/cratestack_annotations`, the default preset's own
  # `pubspec.yaml.j2`, `examples/flutter-riverpod/app`). Was
  # `'>=3.0.0 <4.0.0'`, which is the same upper bound written the long way
  # with a floor two years below anything the generated code actually
  # parses against.
  #
  # Note this floor does NOT bound the dev toolchain: `riverpod_generator`
  # and `flutter_riverpod` both declare `sdk: ^3.12.0` themselves, so pub
  # will only hand this package the pinned dev versions below on a Dart
  # >=3.12 SDK, and backsolve to older ones otherwise. That is pub's job,
  # not this line's — the floor states the language level the GENERATED
  # code needs, which is unchanged.
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  # Exact pin, not a range — the pinned `riverpod_generator` dev
  # dependency below itself depends on this exact `riverpod_annotation`
  # release (also an exact pin, not a range), so this has to match it
  # exactly or pub's resolver can't solve the graph at all. See the
  # `build_runner`/`riverpod_generator` comment below for why these
  # three are pinned together as one unit.
  #
  # Moves in LOCKSTEP with `riverpod_generator` below and never on its
  # own: 4.0.4 wanted `4.0.3`, 4.0.6/4.0.7 want `4.0.5`, 4.0.8 wants
  # `4.0.6`. Read the generator's pin, then set this to whatever that
  # release names.
  riverpod_annotation: 4.0.6
  cbor: ^6.5.1
  dio: ^5.8.0+1
  # issue #325: gives every generated data class real `operator ==`/
  # `hashCode`/`copyWith` via `@MappableClass()` (see
  # `enums_and_data_classes.dart.j2`) — a range, not an exact pin, since
  # the runtime annotation package has no analyzer-version entanglement
  # of its own; see `dart_mappable_builder` below (dev_dependencies) for
  # the pin that actually matters.
  dart_mappable: ^4.8.0
  # issue #336: relation-list fields use `IList<T>` (immutable) instead
  # of `List<T>`. `dart_mappable`'s generated `==`/`hashCode` handles
  # `IList` field-by-field the same way it handles `List` — verified as
  # part of resolving this merge conflict, see this PR's own comment
  # for the real `flutter analyze`/`flutter test` run proving it.
  fast_immutable_collections: ^11.2.0
  # cratestack#498: see `pubspec.yaml.j2`'s identical dependency comment —
  # same reason, same package, this preset's `shared_types.dart.j2`
  # `DecimalFilter`/per-model data classes need it too.
  decimal: ^3.2.6
  # issue #668 phase 2: see `pubspec.yaml.j2`'s identical dependency
  # comment — same annotation, same reasoning, every per-model file and
  # `procedures.dart` carries `@CratestackBuilder()` here too.
  cratestack_annotations: ^0.8.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # THE ANALYZER-12 WALL IS GONE. This block used to hold
  # build_runner/riverpod_generator/riverpod_annotation down as one
  # deliberately-outdated unit; it now holds them at current releases as
  # one deliberately-*aligned* unit. Same lockstep discipline, opposite
  # direction, and a different reason. The history matters because the
  # old comment named the wrong culprit, so here is what was actually
  # true and what changed.
  #
  # WHAT THE WALL REALLY WAS (one exact pin, not a chain of them):
  #
  #   `analyzer` >=13.1.0 requires `meta: ^1.18.3`, and every
  #   `flutter_test` shipped with Flutter up to and including 3.46.x
  #   pinned `meta` to EXACTLY `1.18.0`. An exact pin cannot be widened
  #   by a consumer, so nothing in a Flutter package's graph could reach
  #   analyzer 13.1+. That single line was the entire wall.
  #
  #   CORRECTION to what this comment used to claim: it also said
  #   `flutter_test`'s transitive `test`/`matcher` chain "independently
  #   forces `analyzer <13.0.0`". That is not so — checked against
  #   pub.dev's per-version API, neither `matcher` (0.12.20) nor
  #   `test_api` (0.7.13) declares an `analyzer` dependency at all. There
  #   was only ever one constraint to clear.
  #
  # WHAT CHANGED: **Flutter 3.47.0 (2026-08-12) relaxed
  # `flutter_test`'s `meta` pin from exactly `1.18.0` to `^1.18.3`** —
  # verified by reading `packages/flutter_test/pubspec.yaml` out of the
  # SDK this was developed against (Flutter 3.47.2 / Dart 3.13.2), not
  # inferred from release notes. With that pin widened, analyzer 13.x
  # resolves in a Flutter package for the first time, and the whole
  # pinned group can move forward together.
  #
  # WHAT NOW BLOCKS GOING HIGHER — the ceiling is `riverpod_generator`,
  # not Flutter:
  #
  #   riverpod_generator   4.0.8  -> analyzer ^13.0.0  (>=13.0.0 <14.0.0)
  #   dart_mappable_builder 4.9.0 -> analyzer >=13.0.0 <14.0.0
  #   build_runner         2.16.0 -> analyzer >=13.3.0 <15.0.0
  #   -------------------------------------------------------------
  #   intersection: analyzer 13.3.0 (the newest 13.x; 14.1.0 exists and
  #   is unreachable until riverpod_generator accepts 14.x)
  #
  # So `build_runner` gets an open-topped `^2.16.0` — its own band is the
  # widest of the three and is not what pins anything — while
  # riverpod_generator/riverpod_annotation/dart_mappable_builder stay
  # exactly pinned. The old `">=2.14.0 <2.15.2"` cap existed ONLY to keep
  # `build_runner` off the `analyzer >=13.3.0` floor; that floor is now
  # the target, so the cap is deleted rather than nudged.
  #
  # `riverpod_generator: 4.0.8` is the current release (4.0.5 was never
  # published; 4.0.6 is where the `^12.0.0` -> `^13.0.0` move landed).
  # It accepts `riverpod_annotation: '4.0.6'` exactly, hence that pin
  # above — read it off the generator, never bump it independently.
  #
  # STILL TRUE, DO NOT RE-DERIVE: pinning `analyzer` directly in this
  # file, or reaching for `dependency_overrides`, is the wrong tool. An
  # earlier attempt overrode `analyzer` to 13.0.0 and got a resolving
  # `pub get` that then failed for real at codegen — `dart_style` (via
  # `build_runner`) calls `ExtensionTypeDeclaration.namePart`, which
  # 13.0.0's AST does not have. The lesson generalises past that specific
  # getter: **a resolving `pub get` is not evidence this file is
  # correct.** The check that counts is `dart run build_runner build`
  # actually emitting `.g.dart`/`.mapper.dart`, which is why
  # `just verify-dart` and CI's `flutter (flutter-riverpod example)` job
  # both run it rather than stopping at resolution.
  build_runner: ^2.16.0
  riverpod_generator: 4.0.8
  # issue #325: `dart_mappable_builder` joins the group above as a fourth
  # pinned-together package, not an independent constraint — it runs in
  # the same `build_runner` pass as `riverpod_generator` and shares its
  # resolved `analyzer`.
  #
  # Pinned to *exactly* `4.9.0` (current release), not a range. Was
  # `4.8.0`, and the reason it was held there has inverted: 4.8.0
  # declares `analyzer: '>=10.0.0 <13.0.0'`, which was the only band
  # reachable under the old `meta: 1.18.0` wall and is now the one band
  # that CANNOT be used, because `riverpod_generator` 4.0.8 requires
  # `>=13.0.0`. 4.9.0 declares `analyzer: '>=13.0.0 <14.0.0'` — the exact
  # same window as riverpod_generator's `^13.0.0`, so the two agree
  # without either one moving the resolved analyzer off 13.3.0.
  #
  # Verified end to end on Flutter 3.47.2 / Dart 3.13.2: `flutter pub
  # get` resolves, `dart run build_runner build` runs
  # `riverpod_generator` and `dart_mappable_builder` in the same pass and
  # emits real `.mapper.dart` output with genuine `operator ==`/
  # `hashCode`/`copyWith`, and `flutter analyze --fatal-warnings
  # --no-fatal-infos` is clean afterward.
  dart_mappable_builder: 4.9.0
  # issue #668 phase 2: a fifth package in the same `build_runner` pass,
  # sharing the same resolved `analyzer`. A version range (not a pin) is
  # right here, unlike the four above: `cratestack_builder` is this
  # repo's own package, so its constraint is something we move rather
  # than something we work around.
  #
  # RELEASE ORDERING — this is a real, temporary constraint, not a
  # footnote. `dart-packages/cratestack_builder/pubspec.yaml` now
  # declares `analyzer: '>=13.0.0 <14.0.0'`, which agrees with the
  # `13.x` band above. But every release PUBLISHED to pub.dev so far
  # (0.8.5 through 0.8.15 — checked against the registry, not the
  # changelog) still declares `>=12.0.0 <13.0.0`, and
  # `>=12.0.0 <13.0.0` ∩ `^13.0.0` is empty. So until a
  # cratestack_builder release carrying the analyzer-13 constraint is
  # actually on pub.dev, a client generated from this template cannot
  # resolve from a clean checkout — `flutter pub get` fails version
  # solving outright.
  #
  # That is the same bootstrapping gap `just verify-dart` and
  # `just verify-dart-packages` already handle, by the same sanctioned
  # mechanism: a `pubspec_overrides.yaml` pointing at this repo's
  # in-repo sibling. It is NOT a defect in this file and must not be
  # "fixed" by reverting the pins above.
  # TODO(cratestack maintainer): once an analyzer-13 `cratestack_builder`
  # is published, raise `CRATESTACK_BUILDER_FLOOR` in
  # `crates/cratestack-client-dart/src/package_floors.rs` to that
  # version, so the emitted constraint can no longer resolve to a
  # release that caps analyzer below 13.
  cratestack_builder: ^0.8.10
