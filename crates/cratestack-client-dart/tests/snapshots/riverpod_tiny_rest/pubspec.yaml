name: tiny_rest_client
description: Generated CrateStack Flutter client package.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  # Exact pin, not a range — the pinned `riverpod_generator` dev
  # dependency below itself depends on this exact `riverpod_annotation`
  # release (also an exact pin, not a range), so this has to match it
  # exactly or pub's resolver can't solve the graph at all. See the
  # `build_runner`/`riverpod_generator` comment below for why these
  # three are pinned together as one unit.
  riverpod_annotation: 4.0.3
  cbor: ^6.5.1
  dio: ^5.8.0+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # This trio (build_runner/riverpod_generator/riverpod_annotation above)
  # is pinned as one deliberately-outdated unit, not three independent
  # constraints — newer releases of any one of them are individually
  # incompatible with Flutter's `stable` channel today. Root cause,
  # confirmed against the *exact* CI SDK (Flutter 3.44.8 / Dart 3.12.2,
  # downloaded locally and used to reproduce this for real, not guessed
  # from pub.dev version tables alone):
  #
  #   `build_runner` >=2.15.2 requires `analyzer` >=13.3.0, which
  #   requires `meta` ^1.18.3 — but every `flutter_test` from the SDK
  #   pins `meta` to exactly 1.18.0.
  #
  # Pinning just `analyzer` down to a compatible 13.0.x release (an
  # earlier attempt, since reverted) resolves `pub get` but does NOT
  # work: `flutter_test`'s own transitive `test`/`matcher` chain on this
  # exact SDK independently forces `analyzer <13.0.0`, so an explicit
  # `analyzer: ">=13.0.0 <13.1.0"` pin only trades one version-solving
  # failure for another. A `dependency_overrides: analyzer: 13.0.0`
  # override *resolves* (overrides bypass the conflicting `test`-chain
  # constraint entirely) but then genuinely breaks at codegen time —
  # `dart_style` (pulled in by `build_runner`) references an
  # `ExtensionTypeDeclaration.namePart` getter that doesn't exist on
  # `analyzer` 13.0.0's AST types, a real `dart run build_runner build`
  # failure, not a resolver artifact.
  #
  # `riverpod_generator: 4.0.4` is the newest release still on
  # `analyzer: ^12.0.0`, which satisfies the `flutter_test` chain's
  # `<13.0.0` requirement for real (no override needed) — but 4.0.4 only
  # accepts `riverpod_annotation: '4.0.3'` exactly, hence pinning that
  # too. `build_runner` is capped below 2.15.0 (2.15.x tightened its own
  # `analyzer` floor past what 12.x satisfies).
  #
  # Verified end to end against the real Flutter 3.44.8/Dart 3.12.2 SDK:
  # `flutter pub get` resolves, `dart run build_runner build` actually
  # generates `.g.dart` output, and `flutter analyze` is clean (only the
  # two pre-existing, unrelated info-level findings tracked separately).
  build_runner: ">=2.14.0 <2.15.0"
  riverpod_generator: 4.0.4
