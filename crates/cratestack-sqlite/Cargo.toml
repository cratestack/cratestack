[package]
name = "cratestack-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "CrateStack embedded facade — rusqlite-backed SQLite runtime (native + wasm32) plus the shared schema/parser/policy/SQL surface. Pick this crate via `cratestack = { package = \"cratestack-sqlite\" }` for mobile, desktop, browser, or any on-device storage layer."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# Same `[lib]` rename trick as `cratestack-pg`: package is
# `cratestack-sqlite` on crates.io, but the library is named
# `cratestack` so integration tests resolve `::cratestack::*` paths
# directly. External consumers use `cratestack = { package = "cratestack-sqlite" }`.

[lints]
workspace = true

[lib]
name = "cratestack"
path = "src/lib.rs"

[features]
default = ["decimal-rust-decimal", "codec-json"]
# PostGIS query surface (cratestack#842). The embedded backend can never
# execute a spatial op — `include_embedded_schema!` rejects
# `extension postgis { }` outright — so this exists only to keep the
# re-exports resolvable when a workspace enables `postgis` elsewhere and
# Cargo unifies the feature onto this crate's edges. Off by default.
postgis = ["cratestack-rusqlite/postgis", "cratestack-sql/postgis"]
# `cratestack-client-rust/...` (plain, not weak `?`): that dependency is
# mandatory on every target (cratestack#1104 dropped its wasm32 gate), not
# `optional = true`, so weak-dep syntax doesn't apply to it — same as
# `codec-json`'s `cratestack-client-rust/codec-json` forward below.
decimal-rust-decimal = [
    "cratestack-core/decimal-rust-decimal",
    "cratestack-sql/decimal-rust-decimal",
    "cratestack-rusqlite/decimal-rust-decimal",
    "cratestack-client-rust/decimal-rust-decimal",
    "cratestack-macros/decimal-rust-decimal",
    "cratestack-policy/decimal-rust-decimal",
    "cratestack-parser/decimal-rust-decimal",
]
# Mirrors `decimal-rust-decimal` above for the `bigdecimal` backend
# (cratestack#495).
decimal-bigdecimal = [
    "cratestack-core/decimal-bigdecimal",
    "cratestack-sql/decimal-bigdecimal",
    "cratestack-rusqlite/decimal-bigdecimal",
    "cratestack-client-rust/decimal-bigdecimal",
    "cratestack-macros/decimal-bigdecimal",
    "cratestack-policy/decimal-bigdecimal",
    "cratestack-parser/decimal-bigdecimal",
]
# Forwards the JSON codec to the generated client runtime. See
# `cratestack-pg` for rationale.
codec-json = ["cratestack-client-rust/codec-json"]
# Forwards `cratestack-client-rust`'s pluggable HTTP transport
# (cratestack#926) so a consumer reaching this facade can hand the
# generated client a `reqwest_middleware::ClientWithMiddleware` —
# retries, tracing spans, caching — without depending on
# `cratestack-client-rust` directly. Off by default and additive: with
# it off, nothing new enters the dependency graph.
middleware = ["cratestack-client-rust/middleware"]
# Forwards `cratestack-macros`'s own `rate_limit` feature, same as
# `cratestack-pg` (cratestack#154/#161) — lets an embedded schema declare
# `extension rate_limit { }` without hitting `extension_gate`'s
# `compile_error!`. `include_embedded_schema!` doesn't generate any
# `OpDescriptor`s today (that's server-only, `include/server/collect.rs`),
# so this has no observable codegen effect yet; it exists so declaring the
# extension against this facade doesn't fail differently than declaring any
# other known, feature-backed extension would.
rate_limit = ["cratestack-macros/rate_limit"]

[dependencies]
chrono.workspace = true
cratestack-core.workspace = true
cratestack-macros.workspace = true
cratestack-parser.workspace = true
cratestack-policy.workspace = true
cratestack-rusqlite.workspace = true
cratestack-sql.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
# Generated HTTP client runtime — used by `include_client_schema!` on
# hybrid consumers (e.g. a NAPI / Tauri shell, or a browser app, that
# ships an embedded SQLite DB *and* calls a remote backend over HTTP).
# Not target-gated: since cratestack#1104 the runtime builds for
# `wasm32-unknown-unknown` too, where `reqwest` goes through the
# browser's `fetch`.
cratestack-client-rust.workspace = true

[dev-dependencies]
tokio.workspace = true
tracing-subscriber.workspace = true
