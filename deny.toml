[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Apache-2.0 WITH LLVM-exception",
    # OSI-approved, MIT-equivalent-minus-attribution-clause; pulled in by
    # borrow-or-share (fluent-uri -> ls-types -> tower-lsp-server), a direct
    # dependency of the published `cratestack-lsp` crate.
    "MIT-0",
    # OSI-approved permissive license (BSD/MIT-like, with clearer patent
    # language). Pulled in by minicbor / minicbor-serde, direct dependencies
    # of `cratestack-axum` and `cratestack-codec-cbor` — the default wire
    # format for every published server/client crate. Not copyleft.
    "BlueOak-1.0.0",
    # OSI-approved permissive license (Boost Software License). Pulled in
    # by xxhash-rust via `redis`, a dependency of the published
    # `cratestack-redis` and `cratestack-client-store-redis` crates.
    "BSL-1.0",
    # Public-domain-equivalent dedication (FSF Free/Libre); not copyleft.
    # Pulled in by `notify`, used only by the dev-only, unpublished
    # `embedded-daemon-example` (file-watch reload loop).
    "CC0-1.0",
]
confidence-threshold = 0.8

# Per-crate exceptions, NOT a blanket allow. MPL-2.0 is weak copyleft and is
# deliberately excluded from the global `allow` list above so that any
# *other*, not-yet-vetted MPL-2.0 crate that enters the graph still fails
# the gate and gets a human look. The five crates below are individually
# vetted and scoped by name; see the PR/report for the maintainer-facing
# writeup of what each one actually reaches.
exceptions = [
    # cssparser / cssparser-macros / dtoa-short / selectors: reachable only
    # via `dom_query` -> `tauri-utils` -> `tauri`, consumed exclusively by
    # the unpublished `tauri-native-shell-example` / `tauri-web-shell-example`
    # crates (desktop shell examples, not part of the published surface).
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # option-ext: reachable via `dirs-sys` -> `dirs` -> `shellexpand` ->
    # `rust-embed` (the `interpolate-folder-path` feature, needed to expand
    # `$OUT_DIR` in `cratestack-studio`'s `#[folder = "$OUT_DIR/ui-dist"]`
    # embed path) -> the PUBLISHED `cratestack-studio` crate (and, via the
    # same `dirs` dependency, also the tauri examples). This is the one
    # MPL-2.0 exception that touches a published crate's build — flagged
    # explicitly for maintainer sign-off, not a decision made silently here.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
# Left at the default (false): every workspace crate, published or not,
# still gets its license checked — see the unlicensed-crate fixes (adding
# `license.workspace = true` to the example crates) rather than exempting
# them here.
ignore = false

[advisories]
ignore = [
    # --- Unmaintained: proc-macro-error ---
    # Pulled in by glib-macros/gtk3-macros (same Linux tauri webview chain
    # above); no safe replacement exists that gtk-rs 0.18 itself depends on.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained upstream; pulled in via glib-macros/gtk3-macros in the tauri Linux webview chain, only reachable from tauri-native-shell-example / tauri-web-shell-example" },

    # --- Unmaintained: astral-tokio-tar (via testcontainers) ---
    # Astral ended maintenance on 2026-11-03; "no safe upgrade is available".
    # Reachable only through `testcontainers`, a dev-dependency of the PG/Redis
    # test suites — never part of a published crate's normal graph. Revisit
    # when testcontainers moves to a maintained tar implementation (e.g.
    # `tar-codec`, Astral's suggested replacement).
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar, unmaintained upstream (no safe upgrade); dev-only, via testcontainers in the test suites; revisit when testcontainers drops it" },

    # --- Unmaintained: pin-utils (via loom, via kio) ---
    # Upstream archived 2026-10-01; "no safe upgrade is available". Reachable
    # only through `kio`'s `[target."cfg(loom)".dependencies] loom`, under
    # web-transport-quinn. `cfg(loom)` is set only for loom model-checking
    # runs, so no normal build compiles it (`cargo tree -i pin-utils` without
    # `--target all` prints nothing). Revisit when loom drops pin-utils.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, unmaintained upstream (no safe upgrade); only via kio's cfg(loom) target dependency on loom, never compiled in a normal build; revisit when loom drops it" },

    # --- Unmaintained: chrono ---
    # Declared unmaintained upstream; "no safe upgrade is available". `chrono`
    # is a direct dependency of `cratestack-core` and most framework crates
    # (timestamps in the model, wire and codec surface), and its types are
    # part of the public API generated code references, so there is no
    # drop-in replacement to swap in today. Moving to a maintained time crate
    # is a breaking, workspace-wide migration, tracked separately from this
    # advisory. Revisit when that migration lands (or chrono is maintained
    # again).
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained upstream (no safe upgrade); a direct dependency of cratestack-core and most framework crates with no drop-in replacement; migration to a maintained time crate is tracked in https://github.com/cratestack/cratestack/issues/1412; revisit then" },

    # --- Vulnerabilities: quick-xml (via plist, via tauri) — RESOLVED ---
    # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 used to be ignored here. Their
    # own recorded revisit condition was "when tauri ships a plist >=1.10 or
    # an equivalent quick-xml bump" — that has now happened: `plist` moved
    # 1.9.0 -> 1.10.0, which pulls `quick-xml` 0.41.0, at or above the
    # >=0.41.0 fix line for both advisories. `cargo deny check advisories`
    # confirms it by reporting `advisory-not-detected` for both ids, which
    # this configuration treats as a hard failure precisely so a stale
    # ignore cannot outlive the problem it documented. Entries deleted
    # rather than left to rot.
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
