# Layer assignment for every `cratestack-*` workspace crate under `crates/`.
#
# This is the checked-in input to the layer-direction check (ADR 0014,
# `.ci/layer-direction-check.sh`, `just verify-layering`). It encodes ADR
# 0011 §2's assignment table, with one correction applied on top (see the
# `cratestack-macros` comment below) and is the thing
# that must be updated — in the same PR — whenever a crate is added under
# `crates/`. An unassigned crate fails the check; see ADR 0014's "unassigned
# crate" rule.
#
# Scope: only packages whose manifest lives under `crates/` (36 as of this
# writing, 35 of them workspace members — `cratestack-studio-ui` is excluded
# from the workspace and not covered here; cratestack#490's `cratestack-client`
# is included). `examples/*` and
# app-shaped workspace members are consumers of the layered architecture,
# not part of it, and are not covered — neither `docs/design/layering.md`
# nor ADR 0011 assigns them a layer.
#
# Rule (layering.md §3 / ADR 0011 decision 1): a crate at layer N may depend
# on crates at layers <= N, and on nothing at layer > N (checked for NORMAL
# dependencies only, including target-gated ones; dev- and build-dependencies
# are exempt — see the checker script's header for why build- joins dev-).
#
# Roles other than a numeric layer:
#   - tool:    may depend on anything; nothing outside the tool set may
#              depend on a tool (ADR 0011 decision 2 / ADR 0014 decision 3).
#   - vitrine: the single documentation-only `cratestack` crate. Same
#              enforcement shape as a tool (may depend on anything, nothing
#              may depend on it) but recorded under its own name because it
#              is not a tool in ADR 0011's vocabulary — it is the empty
#              vitrine explicitly called out in ADR 0011 §2's table footnote
#              ("has no layer"). It has zero dependencies and zero
#              dependents at the time of writing, so the distinction is
#              currently unobservable in practice; it exists so a reader
#              matching this file against the ADR isn't left wondering where
#              `cratestack` went.
#
# L3 (Execution) had no members until ADR 0015 (accepted, amended
# 2026-09-03) settled building it; `cratestack-exec` is its first and, as
# of this writing, only member. The original instruction — "do not add a
# crate here merely to fill the slot" — is unchanged and still the rule:
# what got L3 built was a concrete admission decision that had to be made
# from something other than an `http::Request`, not the emptiness of the
# slot. See the L3 section below and layering.md §5.1.

[layers]
# --- L0: Schema IR -----------------------------------------------------
cratestack-parser = 0
# `cratestack-core` is a *stated exception* (ADR 0011 §3 / layering.md §7):
# `schema` is L0, `store`/`audit`/`codec` are L1, and the rest of its twenty
# modules are runtime vocabulary consumed at L2-L5. It has zero workspace
# dependencies, so it cannot itself violate the rule regardless of which
# number it is given; L0 is the safe conservative choice because it is
# depended on by crates at every other layer (dep.layer <= self.layer holds
# trivially for all of them at L0). Not proposed for splitting.
cratestack-core = 0

# --- L1: Contracts -------------------------------------------------------
cratestack-policy = 1
cratestack-sql = 1
# ADR 0014's Context section (as drafted) claimed no single integer works
# for cratestack-macros, on the theory that L5 depends on it while it must
# not depend on L2, and "anything low enough to forbid macros -> sqlx is too
# low for pg -> macros". That claim does not survive verification against
# the real graph. cratestack-macros's actual normal workspace dependencies
# (`crates/cratestack-macros/Cargo.toml`) are exactly: cratestack-core,
# cratestack-parser, cratestack-policy — all L0/L1. L1
# satisfies `dep.layer <= self.layer` with no exception: every L2-L5 crate
# that depends on macros (cratestack-pg, cratestack-api, cratestack-sqlite,
# all L5) sees 1 <= 5, and macros's own dependencies are all <= 1. No L2
# crate depends on macros in the real graph (verified via `cargo metadata`),
# so the "must not depend on L2" half of the constraint is satisfied simply
# by macros never appearing on the wrong side of an L2 edge — not by a
# bespoke predicate. See this PR's description for the verification command.
cratestack-macros = 1
# `cratestack-auth` (new, "absorb the auth kit into the framework"): SigV4-
# style Ed25519 signed-request auth, SD-JWT id-token issuance/verification,
# multi-issuer JWKS resolution, per-service signing identities, and
# COSE-signed enrolment challenges. Its axum middleware/router/extractor
# surface (`require_signed_request`, `jwks_router`, the `FromRequestParts`
# impls) is gated behind this crate's own default-on `axum` Cargo feature —
# not a `cratestack-axum` dependency — because the underlying types it needs
# (`AuthProvider`, `CratestackContext`, `RequestContext`, `CratestackError`) live in
# `cratestack-core`, and the header/method/URI types it needs unconditionally
# come from the plain `http` crate (which `cratestack-axum` itself only
# re-exports), not from `cratestack-axum`. Its only normal in-workspace
# dependency, under EITHER feature state, is `cratestack-core` (L0) — same
# "lowest layer the real graph supports" rule `cratestack-macros`
# uses above, verified via `cargo tree -p cratestack-auth
# -e normal` (with and without `--no-default-features`): both report exactly
# one cratestack-* line, `cratestack-core`. L1 satisfies `dep.layer <=
# self.layer` with no exception, and nothing in the workspace depends on
# `cratestack-auth` yet (a leaf, consumed directly by application binaries),
# so the upper-bound half of the rule is vacuous, same as every crate in this
# section.
cratestack-auth = 1

# --- L2: Adapters ----------------------------------------------------------
cratestack-sqlx = 2
cratestack-rusqlite = 2
cratestack-redis = 2
cratestack-codec-cbor = 2
cratestack-codec-json = 2
# These two are the live #475 violation (client-store-* -> client-rust, an
# L2 -> L4 edge). They stay at L2 per ADR 0011 §2 / layering.md §2's stated
# assignment — the point of this check is to make the existing violation
# visible and trackable via the allowlist
# (.ci/layer-direction-allowlist.toml), not to launder it by reclassifying
# the crates. Do not "fix" this file to make the edge legal.
cratestack-client-store-sqlite = 2
cratestack-client-store-redis = 2
# `cratestack-service` (new, "absorb service-bootstrap helpers into the
# framework"): does not fit any of L0-L5's prose descriptions cleanly — it
# is neither a schema-IR crate, a backend-specific adapter, a wire-protocol
# binding, nor a rename-plus-re-exports facade (`layering.md` §2's L5 rule,
# "a facade that grows a function has stopped being a facade", rules out
# putting this logic in `cratestack-pg` directly). Same reasoning
# `cratestack-macros` used above: assign the lowest
# number its REAL graph supports, not a role invented to fit the prose.
# Its only normal workspace dependencies are `cratestack-core` (L1,
# `CratestackError`) and, behind its optional `postgres` feature,
# `cratestack-sqlx` (L2, `Migration`/`apply_pending`/`PgPool`) — both <= 2.
# L2 is a complete, exception-free assignment: nothing in the workspace
# depends on `cratestack-service` (it is a leaf, consumed directly by
# application binaries outside the workspace, the same posture every
# facade already has), so the "must not be depended on by anything above
# its layer" half of the rule is satisfied vacuously.
cratestack-service = 2
# `cratestack-outbox` (new, "absorb the transactional outbox into the
# framework"): the source crate (`events-kit`) embedded a cratestack schema
# via `include_server_schema!(db = Postgres)`, which only reaches the
# `cratestack-pg` L5 facade — that would have forced this crate to L5 for a
# macro whose generated typed accessors were, per the source crate's own
# module doc, never actually called (every real read/write already ran raw
# `sqlx`, to keep the JSONB payload shape plain rather than cratestack's
# typed `Json<Value>` external-tagging). The macro was therefore dropped
# rather than ported: this crate hand-writes its one table directly against
# `cratestack-sqlx`, the same posture `cratestack-sqlx` itself takes for its
# own internal `cratestack_audit`/`cratestack_migrations` tables (bare DDL
# constant + hand-written queries, no schema macro). Its only normal
# workspace dependencies are `cratestack-core` (L1, `CratestackError`/
# `TransactionIsolation`) and `cratestack-sqlx` (L2, the `sqlx` re-export,
# `run_in_isolated_tx_with_retries`, `cratestack_error_from_sqlx`) — both <= 2, so
# L2 is a complete, exception-free assignment by the same "lowest number the
# real graph supports" rule `cratestack-service`/`cratestack-macros` use
# above. Unlike `cratestack-service`, `cratestack-sqlx` is an unconditional
# (not feature-gated) dependency here — see this crate's `Cargo.toml` for
# why a `postgres` feature would be meaningless for a crate whose only
# reason to exist is a Postgres transaction. Nothing in the workspace
# depends on it (a leaf, consumed directly by application binaries), so the
# "must not be depended on by anything above its layer" half of the rule is
# satisfied vacuously, same as every other crate in this section.
cratestack-outbox = 2
# `cratestack-cose` (ADR 0006 §11, as amended while scoping P0;
# cratestack#1005): the COSE_Sign1 / COSE_Mac0 envelope, one implementation
# shared by the server and every client. Two normal workspace
# dependencies: `cratestack-core` (L0) always, and `cratestack-auth` (L1)
# only behind its off-by-default `auth` feature (the `ServiceSigningKey` /
# `DeviceKeyResolver` adapters, the Redis nonce bridge and the enrolment
# code moved out of auth). `cargo tree -p cratestack-cose -e normal` lists
# only `cratestack-core`; with `--features auth` it adds `cratestack-auth`.
# This check reads `cargo metadata`, which lists an optional dependency
# whether or not its feature is on, so it checks the `auth` edge too:
# `dep.layer <= self.layer` holds for both with no exception. The edge
# points cose -> auth, never auth -> cose. It sits at L2 by the
# maintainer's decision (ADR 0006, "Decisions taken while scoping P0"),
# not by the lowest-supported-layer rule `cratestack-macros` and
# `cratestack-auth` follow above: it is an adapter over a wire format, like
# the codecs in this section, and its `auth` edge to `cratestack-auth`
# (L1) needs L2 or above. Nothing depends on it yet;
# its consumers-to-be are `cratestack-axum`, `cratestack-client-rust` and
# the wasm/napi bindings (all L4), so the upper-bound half of the rule
# reads 2 <= 4 and needs no allowlist entry.
cratestack-cose = 2

# --- L3: Execution -----------------------------------------------------
# `cratestack-exec` (ADR 0015 slices 1 and 2): idempotency and rate-limit
# ADMISSION, expressed once against `(op participation flags, principal,
# idempotency key, request fingerprint, rate-limit bucket)` with no
# knowledge of how the caller arrived. `cratestack-axum`'s
# `IdempotencyLayer` and `RateLimitLayer` are thin adapters over it.
# Its normal workspace dependencies are exactly `cratestack-core` (L0) —
# `dep.layer <= self.layer` holds with no exception — and the two
# exclusions layering.md §2 states for this layer are what keep the list
# that short: nothing transport-shaped (no `http`/`tower`/`axum` edge) and
# nothing backend-shaped (no `sqlx`/`rusqlite` edge). Depended on by
# `cratestack-axum` (L4), so the upper-bound half of the rule reads
# 3 <= 4 and needs no allowlist entry.
cratestack-exec = 3

# --- L4: Bindings --------------------------------------------------------
cratestack-axum = 4
cratestack-client-rust = 4
cratestack-client-dart = 4
cratestack-client-typescript = 4
cratestack-client-flutter = 4
cratestack-cbor-napi = 4
cratestack-cbor-wasm = 4
# `cratestack-mcp` (ADR 0002 § Crate layout, cratestack#1038): one wire
# protocol's encode, decode and routing, next to `cratestack-axum`. Its
# normal workspace dependencies are exactly `cratestack-core` (L0) and
# `cratestack-exec` (L3, admission only — ADR 0002 D2), so `dep.layer <=
# self.layer` holds with no exception, and it has no database edge: tools
# reach the database only through the per-schema module the macro generates
# into the consuming crate. Depended on only by `cratestack-pg` and
# `cratestack-api` (L5), optionally, behind their `mcp` feature (D3).
cratestack-mcp = 4

# --- L5: Facades -----------------------------------------------------------
cratestack-pg = 5
cratestack-api = 5
cratestack-sqlite = 5
# cratestack#490: fourth facade, for pure HTTP-client SDK crates —
# `include_client_schema!` plus the generated Rust client runtime, with
# `cratestack-axum` structurally absent. Its own normal workspace
# dependencies (`crates/cratestack-client/Cargo.toml`) are exactly
# cratestack-core (L0), cratestack-macros (L1), cratestack-sql (L1), and
# cratestack-client-rust (L4) — all `dep.layer <= 5`, same shape as the
# other three L5 facades above.
cratestack-client = 5

[tools]
cratestack-cli = true
cratestack-lsp = true
cratestack-migrate = true
cratestack-studio = true
cratestack-mock-wiremock = true

[vitrine]
cratestack = true
