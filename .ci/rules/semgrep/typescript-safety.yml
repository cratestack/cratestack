rules:
  - id: ts-console-log
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.debug(...)
      - pattern: console.info(...)
    message: |
      console.log() called in code.
      Use a structured logger (pino, winston, or similar) instead.
      Console output is not suitable for production logging.
    languages: [typescript, javascript]
    severity: WARNING
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/*.test.js"
        - "**/*.spec.js"
    metadata:
      category: maintainability
      cwe: CWE-532

  - id: ts-any-type
    # Every pattern here must be a COMPLETE TypeScript construct, not the
    # fragment of one that reads naturally in prose. This rule previously
    # used `": any"` and `"as any"`, and BOTH are unparseable on their own:
    # semgrep rejected the whole rule with
    #   Rule parse error in rule ci.rules.semgrep.ts-any-type:
    #    Invalid pattern for TypeScript: Stdlib.Parsing.Parse_error
    # on every single run since it was written. A rule parse error takes the
    # rule out entirely — the valid-looking `as any` half never ran either.
    # Measured against the pinned semgrep 1.171.0: `"as any"` alone fails the
    # same way; `"$X as any"` parses.
    #
    # Coverage is the four commonest forms, verified on a fixture holding one
    # of each. Two forms are knowingly NOT covered because no parseable
    # standalone pattern for them was found: an arrow parameter
    # (`(y: any) => y`) and an interface member (`interface I { p: any }`).
    #
    # A `pattern-regex: '(:|\bas)\s*any\b'` WOULD cover all six, and was
    # rejected on evidence rather than on principle: run against this
    # repository it produced exactly one finding, and that finding was the
    # phrase "same as any direct API consumer would" inside a comment in
    # examples/react-vite-refine/web/scripts/verify.ts. Semgrep patterns do
    # not see comments; a regex does. One false positive out of one finding
    # is the wrong trade for a rule whose whole job is signal.
    #
    # Findings from the patterns below, across the whole repository at the
    # time of the fix: zero. Restoring this rule adds no noise — it only
    # stops semgrep reporting a rule error on every run.
    pattern-either:
      - pattern: "$X as any"
      - pattern: "let $X: any = $Y"
      - pattern: "const $X: any = $Y"
      - pattern: "var $X: any = $Y"
      - pattern: "function $F(...): any { ... }"
    message: |
      TypeScript any type used; this defeats type safety.
      Use a concrete type, unknown with runtime checks, or generics instead.
    languages: [typescript]
    severity: WARNING
    metadata:
      category: reliability

  - id: ts-async-without-await
    pattern: |
      async $FUNC(...) {
        ...
        $X(...)
        ...
      }
    message: |
      Async function that may not actually be async.
      If the function doesn't await anything, it doesn't need async keyword.
    languages: [typescript, javascript]
    severity: INFO
    metadata:
      category: style

  - id: ts-no-non-null-assertion
    pattern: "!$VAR"
    message: |
      Non-null assertion (!) used.
      If the value might be null, handle it explicitly.
      If it can't be null, the type system should reflect that.
    languages: [typescript]
    severity: WARNING
    metadata:
      category: reliability
      cwe: CWE-476

  - id: ts-hardcoded-secrets
    pattern-either:
      - pattern: "password: '...'"
      - pattern: 'password: "..."'
      - pattern: "apiKey: '...'"
      - pattern: 'apiKey: "..."'
      - pattern: "token: '...'"
      - pattern: 'token: "..."'
    message: |
      Hardcoded secret found in code.
      Use environment variables or secret management system instead.
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-798

  - id: ts-http-hardcoded-url
    pattern-either:
      - pattern: "fetch('http://...')"
      - pattern: 'fetch("http://...")'
    message: |
      Hardcoded HTTP URL found.
      Use environment variables for service URLs, especially in tests.
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: maintainability
