# Gitleaks allowlist — see .ci/baselines/README.md for the suppression
# process. gitleaks scans git history by commit; a since-fixed false
# positive stays flagged on the commit that introduced it forever, even
# after a later commit in the same branch corrects it, so a rename in a
# follow-up commit alone does not clear a finding here.
#
# [extend] pulls in gitleaks' full default ruleset so every commit not
# listed below still gets normal detection.

title = "cratestack quality-pipeline gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives — see .ci/baselines/README.md"

