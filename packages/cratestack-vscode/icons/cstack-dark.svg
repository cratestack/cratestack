<!--
  `.cstack` file-type icon, dark-theme variant. No background plate:
  a file icon sits on the host's own background.

  Geometry measured from the shipped mark (icon.png), not eyeballed — see
  gen-svg.py in the brand asset tooling. All CrateStack marks share one
  definition so the app icon, logomark and file icons cannot drift apart.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>CrateStack schema file</title>

  <!-- bottom crate -->
  <polygon points="16,13.89 27.55,19.47 16,25.06 4.45,19.47" fill="#F7B270"/>
  <polygon points="4.45,19.47 16,25.06 16,30.5 4.45,24.91" fill="#E88A3A"/>
  <polygon points="27.55,19.47 16,25.06 16,30.5 27.55,24.91" fill="#BF6A26"/>

  <!-- middle crate -->
  <polygon points="16,7.69 27.55,13.28 16,18.87 4.45,13.28" fill="#F7B270"/>
  <polygon points="4.45,13.28 16,18.87 16,24.31 4.45,18.72" fill="#E88A3A"/>
  <polygon points="27.55,13.28 16,18.87 16,24.31 27.55,18.72" fill="#BF6A26"/>

  <!-- top crate -->
  <polygon points="16,1.5 27.55,7.09 16,12.68 4.45,7.09" fill="#F7B270"/>
  <polygon points="4.45,7.09 16,12.68 16,18.11 4.45,12.53" fill="#E88A3A"/>
  <polygon points="27.55,7.09 16,12.68 16,18.11 27.55,12.53" fill="#BF6A26"/>
</svg>
