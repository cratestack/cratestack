[package]
name = "rpc-batch-debounce-example"
version = "0.1.0"
edition = "2024"
publish = false
description = "Client-side debouncer that coalesces independent RPC calls into a single POST /rpc/batch. The pattern most offline-first UIs and rate-sensitive callers want — many awaitable .call() invocations, one wire round-trip."

[[bin]]
name = "rpc-batch-debounce-demo"
path = "src/main.rs"

[dependencies]
# `cratestack-api` (cratestack#347) is the first-class no-database facade —
# `sqlx`/`cratestack-sqlx` are not a dependency of this crate at all, under
# any feature. This schema is `db = None`, so they were never needed. See
# `examples/no-database-verification-api` for the `cargo tree` proof.
cratestack = { package = "cratestack-api", path = "../../crates/cratestack-api" }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true }
