[package]
name = "sync-notes-client"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Device half of the sync-notes example: schema.cstack through include_embedded_schema!, a cratestack-sync client engine, and a wasm-bindgen surface the demo page's workers drive. Compiles natively (for tests) and to wasm32-unknown-unknown with OPFS persistence."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
cratestack = { package = "cratestack-sqlite", path = "../../../crates/cratestack-sqlite" }
cratestack-macros = { path = "../../../crates/cratestack-macros" }
cratestack-rusqlite = { path = "../../../crates/cratestack-rusqlite" }
cratestack-sync = { path = "../../../crates/cratestack-sync", features = ["client"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
