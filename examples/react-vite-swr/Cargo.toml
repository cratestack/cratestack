[package]
name = "react-vite-swr-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Postgres + axum REST server for the swr-preset end-to-end example (issue #306): a two-model task board plus one procedure, consumed by web/ through a generated --preset swr TypeScript client."

[[bin]]
name = "react-vite-swr-server"
path = "src/main.rs"

[lib]
name = "react_vite_swr_example"
path = "src/lib.rs"

[dependencies]
cratestack = { package = "cratestack-pg", path = "../../crates/cratestack-pg" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
serde = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
