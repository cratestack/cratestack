# This example is a small, self-contained two-package pnpm workspace
# (mirroring `examples/react-nextjs-daisyui/pnpm-workspace.yaml`'s
# napi+web split): `client/` is the generated `--swr` TypeScript
# package, `web/` is the React app that depends on it via
# `"react-vite-swr-client": "workspace:*"`. `examples/*` is deliberately
# NOT part of the root pnpm workspace (see `package.json`'s own
# description) — this file makes `examples/react-vite-swr` its own
# workspace root instead, so `pnpm install` run anywhere under this
# directory resolves here, not at the repo root.
packages:
  - "client"
  - "web"
