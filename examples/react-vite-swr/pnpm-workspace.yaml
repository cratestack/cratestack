# This example is a small, self-contained two-package pnpm workspace
# (mirroring `examples/react-nextjs-daisyui/pnpm-workspace.yaml`'s
# napi+web split): `client/` is the generated `--swr` TypeScript
# package, `web/` is the React app that depends on it via
# `"react-vite-swr-client": "workspace:*"`. `examples/*` is deliberately
# NOT part of the root pnpm workspace (see `package.json`'s own
# description) — this file makes `examples/react-vite-swr` its own
# workspace root instead, so `pnpm install` run anywhere under this
# directory resolves here, not at the repo root.
packages:
  - "client"
  - "web"
# pnpm 10+ does not run dependency build (postinstall) scripts unless they
# are listed here; pnpm 9 ran them all. Without this key pnpm 11 *fails*
# `pnpm install` outright (ERR_PNPM_IGNORED_BUILDS), which takes down this
# example's CI job (`js (react-vite-swr example)`) at its
# `pnpm install --frozen-lockfile` step — so the key is load-bearing, not
# cosmetic. esbuild is denied deliberately, matching the root
# `pnpm-workspace.yaml`'s decision: its binary ships via the
# `@esbuild/<platform>` optional dependency, not the install script.
# Verified with the script denied: `pnpm --filter react-vite-swr-client run
# build`, `--filter react-vite-swr-web run typecheck`, and `run lint` all
# pass. Flip to `true` only with evidence that the denied build breaks
# something.
allowBuilds:
  esbuild: false
