[package]
name = "rpc-batch-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "RPC server demonstrating POST /rpc/batch: multiple ops in one round-trip, per-frame error isolation, request order preserved on the response."

[[bin]]
name = "rpc-batch-server"
path = "src/main.rs"

[dependencies]
# `cratestack-api` (cratestack#347) is the first-class no-database facade —
# `sqlx`/`cratestack-sqlx` are not a dependency of this crate at all, under
# any feature. This schema is `db = None`, so they were never needed. See
# `examples/no-database-verification-api` for the `cargo tree` proof.
cratestack = { package = "cratestack-api", path = "../../crates/cratestack-api" }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
