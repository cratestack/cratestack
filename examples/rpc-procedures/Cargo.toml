[package]
name = "rpc-procedures-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Smallest possible CrateStack RPC server: a query procedure and a mutation procedure exposed over POST /rpc/{op_id}. Genuinely no database — `datasource { provider = \"none\" }` + `db = None`, no PgPool, no sqlx compiled in."

[[bin]]
name = "rpc-procedures-server"
path = "src/main.rs"

[dependencies]
# `cratestack-api` (cratestack#347) is the first-class no-database facade —
# `sqlx`/`cratestack-sqlx` are not a dependency of this crate at all, under
# any feature, so there's nothing to opt out of. This schema is `db = None`
# and never needed them. Verified with
# `examples/no-database-verification-api`'s `cargo tree` check.
cratestack = { package = "cratestack-api", path = "../../crates/cratestack-api" }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { workspace = true }
