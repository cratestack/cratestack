[package]
name = "microservice-pair-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Service that is both a server (include_server_schema!) and a typed HTTP client of another service (include_client_schema!). Demonstrates the 'orders service that calls the catalog service' shape."

[lints]
workspace = true

[[bin]]
name = "orders-service"
path = "src/main.rs"

[dependencies]
cratestack = { package = "cratestack-pg", path = "../../crates/cratestack-pg" }
cratestack-client-rust = { path = "../../crates/cratestack-client-rust" }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
cratestack-codec-json = { path = "../../crates/cratestack-codec-json" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
