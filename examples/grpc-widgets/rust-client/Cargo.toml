[package]
name = "grpc-widgets-rust-client-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Native tonic-based Rust gRPC client for the grpc-widgets example schema, built via include_client_schema! (ticket #209)."

[[bin]]
name = "grpc-widgets-rust-client"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
cratestack = { package = "cratestack-pg", path = "../../../crates/cratestack-pg", features = [
    "grpc",
] }
# `prost` must be a direct dependency here, not just reachable via
# `cratestack::grpc::prost` — see `crates/cratestack-grpc/src/lib.rs`'s
# module doc: `prost_derive`'s `#[derive(Message)]` expansion (which
# `include_client_schema!`'s gRPC codegen emits for every `pb::` mirror
# struct, same as the server) hardcodes bare `::prost::...` paths with no
# `#[prost(crate = "...")]` escape hatch.
prost = { workspace = true }
# Same requirement as `prost` above, pre-existing for every REST/RPC
# example already (`serde_derive`'s scoped `extern crate serde as
# _serde;`) — the gRPC codegen path doesn't change this, it just adds a
# second derive macro with the identical constraint.
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
