[package]
name = "rpc-streaming-client-rust-example"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Rust binary that consumes an `application/cbor-seq` stream from a `transport rpc` server via RpcClient::call_streaming. Companion to the `rpc-streaming-example` server crate."

[lints]
workspace = true

[[bin]]
name = "rpc-streaming-client"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
cratestack = { package = "cratestack-pg", path = "../../crates/cratestack-pg" }
cratestack-client-rust = { path = "../../crates/cratestack-client-rust" }
cratestack-codec-cbor = { path = "../../crates/cratestack-codec-cbor" }
serde = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# `tests/smoke.rs` spawns the REAL `rpc-streaming-example` router
# in-process (rather than a hand-rolled mock) so it exercises actual
# HTTP content negotiation — see that file's module doc.
axum = { workspace = true }
rpc-streaming-example = { path = "../rpc-streaming" }
