name: cratestack_cbor
# Kept under pub.dev's recommended 60-180 char range (pana flags longer
# descriptions as truncated in search results) — see README.md and
# docs/tooling/dart-publishing.md for the full picture this necessarily
# compresses.
description: >-
  Native CBOR codec for CrateStack Dart/Flutter: flutter_rust_bridge
  (native, vendored) and wasm-bindgen (web, vendored), mirroring
  @cratestack/cbor conditional exports for JS.
version: 0.8.7
homepage: https://cratestack.dev
repository: https://github.com/cratestack/cratestack
issue_tracker: https://github.com/cratestack/cratestack/issues
topics:
  - cbor
  - codec
  - rpc

environment:
  sdk: ^3.5.0
  # Required once `flutter:` below declares `plugin.platforms`
  # (cratestack#563) — pub validates that key against a declared Flutter
  # constraint. Unrelated to (and does not imply) a `flutter: sdk: flutter`
  # entry in `dependencies:` below — see that section's comment for why
  # this package deliberately has none.
  #
  # STILL >=1.20.0 even though `ios/` now exists (cratestack#563's iOS
  # slice) — but the RATIONALE changed, so this comment is rewritten rather
  # than left in place. The original reason no longer applies: this
  # constraint used to exist *solely* to clear pub.dev's server-side
  # rejection of a plugin that omits an `ios/` folder before Flutter 1.20
  # ("pubspec.yaml allows Flutter SDK version prior to 1.20.0, which does
  # not support having no `ios/` folder" — `dart pub publish --dry-run` did
  # NOT catch this locally; only the real pub.dev server did). Now that
  # `ios/` is present, that specific rejection is void.
  #
  # The floor stays >=1.20.0 anyway, on an independent and still-current
  # ground: `flutter.plugin.platforms` itself (used by every platform key
  # below, `ios` included) is a Flutter-plugin pubspec key with no meaning
  # before Flutter's own plugin-platforms format existed, and 1.20.0 is
  # comfortably below every platform actually supported here (this repo
  # pins Flutter 3.44.1 — see docs/tooling/cratestack-cbor-development.md).
  # Nothing shipping Dart 3.5 (`sdk: ^3.5.0` above, the real floor) is on a
  # Flutter this old, so raising this number further would not change what
  # anyone can actually install; lowering it would risk reopening the
  # no-`ios/`-folder-style server-side surprise for some other unforeseen
  # plugin-platforms edge case. Left as-is deliberately, not re-derived from
  # scratch, since a maintainer picked this figure with the fuller history
  # docs/tooling/dart-publishing.md still records.
  flutter: ">=1.20.0"

dependencies:
  # Pinned exact, matching crates/cratestack-client-flutter/Cargo.toml's
  # `flutter_rust_bridge = "=2.12.0"` — the generated `lib/src/native/rust/`
  # glue in this package was produced by that exact codegen version and is
  # not forward/backward compatible across releases.
  flutter_rust_bridge: 2.12.0
  # Web backend only (dart:js_interop-based loader in lib/src/web/) — see
  # lib/src/web/web_cbor_codec.dart for why a real dependency, not just an
  # ambient dart:html/dart:js_interop import, is needed (DOM element types).
  web: ^1.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Declared even though this package has no Flutter-framework Dart code of
# its own (no widgets, no `package:flutter` import) — cratestack#563's
# "Flutter app integration" slice. Two things live here:
#
# 1. `plugin.platforms.linux.ffiPlugin: true` registers this as a Flutter
#    FFI plugin for Linux, following the same shape `flutter create -t
#    plugin_ffi` generates (see linux/CMakeLists.txt). Flutter's plugin
#    tooling scans every dependency's pubspec for this key regardless of
#    whether the package also depends on the `flutter` SDK — a real
#    `flutter build linux` picks this up purely from this section (see
#    docs/tooling/cratestack-cbor-development.md for the verification
#    transcript). This is what makes the vendored `.so`
#    (`blobs/linux-x64/libcratestack_client_flutter.so`) land inside a
#    built app's `bundle/lib/`, instead of relying on the
#    `Isolate.resolvePackageUri` dev-mode path (`dart test`/`dart run`)
#    that already worked before this slice — see
#    `lib/src/native/native_cbor_codec.dart` for both strategies.
# 1b. `plugin.platforms.android.ffiPlugin: true` is the Android analogue —
#    see `android/build.gradle`, which packages the per-ABI vendored
#    libraries (`blobs/android/<abi>/libcratestack_client_flutter.so`,
#    produced by `just cbor-vendor-android`) into the APK via the standard
#    `jniLibs.srcDirs` mechanism (no CMake/NDK invocation at consumer
#    build time — same "vendor, don't build" constraint as Linux). Unlike
#    Linux, Android's dynamic linker resolves a bundled library by bare
#    SONAME from the app's native library directory, so
#    `native_cbor_codec.dart`'s Android branch needs no path computation
#    at all (contrast the two Linux strategies just above).
# 1c. `plugin.platforms.windows.ffiPlugin: true` is the Windows analogue —
#    see `windows/CMakeLists.txt`, which hands the vendored
#    `blobs/windows-x64/cratestack_client_flutter.dll` (produced by `just
#    cbor-vendor-lib windows-x64`) to the SAME `<plugin>_bundled_libraries`
#    mechanism Linux uses (one shared Flutter-SDK template renders both).
#    The install destination differs, though (see that file's header
#    comment), which is why `native_cbor_codec.dart`'s Windows branch
#    looks for the `.dll` right next to the built `.exe` rather than in a
#    `lib/` subdirectory.
# 1d. `plugin.platforms.macos.ffiPlugin: true` is the macOS analogue — but
#    a genuinely different MECHANISM from the other three, not a relocated
#    copy: see `macos/cratestack_cbor.podspec`, which hands the vendored
#    universal `macos/Frameworks/CratestackCborNative.xcframework`
#    (produced by `just cbor-vendor-macos`) to CocoaPods'
#    `vendored_frameworks`, not Flutter's `<plugin>_bundled_libraries`
#    CMake mechanism the other desktop platforms share. `flutter build
#    macos` LINKS (not merely copies) the vendored framework via CocoaPods,
#    which is what lets `native_cbor_codec.dart`'s macOS branch resolve it
#    with a fixed relative string and no path computation at all — see
#    that file's doc comment and the podspec's own header comment for the
#    full mechanism, verified on a real `macos-latest` runner
#    (`spike/cbor-macos-xcframework`).
# 1e. `plugin.platforms.ios.ffiPlugin: true` is the iOS analogue
#    (cratestack#563's iOS slice) — the SAME CocoaPods `vendored_frameworks`
#    mechanism macOS uses (`ios/cratestack_cbor.podspec`, hands the vendored
#    `ios/Frameworks/CratestackCborNative.xcframework` — produced by `just
#    cbor-vendor-ios` — to CocoaPods, which LINKS it the same way), so
#    `native_cbor_codec.dart`'s iOS branch resolves it with the exact same
#    fixed relative string macOS uses. The one genuine difference is the
#    xcframework's own internal shape, not the Dart-/Pod-side mechanism: an
#    iOS xcframework wraps FLAT ("shallow") frameworks — device arm64 plus
#    a universal (`lipo`'d) simulator arm64+x86_64 slice — with no
#    `Versions/A/...` indirection and no symlinks, unlike macOS's versioned
#    bundle; see `ios/cratestack_cbor.podspec`'s and `just
#    cbor-vendor-ios`'s own header comments for why that also means iOS
#    ships its xcframework UNPACKED rather than zipped.
# 2. `assets` vendors the wasm-web artifact
#    (`lib/src/web/wasm-pkg/cratestack_cbor_wasm{,_bg}.{js,wasm}`) so a
#    release `flutter build web` actually copies them into
#    `build/web/assets/packages/cratestack_cbor/...` — unlike the
#    `dart.library.io` case, plain `dart test -p chrome`/`flutter run -d
#    chrome` already found these via the dev server's `packages/...` URL
#    convention (see `lib/src/web/web_cbor_codec.dart`), but a release
#    bundle has no such dev server and needs them declared as real assets.
#
# No `flutter: sdk: flutter` dependency is declared above deliberately:
# this package must keep working under plain `dart pub get`/`dart test`
# with no Flutter SDK present at all (native backend via
# `Isolate.resolvePackageUri`, web backend via `dart test -p chrome`) —
# see docs/tooling/cratestack-cbor-development.md. Adding that dependency
# is not required for the `flutter:` key below to be honored by the
# Flutter tool (verified empirically, not assumed — see this PR's
# verification transcript), and it would otherwise impose the Flutter SDK
# on non-Flutter Dart consumers for no benefit.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
  assets:
    - lib/src/web/wasm-pkg/cratestack_cbor_wasm.js
    - lib/src/web/wasm-pkg/cratestack_cbor_wasm_bg.wasm
