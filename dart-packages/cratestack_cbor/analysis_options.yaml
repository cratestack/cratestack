include: package:lints/recommended.yaml

analyzer:
  exclude:
    # @generated by flutter_rust_bridge_codegen — see lib/src/native/rust/.
    - "lib/src/native/rust/**"
    # Vendored, unformatted third-party JS from wasm-pack — not Dart.
    - "lib/src/web/wasm-pkg/**"

linter:
  rules:
    public_member_api_docs: false
